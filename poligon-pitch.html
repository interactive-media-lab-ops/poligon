  { id:"R11", title:"Соцсупровід у вертикалі напряму", when:"«Соцсупровід» у вертикалі напряму і має виконавця",
    test:h=> h.owned("social") && h.inLane("social","ppp"),
    apply:(r,h)=>{ const coy=h.reaches("social","coy"); r.cost("social", coy?r.k("r11_social_coy"):r.k("r11_social_bn"), "офіцери соцсупроводу в ротах не з'являються"); r.q("Соцсупровід: 21 інформант за, 17 проти, 10 частково; напрям сам каже «не потягнемо»"); r.ev("KC-19","TR-23","TR-11"); } },
  { id:"R12", title:"Соцсупровід без виконавця", when:"Блок «Соцсупровід» знято з дошки або призначений вертикалі без структури на цьому рівні",
    test:h=> !h.owned("social"),
    apply:(r,h)=>{ r.cost("social",r.k("r12_social"),"стікає на ЗКР"); r.risk("social_orphan"); r.risk("drain_down"); r.owner("social","drain"); r.norm("n27","наказ про соцсупровід не виконується"); r.ev("NM-03","TR-23"); } },

  { id:"R15", title:"Обов'язки командира на КСП", when:"На роті і в батальйоні є заступник з ППП: командир використовує його як резерв на КСП і позиціях",
    test:h=> h.lowestIn("ppp") >= li("bn"),
    apply:(r,h)=>{ r.cost("ksp",r.k("r15_ksp")); r.cost("other",r.k("r15_other")); r.ev("GU-06"); } },
  { id:"R16", title:"Інші непрофільні задачі на бригаді", when:"Завжди: зовнішня комунікація бригади, волонтери, чергування",
    test:h=> true,
    apply:(r,h)=>{ if(h.lowestIn("ppp") < li("bn")) r.cost("other",r.k("r16_other")); r.ev("GU-11"); } },

  { id:"R20", title:"Ротна ланка без норми", when:"На роті стоїть ЗК з ППП, а обов'язків окремим переліком немає",
    test:h=> h.stc("zkr") && !h.t("zkrduty"),
    apply:(r,h)=>{ r.norm("n349","обов'язки ЗК роти: додаток 5"); r.risk("statute_gap"); r.owner("moral","short"); r.ev("NM-01","KC-01"); } },
  { id:"R21", title:"Обов'язки ЗК роти закріплено", when:"Увімкнено перелік обов'язків ЗК роти",
    test:h=> h.t("zkrduty"),
    apply:(r,h)=>{ r.norm("n349","доповнення до додатка 5 і № 431 п. 2.10.7"); r.note("lowest","Обов'язки ЗК роти закріплено окремим переліком: 8 напрямів замість 0"); r.ev("NM-01"); } },
  { id:"R22", title:"Рота без посади напряму", when:"На роті немає ані ЗК з ППП, ані хорунжого",
    test:h=> !h.stc("zkr") && !h.stc("khor_r"),
    apply:(r,h)=>{ r.risk("invisible"); r.barrier("invisible",r.k("r22_invisible")); r.note("lowest","Рота лишається без штатної посади напряму: 56 із 94 називають її найнижчою ланкою; досвід скорочення посади: «на роті з людьми ніхто не працював»"); r.ev("KC-01","TR-18"); } },
  { id:"R23", title:"Хорунжий роти замість ЗК з ППП", when:"На роті хорунжий (з бойових командирів)",
    test:h=> !!h.stc("khor_r"),
    apply:(r,h)=>{ r.norm("staff","нова посада: хорунжий роти"); r.note("lowest","Ротна посада стає кар'єрною сходинкою майбутнього командира; кадрові вимоги (освіта, курси) блокують призначення без рішення Головнокомандувача"); r.q("Хто виконує психологічну діагностику і допомогу на роті, якщо хорунжий не психолог"); r.ev("TR-14","KC-33"); } },
  { id:"R24", title:"Мобільна група як другий рівень", when:"Бригадна мобільна група виїжджає в роту на виклик",
    test:h=> !!h.stc("mobile"),
    apply:(r,h)=>{ r.barrier("invisible",r.k("r24_invisible")); r.norm("n174","маршрут: рота → мобільна група, батальйон за потреби"); r.note("lowest","Ланцюг «рота викликає бригадну групу на місце» оцінюють позитивно 23 інформанти"); r.ev("KC-16","KC-15"); } },
  { id:"R25", title:"Батальйонну ланку пропускають", when:"Допомога за нормою йде через батальйон, мобільної групи немає (з посадою на батальйоні чи без неї)",
    test:h=> !h.stc("mobile") && h.t("thresholds"),
    apply:(r,h)=>{ r.risk("bn_skipped"); r.barrierUp("invisible",r.k("r25_invisible")); r.ev("KC-15"); } },
  { id:"R26", title:"Пороги як обов'язкова норма", when:"Увімкнено пороги 3 год / 3 доби",
    test:h=> h.t("thresholds"),
    apply:(r,h)=>{ r.risk("thresholds"); r.ev("KC-13","KC-14","NM-04"); } },
  { id:"R27", title:"Пороги стали орієнтиром", when:"Пороги вимкнено",
    test:h=> !h.t("thresholds"),
    apply:(r,h)=>{ r.norm("n174","пороги як орієнтир, маршрут за рішенням командира"); r.ev("NM-04"); } },

  { id:"R30", title:"Правило межі відсутнє", when:"Правило конфіденційності не увімкнено",
    test:h=> !h.t("boundary"),
    apply:(r,h)=>{ r.barrier("leak",r.k("r30_leak")); r.risk("leak"); r.ev("KC-10","KC-30"); } },
  { id:"R31", title:"Правило межі увімкнено", when:"Командиру стан і потреба, зміст лишається у фахівця",
    test:h=> h.t("boundary"),
    apply:(r,h)=>{ r.barrier("leak",r.k("r31_leak")); r.norm("n349","інструкція: що передається командиру; ГППУ лише для підтримки"); r.ev("KC-30"); } },
  { id:"R32", title:"Іменні анкети", when:"Анонімні опитування вимкнено",
    test:h=> !h.t("anon"),
    apply:(r,h)=>{ r.distort(1); r.barrier("control",r.k("r32_control")); r.risk("embellish"); r.ev("KC-21","KC-20"); } },
  { id:"R33", title:"Показник МПС як KPI командира", when:"Показник стану є підставою для оцінки командира",
    test:h=> h.t("mpskpi"),
    apply:(r,h)=>{ r.distort(1); r.barrier("reaction",r.k("r33_reaction")); r.risk("embellish"); r.ev("KC-20","BO-02","TR-28"); } },
  { id:"R34", title:"Щоденне донесення про МПС", when:"Щоденне донесення увімкнено",
    test:h=> h.t("dailymps"),
    apply:(r,h)=>{ r.forms(r.k("r34_forms")); r.hours(r.k("r34_hours")); r.barrierUp("control",r.k("r34_control")); r.norm("n177","положення про МПЗ як підстава щоденного донесення"); r.ev("TR-04"); } },
  { id:"R35", title:"Один канал доповіді", when:"Одна форма від роти до ГУ, оперативний канал окремо",
    test:h=> h.t("singleform"),
    apply:(r,h)=>{ r.formsSet(r.k("r35_forms")); r.norm("n378","єдина форма замість звіту 7 днів і зведеного до 05"); r.barrier("formalism",r.k("r35_formalism")); r.ev("KC-22","TR-03","PL-02"); } },
  { id:"R36", title:"Звітність без відповіді", when:"Обов'язкова відповідь на доповідь не увімкнена",
    test:h=> !h.t("feedback"),
    apply:(r,h)=>{ r.feedback(0); r.risk("no_feedback"); r.ev("KC-26","BO-03"); } },
  { id:"R37", title:"Відповідь на кожну доповідь", when:"Зворотний зв'язок обов'язковий",
    test:h=> h.t("feedback"),
    apply:(r,h)=>{ r.feedback(1); r.barrier("formalism",r.k("r37_formalism")); r.ev("KC-26"); } },
  { id:"R38", title:"Живий канал: щомісячний розбір при командирі корпусу", when:"Динаміку стану розбирають з командирами щомісяця",
    test:h=> h.t("monthly"),
    apply:(r,h)=>{ r.live(1); r.ev("TR-17","KC-24"); } },
  { id:"R39", title:"Рекомендації фахівця дорадчі", when:"Рекомендації «можуть бути враховані»",
    test:h=> !h.t("recs"),
    apply:(r,h)=>{ r.note("trust","Рекомендації фахівця мають дорадчий статус (№ 174, I.5)"); r.ev("NM-05"); } },
  { id:"R40", title:"Рекомендації обов'язкові до розгляду", when:"Увімкнено обов'язковий розгляд рекомендацій",
    test:h=> h.t("recs"),
    apply:(r,h)=>{ r.norm("n174","статус рекомендацій фахівця"); r.ev("NM-05"); } },

  { id:"R45", title:"Культура і традиції без власника", when:"«Культура» знята з дошки або сидить на роті у напрямі без окремої посади",
    test:h=> !h.owned("culture") || (h.inLane("culture","ppp") && h.reaches("culture","coy") && !h.stc("rec_off")),
    apply:(r,h)=>{ r.risk("culture_orphan"); r.owner("culture", h.fn("culture")?"drain":"missing"); r.ev("KC-27","KC-28","NM-02"); } },
  { id:"R46", title:"Культура у зовнішнього ресурсу за заявкою", when:"«Культура» у вертикалі КС або у клубу",
    test:h=> h.owned("culture") && (h.inLane("culture","ext") || !!h.stc("rec_off")),
    apply:(r,h)=>{ r.note("coverage","Дозвілля і традиції мають власника; десант приїжджає за заявкою замість знайомств"); r.ev("KC-28"); } },
  { id:"R47", title:"Капелан і медики «за потреби»", when:"Протокол взаємодії не увімкнено",
    test:h=> !h.t("protocol"),
    apply:(r,h)=>{ r.note("coverage","Капелан залучається «за потреби», порядку і періодичності немає"); r.ev("NM-08"); } },
  { id:"R48", title:"Протокол взаємодії увімкнено", when:"Порядок і періодичність взаємодії з капеланом і медиками визначені",
    test:h=> h.t("protocol"),
    apply:(r,h)=>{ r.norm("n174","порядок і періодичність взаємодії з капеланом і медиками замість «за потреби» (III.3)"); r.note("coverage","Капелан і медики залучаються за протоколом («круглий стіл»): порядок і періодичність визначені"); r.ev("NM-08"); } },

  { id:"R50", title:"Рекрутинг у вертикалі напряму", when:"«Рекрутинг» перенесено до напряму",
    test:h=> h.inLane("recruit","ppp"),
    apply:(r,h)=>{ r.risk("dup_pers"); r.owner("recruit","dup"); r.norm("pers","розмежування зі службою персоналу"); r.q("Які нові функції рекрутингу не може виконати чинна система і хто з дефіцитних фахівців перейде"); r.ev("HK-01","HK-02","TR-13","TR-26"); } },
  { id:"R51", title:"Юристи у вертикалі напряму", when:"«Юристи» перенесено до напряму",
    test:h=> h.inLane("legal","ppp"),
    apply:(r,h)=>{ r.risk("dup_vert"); r.owner("legal","dup"); r.q("Юридична підтримка: правова допомога військовослужбовцю чи супровід кадрових рішень; звідки юристи"); r.ev("HK-02"); } },
  { id:"R52", title:"Комунікації у напрямі", when:"«Комунікації» у вертикалі напряму",
    test:h=> h.inLane("comms","ppp"),
    apply:(r,h)=>{ r.q("Який саме напрям комунікацій: внутрішні, стратегічні (перейшли до МО) чи протидія впливу противника"); r.norm("mo","стратком у МО; управління некінетичних дій у ГШ"); r.ev("HK-02"); } },
  { id:"R53", title:"Лідерство у напрямі", when:"«Лідерство» перенесено з ГУП до напряму",
    test:h=> h.inLane("leader","ppp"),
    apply:(r,h)=>{ r.norm("staff","перехід УРВЛ з ГУП ГШ"); r.note("coverage","Лідерство інтегровано в напрям: збігається з консенсусом обговорення"); r.ev("GU-17"); } },
  { id:"R54", title:"Музика інтегрована в напрям", when:"«Музика» у вертикалі напряму з оркестрами в бригадах",
    test:h=> h.owned("music") && h.inLane("music","ppp"),
    apply:(r,h)=>{ r.risk("music_cndi"); r.norm("vmu","передача ВМУ до директорат"); r.ev("CN-01","CN-02"); } },
  { id:"R55", title:"Музика централізована в регіональні центри", when:"«Музика» у ВМУ, найнижче вид або ОК",
    test:h=> h.owned("music") && h.inLane("music","vmu") && !h.reaches("music","bde"),
    apply:(r,h)=>{ r.risk("music_quit"); r.norm("vmu","регіональні центри на базі будинків офіцерів"); r.ev("CN-01","CN-03"); } },
  { id:"R56", title:"Музика децентралізована: оркестри в бригадах", when:"«Музика» у ВМУ і доходить до бригади",
    test:h=> h.owned("music") && h.inLane("music","vmu") && h.reaches("music","bde"),
    apply:(r,h)=>{ r.note("coverage","Децентралізований варіант ВМЗ: ЦНДІ вважає найдоцільнішим на довгу перспективу воєнного стану"); r.ev("CN-01"); } },

  { id:"R60", title:"Дев'ять служб під одним заступником", when:"На дошці структура управління людським капіталом",
    test:h=> !!h.stc("hk_gu") || !!h.stc("hk_b"),
    apply:(r,h)=>{ r.risk("hk_coord"); r.risk("staffing"); r.risk("mps_owner"); r.norm("staff","нові органи і посади без збільшення чисельності"); r.norm("statute","МПС і відповідальність командира"); r.q("Що є предметом управління нової структури і які функції свідомо лишаються поза нею"); r.ev("HK-03","HK-04","HK-05"); } },
  { id:"R61", title:"Хорунжа служба як ядро", when:"На дошці управління хорунжої служби",
    test:h=> !!h.stc("khor_c"),
    apply:(r,h)=>{ r.risk("leader_dep"); r.risk("scale"); r.norm("staff","експериментальний штат на 3 корпуси"); r.norm("mo","експеримент на рівні корпусів: спільне рішення МО і ГШ"); r.note("coverage","Ядро працює на корпусі і бригаді; ротного рівня у структурі немає, психологічна допомога лишається на бригадних групах"); r.q("Як модель відтворюється там, де немає лідера з авторитетом і школи; інші угруповання «не потягнуть»"); r.ev("KH-01","KH-03","TR-14","TR-24"); } },
  { id:"R62", title:"Школа і випробувальний термін", when:"Увімкнено школу підготовки і випробування",
    test:h=> h.t("school") && h.t("probation"),
    apply:(r,h)=>{ r.riskOff("leader_dep"); r.barrier("stigma",r.k("r62_stigma")); r.note("trust","Відтворюваність підсилено: школа 10 днів для мережі (сержанти, командири), рівень за пів року наказом"); r.ev("TR-14","TR-15"); } },
  { id:"R63", title:"Добір з бойових командирів", when:"Посада напряму комплектується з бойових командирів",
    test:h=> h.t("combatexp"),
    apply:(r,h)=>{ r.barrier("experience",r.k("r63_experience")); r.norm("pers","кадрові вимоги до посади: досвід замість освіти й курсів"); r.ev("KC-35","TR-14"); } },
  { id:"R64", title:"Бойовий досвід не є критерієм", when:"Добір з бойових командирів вимкнено",
    test:h=> !h.t("combatexp"),
    apply:(r,h)=>{ r.barrier("experience",r.k("r64_experience")); r.ev("KC-35"); } },
  { id:"R65", title:"Навчання сержантів з фіксацією", when:"Навчання сержантів і командирів взводів увімкнено",
    test:h=> h.t("training"),
    apply:(r,h)=>{ r.note("lowest","Перша ланка «рівний рівному» отримує навчання з фіксацією: побратим і сержант як перший адресат"); r.ev("KC-31","KC-02","KC-04"); } },
  { id:"R66", title:"Перша ланка без навчання", when:"Навчання сержантів не увімкнено",
    test:h=> !h.t("training"),
    apply:(r,h)=>{ r.note("lowest","Перший адресат побратим (27) і сержант (17), але навчання підтверджують лише ППП (10), не проходили 12"); r.ev("KC-31"); } },
  { id:"R67", title:"Погодження призначень по вертикалі", when:"Подвійне підпорядкування для кадрових рішень",
    test:h=> h.t("approval"),
    apply:(r,h)=>{ r.norm("pers","погодження призначень по вертикалі напряму"); r.note("trust","Погодження по вертикалі прибирає «своїх людей» на посадах; табори щодо підпорядкування 25 / 16 / 14"); r.ev("TR-19","KC-32"); } },
  { id:"R68", title:"Корпусний рівень заповнено", when:"На корпусі є структура напряму",
    test:h=> h.structsAt("ppp","corps").length>0,
    apply:(r,h)=>{ r.norm("doctr","корпус у чинній схемі ГШ позначено «відсутній»"); r.ev("GU-16"); } },
  { id:"R69", title:"Розрив зі Статутом", when:"Завжди, поки Статут описує заступника з МПЗ",
    test:h=> true,
    apply:(r,h)=>{ r.norm("statute","Статут описує заступника з МПЗ, командир діє за ним"); r.risk("statute_gap"); r.ev("NM-06","GU-18"); } },
  { id:"R70", title:"Назва напряму", when:"Вертикаль зветься «психологічна підтримка»",
    test:h=> /ППП|психолог|PPP|psycholog/i.test(h.laneName||""),
    apply:(r,h)=>{ r.risk("ppp_label"); r.ev("KC-33"); } },
  { id:"R71", title:"Опора на роту без даних", when:"Рота є опорною ланкою, а укомплектованість посад не відома",
    test:h=> h.lowestIn("ppp") === li("coy"),
    apply:(r,h)=>{ r.risk("rota_vacant"); r.q("Укомплектованість посад ЗК роти: даних немає, запит до директорат («розписали до посадової особи»)"); r.ev("KC-34","TR-18"); } },
  { id:"R73", title:"Профільна робота без виконавця", when:"Психологічні або моральні функції призначені туди, де на цьому рівні немає структури, або зняті з дошки",
    test:h=> ["prep","support","help","diag","recov","moral","org"].some(f=>!h.owned(f)),
    apply:(r,h)=>{ const lost=["prep","support","help","diag","recov","moral","org"].filter(f=>!h.owned(f)); lost.forEach(f=>r.owner(f,"noexec")); r.risk("drain_down"); r.note("time",`Не виконується: ${lost.map(f=>FMAP[f].short).join(", ")}. Час «за призначенням» тут означає лише те, що лишилось у людини; сама робота не виконується.`); r.ev("NM-01","TR-18"); } },
  { id:"R74", title:"Функції поза вертикаллю напряму без виконавця", when:"Інші функції призначені вертикалі, де на цьому рівні немає структури",
    test:h=> ["culture","social","invest","analysis","leader","music","recruit","legal","comms","educ","report"].some(f=>h.fn(f)&&!h.owned(f)),
    apply:(r,h)=>{ const lost=["culture","social","invest","analysis","leader","music","recruit","legal","comms","educ","report"].filter(f=>h.fn(f)&&!h.owned(f)); lost.forEach(f=>r.owner(f,"noexec")); r.ev("KC-27"); } },
  { id:"R72", title:"Діловод замість журналів", when:"На бригаді діловод напряму",

    apply:(r,h)=>{ r.cost("other",r.k("r72_other"),"облікові форми на діловоді"); r.ev("KC-22"); } }
];

/* ---------- бар'єри довіри (вага = кількість інформантів) ---------- */
const BARRIERS = [
  { id:"formalism",  name:"Formalism, unresolved requests", w:18, ev:"KC-06", base:1 },
  { id:"invisible",  name:"Specialist unseen and unknown",       w:13, ev:"KC-07", base:.5, baseK:"base_invisible" },
  { id:"stigma",     name:"Stigma of seeking help",                    w:12, ev:"KC-08", base:1 },
  { id:"punish",     name:"Help tied to punishment",      w:11, ev:"KC-09", base:0 },
  { id:"leak",       name:"Fear of leaks to command",        w:11, ev:"KC-10", base:0 },
  { id:"reaction",   name:"Command reaction to requests",   w:9,  ev:"KC-11", base:0 },
  { id:"experience", name:"Specialist lacks combat experience",       w:9,  ev:"KC-35", base:0 },
  { id:"control",    name:"Talks and visits as control",         w:7,  ev:"KC-12", base:0 }
];

/* ---------- коефіцієнти: лише через реєстр COEF (data.js), кожен з паспортом ---------- */
const CMAP = Object.fromEntries((D.COEF||[]).map(c=>[c.id,c]));
/* значення коефіцієнта з урахуванням kmul: est = true (оцінка команди) зсувається, решта ні.
   kmul > 1 песимістично: частка більша (до 1), бар'єр вищий (до 1), зниження менше, годин більше; kmul < 1 навпаки. */
function coef(id, kmul){
  const c=CMAP[id]; if(!c) throw new Error("невідомий коефіцієнт: "+id);
  if(!c.est || !kmul || kmul===1) return c.v;
  if(c.v<0) return c.v/kmul;
  const x=c.v*kmul; return (c.kind==="частка"||c.kind==="бар'єр") ? Math.min(1,x) : x;
}

/* ---------- обчислювач ----------
   opts.kmul: множник для оцінних коефіцієнтів реєстру (est = true). Виміряні величини (COST, ваги бар'єрів) і коефіцієнти,
   що випливають з конфігурації (est = false), не чіпаються. За замовчуванням 1: числа ті самі. Використовує band(). */
function compute(st, opts){
  const kmul = (opts && opts.kmul) || 1;
  const k = id => coef(id, kmul);
  const h = helpers(st); h.laneName = st.laneName;
  const costs = {}; Object.keys(COST).forEach(k=>costs[k]={f:0, labels:[], rules:[]});
  const bar = {}; BARRIERS.forEach(b=>bar[b.id]={v: b.baseK ? k(b.baseK) : b.base, rules:[]});
  const norms = {}; const risks = {}; const riskOff = new Set(); const qs = []; const owners = {}; const notes = {time:[],coverage:[],lowest:[],trust:[],signal:[],norm:[],staff:[],risks:[]};
  const fired = []; let cur = null;
  let forms = k("forms_base"), formsSet = null, hours = k("hours_base"), fb = 0, distort = 0, live = 0;
  const evUsed = new Set();
  const r = {
    k,
    cost:(a,f,label)=>{ const c=costs[a]; if(f<0) c.red=Math.min(1,(c.red||0)-f); else c.f=Math.max(c.f,f); if(label) c.labels.push(label); c.rules.push(cur.id); },
    barrier:(id,v)=>{ bar[id].v=v; bar[id].rules.push(cur.id); },
    barrierUp:(id,v)=>{ bar[id].v=Math.max(bar[id].v||0,v); bar[id].rules.push(cur.id); },
    risk:id=>{ (risks[id]=risks[id]||[]).push(cur.id); },
    riskOff:id=>{ riskOff.add(id); },
    norm:(id,why)=>{ (norms[id]=norms[id]||[]).push({why,rule:cur.id}); },
    q:t=>{ qs.push({text:t,rule:cur.id}); },
    owner:(fid,s)=>{ owners[fid]={status:s,rule:cur.id}; },
    note:(ind,t)=>{ notes[ind].push({text:t,rule:cur.id}); },
    ev:(...ids)=>{ ids.forEach(i=>evUsed.add(i)); cur.ev=(cur.ev||[]).concat(ids); },
    forms:d=>{ forms+=d; }, formsSet:n=>{ formsSet=n; }, hours:d=>{ hours+=d; }, feedback:v=>{ fb=v; }, distort:v=>{ distort=Math.max(distort,v); }, live:v=>{ live=v; }
  };
  RULES.forEach(rule=>{ let ok=false; try{ ok=!!rule.test(h); }catch(e){ ok=false; } if(ok){ cur={id:rule.id,title:rule.title,when:rule.when,ev:[]}; rule.apply(r,h); fired.push(cur); } });
  riskOff.forEach(id=>{ delete risks[id]; });

  /* 1. час */
  const hasPost = { coy: h.structsAt("ppp","coy").length>0, bn: h.structsAt("ppp","bn").length>0, bde: h.structsAt("ppp","bde").length>0, gkbs: !!(h.stc("gkbs")||h.stc("mobile")) };
  const time = { levels: TIME_LEVELS.map(([lv,name,ev])=>{ const items=[]; let tot=0;
    Object.entries(COST).forEach(([k,c])=>{ const val=+(c.lv[lv]*costs[k].f*(1-(costs[k].red||0))).toFixed(1); if(val>0.05){ items.push({key:k,label:c.label,val,note:costs[k].labels.join("; "),ev:c.ev,rules:[...new Set(costs[k].rules)]}); tot+=val; } });
    const na = !hasPost[lv];
    return { id:lv, name, core: na?null:+(100-tot).toFixed(1), noncore: na?null:+tot.toFixed(1), items: na?[]:items, ev, na }; }) };
  const avail = time.levels.filter(l=>!l.na); time.avg = avail.length ? +(avail.reduce((a,l)=>a+l.core,0)/avail.length).toFixed(1) : 0; time.notes = notes.time; time.lost = FUNCS.filter(f=>owners[f.id]&&owners[f.id].status==="noexec").map(f=>f.short);

  /* 2. покриття */
  const coverage = { items: FUNCS.map(f=>{ const p=h.fn(f.id); let status="ok", text="";
      if(!p){ status="missing"; text="блок знято з дошки"; }
      else if(li(p.depth) < li(f.need)){ status="short"; text=`доходить до «${LEVELS[li(p.depth)].short}», потрібно до «${LEVELS[li(f.need)].short}»`; }
      const o=owners[f.id]; if(o){ if(o.status==="dup"){ status="dup"; text="дублює наявну вертикаль"; } else if(o.status==="noexec"){ status="noexec"; text=p?`у вертикалі «${LANES.find(l=>l.id===p.lane).short}» на рівні «${LEVELS[li(p.depth)].short}» немає структури-виконавця`:"блок знято з дошки"; } else if(o.status==="drain"){ status = status==="ok"?"drain":status; text = text||"стікає на роту"; } else if(o.status==="short" && status==="ok"){ status="weak"; text="виконується без норми"; } }
      return { id:f.id, name:f.name, short:f.short, group:f.group, status, text, lane:p?p.lane:null, depth:p?p.depth:null, need:f.need, rule:o?o.rule:null }; }) };
  coverage.missing = coverage.items.filter(i=>["missing","short","drain","noexec"].includes(i.status)).length;
  coverage.owned = coverage.items.filter(i=>i.status==="ok"||i.status==="weak"||i.status==="dup").length;
  coverage.dup = coverage.items.filter(i=>i.status==="dup").length;
  coverage.weak = coverage.items.filter(i=>i.status==="weak").length;
  coverage.notes = notes.coverage;
  /* розриви на дошці: клітинки між глибиною і потребою */
  const gaps = []; coverage.items.forEach(i=>{ if(i.status==="noexec"&&i.lane){ gaps.push({fid:i.id,lane:i.lane,level:i.depth,missing:true}); } if(i.status==="short"){ for(let k=li(i.depth)+1;k<=li(i.need);k++) gaps.push({fid:i.id,lane:i.lane,level:LEVELS[k].id}); } if(i.status==="missing"){ const f=FMAP[i.id]; const lane=(f.norm&&f.norm.lane)||"ppp"; gaps.push({fid:i.id,lane,level:f.need,missing:true}); } });

  /* 3. найнижча ланка */
  const lowIdx = h.lowestIn("ppp"); const lowest = { level: lowIdx>=0?LEVELS[lowIdx]:null, atCoy: h.structsAt("ppp","coy").map(id=>SMAP[id].name), notes: notes.lowest,
    removed: time.levels[0].items.length ? [] : [], };
  /* що знято з роти порівняно з чинною */
  const baseNow = computeBaseCoy();
  const effF = k => (costs[k].f||0)*(1-(costs[k].red||0));
  lowest.removed = Object.entries(COST).filter(([k,c])=> c.lv.coy>0 && (baseNow[k]||0) > effF(k)+0.01 ).map(([k,c])=>({label:c.label, val:+(c.lv.coy*((baseNow[k]||0)-effF(k))).toFixed(1)}));
  lowest.added = [];
  if(h.t("zkrduty")) lowest.added.push("обов'язки ЗК роти окремим переліком");
  if(h.stc("mobile")) lowest.added.push("виклик бригадної мобільної групи");
  if(h.t("training")) lowest.added.push("навчені сержанти і командири взводів");
  if(h.stc("khor_r")) lowest.added.push("хорунжий роти");
  if(h.t("boundary")) lowest.added.push("боєць знає, що передається командиру");
  lowest.first = ["buddy 27","commander 22","sergeant 17","specialist 4 (privates and sergeants)"];

  /* 4. довіра */
  const trust = { barriers: BARRIERS.map(b=>({ id:b.id, name:b.name, w:b.w, v:bar[b.id].v, score:+(b.w*bar[b.id].v).toFixed(1), rules:bar[b.id].rules, ev:b.ev })), notes: notes.trust };
  trust.active = trust.barriers.filter(b=>b.v>0).length; trust.score = +trust.barriers.reduce((a,b)=>a+b.score,0).toFixed(0); trust.max = BARRIERS.reduce((a,b)=>a+b.w,0);

  /* 5. сигнал */
  const signal = { forms: formsSet!==null? formsSet + (h.t("dailymps")?1:0) : forms, hours:+hours.toFixed(1), feedback:!!fb, distort:!!distort, live:!!live, notes: notes.signal,
    useful:"4-5 за оцінкою практиків", ev:["TR-03","TR-04","KC-26","KC-21"] };

  /* 6. норма */
  const normDocs = Object.entries(norms).map(([id,arr])=>({ id, name:D.NM[id].name, why:[...new Set(arr.map(a=>a.why))], rules:[...new Set(arr.map(a=>a.rule))] }));
  /* структурні переміщення функцій відносно норми */
  FUNCS.forEach(f=>{ const p=h.fn(f.id); if(!f.norm||!p) return; if(p.lane!==f.norm.lane || p.depth!==f.norm.depth){ const docs = ({org:["n349"],diag:["n349"],prep:["n431"],support:["n349"],help:["n174"],recov:["n378"],moral:["n177"],social:["n27","n349"],invest:["statute","vsp"],leader:["staff"],music:["vmu"],recruit:["pers"],legal:["vsp"],comms:["mo"],report:["n378"]})[f.id]||[]; docs.forEach(d=>{ if(!normDocs.find(x=>x.id===d)) normDocs.push({id:d,name:D.NM[d].name,why:[`перенесено «${f.short}»`],rules:[]}); else normDocs.find(x=>x.id===d).why.push(`перенесено «${f.short}»`); }); } });
  const norm = { docs: normDocs, count: normDocs.length, statuteGap: true, notes: notes.norm };

  /* 7. комплектування (оцінка) */
  const units = ["ГШ","вид","корпус","бригада","батальйон","рота"];
  const staffCalc = s => { const out={}; units.forEach(u=>out[u]={n:0,est:false,items:[]}); Object.keys(s.structs).forEach(id=>{ const d=SMAP[id]; if(!d||d.posts.n==null) return; const u=d.posts.unit; out[u].n+=d.posts.n; if(d.posts.est) out[u].est=true; out[u].items.push({name:d.short,n:d.posts.n,est:!!d.posts.est}); }); return out; };
  const staffNow = staffCalc(fromPreset("now")), staffCur = staffCalc(st);
  const staff = { units: units.map(u=>({ unit:u, n:staffCur[u].n, base:staffNow[u].n, delta:staffCur[u].n-staffNow[u].n, est:staffCur[u].est, items:staffCur[u].items })), notes: notes.staff, est:true,
    scarce: [ h.stc("gkbs")||h.stc("zkbn") ? "психологи (норма 1:10, факт ~1:560)" : null, h.inLane("legal","ppp") ? "юристи" : null, (h.inLane("music","ppp")||h.stc("orch")) ? "музиканти (1 293 посади на всі ЗСУ)" : null, h.stc("khor_c")||h.stc("khor_b") ? "бойові командири з авторитетом для хорунжих посад" : null ].filter(Boolean) };

  /* 8. ризики і питання */
  const riskList = Object.entries(risks).map(([id,rules])=>({ id, name:D.RK[id].name, desc:D.RK[id].desc, ev:D.RK[id].ev, rules:[...new Set(rules)] }));
  const questions = qs.filter((q,i,a)=>a.findIndex(x=>x.text===q.text)===i);

  return { time, coverage, gaps, lowest, trust, signal, norm, staff, risks:riskList, questions, fired, evUsed:[...evUsed] };
}
/* смуга невизначеності коефіцієнтів: усі часткові коефіцієнти одночасно на pct гірші (kmul 1+pct) або кращі (1−pct).
   Повертає [min, max] для середнього часу, часу роти, ваги бар'єрів і кожного індексу принципу; point = числа за замовчуванням.
   Це не довірчий інтервал, а перевірка, наскільки висновок тримається на оцінних коефіцієнтах (вони позначені як «оцінка»). */
function band(st, pct){
  pct = pct||0.3; const ks=[1-pct, 1, 1+pct];
  const runs = ks.map(k=>{ const r=compute(st,{kmul:k}); const P=indexPrinciples(r); return { k, time:r.time.avg, coy:r.time.levels[0].na?null:r.time.levels[0].core, trust:r.trust.score, idx:Object.fromEntries(Object.values(P).map(p=>[p.id,p.value])) }; });
  const mm = f => { const v=runs.map(f).filter(x=>x!=null); return v.length ? [Math.min(...v), Math.max(...v)] : [null,null]; };
  const idx={}; Object.keys(runs[1].idx).forEach(id=>idx[id]=mm(r=>r.idx[id]));
  return { pct, time:mm(r=>r.time), coy:mm(r=>r.coy), trust:mm(r=>r.trust), idx, point:runs[1] };
}
let _baseCoy=null;
function computeBaseCoy(){ if(_baseCoy) return _baseCoy; const st=fromPreset("now"); const h=helpers(st); h.laneName=st.laneName; const costs={}; Object.keys(COST).forEach(k=>costs[k]=0);
  const red={}; const r={ k:id=>coef(id,1), cost:(k,f)=>{ if(f<0) red[k]=Math.min(1,(red[k]||0)-f); else costs[k]=Math.max(costs[k],f); } }; ["barrier","barrierUp","risk","riskOff","norm","q","owner","note","ev","forms","formsSet","hours","feedback","distort","live"].forEach(k=>r[k]=()=>{});
  RULES.forEach(rule=>{ let ok=false; try{ ok=!!rule.test(h); }catch(e){} if(ok) rule.apply(r,h); }); Object.keys(costs).forEach(k=>{ costs[k]=costs[k]*(1-(red[k]||0)); }); _baseCoy=costs; return costs; }

/* ---------- ефекти правил словами (з тексту apply): для екрана «Правила», специфікації і матриці бар'єрів ---------- */
const BMAP = Object.fromEntries(BARRIERS.map(b=>[b.id,b]));
function kv(expr){ const m=/r\.k\("(\w+)"\)/.exec(expr); if(m){ const c=CMAP[m[1]]; return c ? { v:c.v, id:c.id, label:c.label, est:c.est } : { v:NaN, id:m[1] }; } const n=parseFloat(expr); return isNaN(n)? { v:expr } : { v:n }; }
function ruleEffects(rule){
  const src=rule.apply.toString(); const cond=/\?|if\(/.test(src); const out=[];
  const fnName = id => (FMAP[id]||{}).short || id;
  [...src.matchAll(/r\.cost\("(\w+)",\s*(r\.k\("\w+"\)|-?[\d.]+)(?:,\s*("(?:[^"\\]|\\.)*"))?\)/g)].forEach(m=>{ const k=kv(m[2]); const label=COST[m[1]]?COST[m[1]].label:m[1]; out.push({ kind:"час", text:`стаття «${label}»: ${k.v<0?`зниження на ${Math.abs(k.v*100)} %`:`лишається ${Math.round(k.v*100)} %`}${m[3]?" ("+m[3].slice(1,-1)+")":""}`, coef:k.id, est:k.est }); });
  [...src.matchAll(/r\.cost\("(\w+)",\s*(\w+)\?r\.k\("(\w+)"\):r\.k\("(\w+)"\)/g)].forEach(m=>{ const a=CMAP[m[3]], b=CMAP[m[4]]; const label=COST[m[1]]?COST[m[1]].label:m[1]; out.push({ kind:"час", text:`стаття «${label}»: лишається ${Math.round(a.v*100)} % або ${Math.round(b.v*100)} % залежно від глибини`, coef:a.id+", "+b.id, est:a.est||b.est }); });
  [...src.matchAll(/r\.(barrier|barrierUp)\("(\w+)",\s*(r\.k\("\w+"\)|-?[\d.]+)\)/g)].forEach(m=>{ const k=kv(m[3]); const b=BMAP[m[2]]; out.push({ kind:"бар'єр", text:`бар'єр «${b?b.name:m[2]}» ${m[1]==="barrierUp"?"не нижче":"="} ${k.v}`, barrier:m[2], value:k.v, up:m[1]==="barrierUp", coef:k.id, est:k.est }); });
  [...src.matchAll(/r\.risk\("(\w+)"\)/g)].forEach(m=>out.push({ kind:"ризик", text:`ризик «${D.RK[m[1]]?D.RK[m[1]].name:m[1]}»`, risk:m[1] }));
  [...src.matchAll(/r\.riskOff\("(\w+)"\)/g)].forEach(m=>out.push({ kind:"ризик", text:`знімає ризик «${D.RK[m[1]]?D.RK[m[1]].name:m[1]}»`, risk:m[1] }));
  [...src.matchAll(/r\.norm\("(\w+)",\s*"((?:[^"\\]|\\.)*)"\)/g)].forEach(m=>out.push({ kind:"документ", text:`до зміни: ${D.NM[m[1]]?D.NM[m[1]].name:m[1]} (${m[2]})`, norm:m[1] }));
  [...src.matchAll(/r\.owner\("(\w+)",\s*"(\w+)"\)/g)].forEach(m=>out.push({ kind:"статус", text:`«${fnName(m[1])}»: ${({drain:"стікає на роту",missing:"немає",short:"без норми",dup:"дублює",noexec:"без виконавця"})[m[2]]||m[2]}` }));
  if(/r\.owner\(f,/.test(src)) out.push({ kind:"статус", text:"кожна така функція: без виконавця" });
  [...src.matchAll(/r\.q\("((?:[^"\\]|\\.)*)"\)/g)].forEach(m=>out.push({ kind:"питання", text:m[1] }));
  [...src.matchAll(/r\.note\("(\w+)",\s*"((?:[^"\\]|\\.)*)"\)/g)].forEach(m=>out.push({ kind:"примітка", text:m[2] }));
  [...src.matchAll(/r\.forms\((r\.k\("\w+"\)|-?[\d.]+)\)/g)].forEach(m=>{ const k=kv(m[1]); out.push({ kind:"сигнал", text:`форм звітності +${k.v}`, coef:k.id }); });
  [...src.matchAll(/r\.formsSet\((r\.k\("\w+"\)|-?[\d.]+)\)/g)].forEach(m=>{ const k=kv(m[1]); out.push({ kind:"сигнал", text:`форм звітності = ${k.v}`, coef:k.id }); });
  [...src.matchAll(/r\.hours\((r\.k\("\w+"\)|-?[\d.]+)\)/g)].forEach(m=>{ const k=kv(m[1]); out.push({ kind:"сигнал", text:`годин на донесення +${k.v}`, coef:k.id, est:k.est }); });
  [...src.matchAll(/r\.feedback\((\d)\)/g)].forEach(m=>out.push({ kind:"сигнал", text:m[1]==="1"?"відповідь на доповідь є":"відповіді на доповідь немає" }));
  [...src.matchAll(/r\.distort\((\d)\)/g)].forEach(m=>out.push({ kind:"сигнал", text:"стимул прикрашати показник" }));
  [...src.matchAll(/r\.live\((\d)\)/g)].forEach(m=>out.push({ kind:"сигнал", text:"живий канал є" }));
  const ev=[...new Set([...src.matchAll(/r\.ev\(([^)]*)\)/g)].flatMap(m=>m[1].split(",").map(x=>x.trim().replace(/"/g,"")).filter(Boolean)))];
  return { effects:out, ev, conditional:cond };
}
/* матриця бар'єрів: для кожного бар'єра базове значення і правила, які його рухають */
function barrierMatrix(){
  return BARRIERS.map(b=>({ id:b.id, name:b.name, w:b.w, ev:b.ev, base: b.baseK ? coef(b.baseK,1) : b.base, baseK:b.baseK||null,
    movers: RULES.map(r=>({ r, fx:ruleEffects(r).effects.filter(e=>e.kind==="бар'єр"&&e.barrier===b.id) })).filter(x=>x.fx.length).map(x=>({ rule:x.r.id, title:x.r.title, when:x.r.when, value:x.fx[0].value, up:x.fx[0].up, coef:x.fx[0].coef, est:x.fx[0].est })) }));
}

/* ---------- порівняння двох станів ---------- */
function diff(a,b){
  const out = { funcs:[], structs:[], toggles:[] };
  FUNCS.forEach(f=>{ const x=a.funcs[f.id], y=b.funcs[f.id]; const sx=x?`${x.lane}/${x.depth}`:"none", sy=y?`${y.lane}/${y.depth}`:"none"; if(sx!==sy) out.funcs.push({id:f.id,name:f.short,from:x,to:y}); });
  const ids=new Set([...Object.keys(a.structs),...Object.keys(b.structs)]);
  ids.forEach(id=>{ const x=a.structs[id], y=b.structs[id]; if(!x&&y) out.structs.push({id,name:SMAP[id].short,kind:"added",to:y}); else if(x&&!y) out.structs.push({id,name:SMAP[id].short,kind:"removed",from:x}); else if(x&&y&&(x.lane!==y.lane||x.level!==y.level)) out.structs.push({id,name:SMAP[id].short,kind:"moved",from:x,to:y}); });
  TOGGLES.forEach(t=>{ if(!!a.toggles[t.id]!==!!b.toggles[t.id]) out.toggles.push({id:t.id,name:t.name,to:!!b.toggles[t.id]}); });
  return out;
}

function fromBase(b, preset){ const st={ preset:preset||"custom", laneName:b.laneName, funcs:clone(b.funcs), structs:clone(b.structs), toggles:clone(b.toggles), scen:[], scenBase:null }; return st; }

/* ========== шар принципів: перерахунок індикаторів рушія в індекси 0–100 ==========

/* різниця двох станів принципів: по факторах, різниця внесків пояснює зсув індексу */
function diffPrinciples(a, b){
  const out={};
  PRINCIPLES.forEach(p=>{ const A=a[p.id], B=b[p.id]; out[p.id]={ id:p.id, from:A.value, to:B.value, delta:+(B.value-A.value).toFixed(1),
    factors:B.factors.map((f,i)=>{ const g=A.factors[i]; return { id:f.id, text:f.text, measurable:f.measurable, from:g.contrib, to:f.contrib, delta:+(f.contrib-g.contrib).toFixed(1), potential:f.potential, x:f.x, xFrom:g.x,
      indicators:f.indicators.map((ind,k)=>({ path:ind.path, label:ind.label, from:g.indicators[k].fact, to:ind.fact, naFrom:g.indicators[k].na, na:ind.na, xFrom:g.indicators[k].x, x:ind.x, threshold:ind.threshold, target:ind.target, type:ind.type, w:ind.w, ev:ind.ev, why:ind.why })) }; }) }; });

/* чутливість ваг ±20 %: порядок вимірюваних факторів за потенціалом усередині принципу не має мінятися */
function sensitivity(res, pct){

    meas.forEach(f=>{ [1+pct,1-pct].forEach(m=>{ const o=indexPrinciples(res,{factors:{[p.id]:{[f.id]:m}}}); reversed(o1, order(o[p.id])).forEach(pair=>{ (unstable[p.id]=unstable[p.id]||new Set()).add(pair[0]).add(pair[1]); }); });
      f.indicators.forEach(ind=>{ [1+pct,1-pct].forEach(m=>{ const o=indexPrinciples(res,{inds:{[p.id]:{[f.id]:{[ind.path]:(EV_WEIGHT[ind.type]||1)*m}}}}); reversed(o1, order(o[p.id])).forEach(pair=>{ (unstable[p.id]=unstable[p.id]||new Set()).add(pair[0]).add(pair[1]); }); }); }); }); });
  const out={}; Object.entries(unstable).forEach(([k,v])=>out[k]=[...v]); return out;
}

      coy:h=>{ const inv=h.fn("invest"); if(inv && inv.lane!=="ppp" && h.owned("invest")) return {s:OK,when:"«Розслідування» поза напрямом і мають виконавця",t:"ЗКР передає 2-3 пояснення",d:`Замість ${String(E.COST.invest.lv.coy).replace(".",",")}% часу на розслідування: ${kc}% (частка з реєстру коефіцієнтів). Час повертається на людей.`,ev:["GU-02","TR-08"]}; if(inv && inv.lane!=="ppp") return {s:WARN,when:"«Розслідування» поза напрямом, але виконавця немає",t:"ЗКР передає пояснення, але нема кому",d:"Виконавця на рівні, до якого записано розслідування, немає; частина роботи повертається на роту.",ev:["TR-07"],fix:"додати структуру-виконавця у вертикалі розслідувань"}; return {s:BLOCK,when:"«Розслідування» у вертикалі напряму або зняті з дошки",t:"ЗКР далі збирає пояснення",d:"Командир кладе на заступника те, що під рукою. Розпорядження вгорі є, практика внизу та сама: 19,4% часу.",ev:["GU-02","KC-23"],fix:"перетягнути «Розслідування» з вертикалі напряму"}; },
      soldier:h=>{ const pun=h.fn("invest") && h.fn("invest").lane==="ppp"; if(!pun) return {s:OK,when:"«Розслідування» не у вертикалі напряму",t:"Боєць бачить у ЗКР помічника",d:"Бар'єр «допомога поєднана з покаранням» (11 інформантів) знято. Довіра до посади має шанс.",ev:["KC-09"]}; return {s:BLOCK,when:"«Розслідування» у вертикалі напряму",t:"Боєць бачить слідчого",d:"Той, хто готує документи на покарання, виходить із кола людей, яким довіряють: боєць подумає, йти до нього чи в СЗЧ.",ev:["KC-09","KC-02"]}; }
    } },

      bn:h=>{ if(!h.stc("zkbn")) return {s:BLOCK,when:"на батальйоні немає ЗК з ППП",t:"Батальйонного пункту немає",d:"Другий рівень допомоги відсутній у структурі.",ev:["KC-15"],fix:"додати ЗК батальйону з ППП або мобільну групу"}; return {s:WARN,when:"на батальйоні є ЗК з ППП",t:"Батальйон часто пропускають",d:"Випадок іде з роти одразу на бригадні групи (9 інформантів); пункт батальйону нерідко без психолога.",ev:["KC-15"],fix:"додати бригадну мобільну групу як стандартний другий рівень"}; },
      coy:h=> h.t("thresholds") ? {s:BLOCK,when:"пороги увімкнені як обов'язкова норма",t:"Поріг «3 години» не назвав жоден із 77",d:"Дії прив'язані до бою і до «одразу», не до строків. Норма не доходить до виконавця.",ev:["KC-13"],fix:"вимкнути пороги як обов'язкову норму, зробити орієнтиром"} : {s:OK,when:"пороги вимкнені (орієнтир)",t:"Рота діє за фактом, норма не заважає",d:"ЗКР стабілізує і кличе групу; строки як орієнтир для фахівця.",ev:["KC-13"]},
      soldier:h=> h.t("training") ? {s:WARN,when:"навчання сержантів і командирів взводів увімкнено",t:"Боєць іде до побратима і командира",d:"Перша ланка навчена: побратим і сержант знають, що робити в перші години.",ev:["KC-02","KC-31"]} : {s:BLOCK,when:"навчання сержантів не увімкнено",t:"Боєць іде до побратима і командира",d:"Перший адресат побратим (27) і командир (22); навчання «рівний рівному» не проходили або не чули 12.",ev:["KC-02","KC-31"],fix:"увімкнути навчання сержантів і командирів взводів"}
    } },

  { id:"d_dailymps", name:"Directive: daily report on morale and psychological state", short:"Daily morale report", tag:"reporting",

      bde:h=>({s:WARN,when:"завжди",t:"Бригада заповнює форму",d:"На рівень ОК подається 26 звітів; корисних, за оцінкою практиків, 4-5.",ev:["TR-03"]}),

  { id:"d_invg", name:"Order: create inquiry groups for offences", short:"Offence inquiry groups", tag:"discipline",

      gs:h=>({s:OK,when:"завжди",t:"Наказ є",d:"Групи створено на рівні органів управління і частин.",ev:["TR-05"]}),
      ok:h=>({s:WARN,when:"завжди",t:"Повна вертикаль лише в одному виді",d:"У ПС на рівні командування немає, у ВМС фрагментарно, у ТрО лише в частинах.",ev:["TR-06"]}),

      bn:h=> h.stc("invg_bn") ? {s:OK,when:"на батальйоні є група з'ясування",t:"Батальйонна ланка є",d:"Представники батальйонів у групі закривають розслідування по особовому складу.",ev:["TR-08"]} : {s:BLOCK,when:"на батальйоні немає групи з'ясування",t:"У батальйонах груп немає",d:"Звідси колізія: групи займаються списанням майна, а все по людях лишається на командирі роти й батальйону.",ev:["TR-07"],fix:"додати «Групу з'ясування батальйону»"},
      coy:h=>{ const inv=h.fn("invest"); if(inv&&inv.lane!=="ppp"&&h.reaches("invest","bn")&&h.owned("invest")) return {s:OK,when:"«Розслідування» поза напрямом, до батальйону, з виконавцем",t:"ЗКР передає пояснення",d:"Одне розслідування більше не займає 15 днів роботи заступника.",ev:["TR-09"]}; return {s:WARN,when:"«Розслідування» у напрямі, або не доходять до батальйону, або без виконавця",t:"Групи списують майно, ЗКР веде людей",d:"Групи переключились на списання техніки як найгарячішу задачу, все по персоналу лишилось на ППП.",ev:["TR-07","TR-09"],fix:"перетягнути «Розслідування» у вертикаль ВСП до батальйону"}; },
      soldier:h=>{ const pun=h.fn("invest")&&h.fn("invest").lane==="ppp"; return pun?{s:BLOCK,when:"«Розслідування» у вертикалі напряму",t:"Для бійця нічого не змінилось",d:"Заступник далі і допомагає, і карає.",ev:["KC-09"]}:{s:OK,when:"«Розслідування» не у вертикалі напряму",t:"Правопорядок окремо, допомога окремо",d:"Дисципліна як правопорядок (ВСП, закон) і особиста дисциплінованість; заступник поза каральною функцією.",ev:["TR-22"]}; }
    } },

const NAMES = { gs:"General Staff", ok:"Operational Command", corps:"Corps", bde:"Brigade", bn:"Battalion", coy:"Company", soldier:"Soldier and sergeant" };

function run(decisionId, st){
  const dec = DECISIONS.find(d=>d.id===decisionId) || DECISIONS[0];
  const h = E.helpers(st); h.laneName = st.laneName;
  const steps = ORDER.map(k=>{ let r; try{ r=dec.steps[k](h); }catch(e){ r={s:WARN,when:"крок не обчислено",t:"Крок не обчислено",d:String(e.message),ev:[]}; } return Object.assign({level:k, name:NAMES[k]}, r); });
  const blocked = steps.filter(s=>s.s===BLOCK), warned = steps.filter(s=>s.s===WARN);
  const firstBlock = blocked[0];
  const verdict = firstBlock ? `Рішення впирається на рівні «${firstBlock.name}»: ${firstBlock.t.toLowerCase()}.` : warned.length ? `Рішення доходить до бійця, але з ${warned.length} тертям${warned.length===1?"":"и"} дорогою.` : `Рішення проходить до бійця без перешкод у цій конфігурації.`;
  const fixes = [...new Set(steps.filter(s=>s.fix).map(s=>s.fix))];
  return { decision:dec, steps, blocked:blocked.length, warned:warned.length, verdict, fixes };
}

/* Усі гілки всіх кроків для таблиці «умови проходження» (роль 01). Гілки це код, тому вони збираються з тексту функцій кроків:
   кожен об'єкт {s:…, when:"…", t:"…", …} у тексті кроку це одна гілка, порядок у тексті = порядок перевірки.
   Повертає [{dec, level, i, s, when, t, ev, fix}]. Тест перевіряє, що кожен крок дає хоча б одну гілку і що жодна гілка не без умови. */
function branches(){
  const out=[];
  const S={OK,WARN,BLOCK};
  DECISIONS.forEach(dec=>ORDER.forEach(level=>{ const src=dec.steps[level].toString(); let i=0;
    const re=/\{s:(OK|WARN|BLOCK),when:"((?:[^"\\]|\\.)*)",t:("(?:[^"\\]|\\.)*"|`(?:[^`\\]|\\.)*`)/g; let m;
    while((m=re.exec(src))){ const tail=src.slice(m.index); const end=tail.indexOf("}")+1; const body=tail.slice(0,end);
      const ev=/ev:\[([^\]]*)\]/.exec(body); const fix=/fix:"((?:[^"\\]|\\.)*)"/.exec(body);
      out.push({ dec:dec.id, level, i:i++, s:S[m[1]], when:m[2], t:m[3].slice(1,-1).replace(/\$\{[^}]*\}/g,"…"), ev: ev? ev[1].split(",").map(x=>x.trim().replace(/"/g,"")).filter(Boolean) : [], fix: fix? fix[1] : "" }); } }));
  return out;
}
return { DECISIONS, ORDER, NAMES, run, branches };

/* ---------- принципи: радар часток виконаних умов ----------
   Осі = сім принципів; довжина = частка виконаних умов (виконано 1, частково 0,5, ні 0) серед вимірюваних факторів.
   Це та сама «умов виконано k з n», лише як фігура: без ваг, без 0–100, без рейтингу. Старт сеансу пунктиром, зараз заливкою. */
const RAD = { W:680, H:310, cx:340, cy:160, r:112, vals:null };
function prinVals(P){ return PRINCIPLES.map(p=>{ const meas=P[p.id].factors.filter(f=>f.measurable); const st=meas.map(f=>fstate(f.x)); const on=st.filter(x=>x==="on").length, half=st.filter(x=>x==="half").length; return { id:p.id, short:p.short, n:meas.length, on, half, v: meas.length?(on+0.5*half)/meas.length:0, states:st }; }); }

function rpt(i, v, r){ const d=axisDir(i); const rr=r==null?RAD.r:r; return [RAD.cx+rr*v*d.x, RAD.cy+rr*v*d.y]; }
function rpoly(vals){ return vals.map((v,i)=>rpt(i,v).map(x=>x.toFixed(1)).join(",")).join(" "); }
function radarSvg(cur, base, from, changed){
  const rings=[.25,.5,.75,1].map(k=>`<polygon class="ring" points="${rpoly(PRINCIPLES.map(()=>k))}"/>`).join("");
  const axes=PRINCIPLES.map((p,i)=>{ const [x,y]=rpt(i,1); return `<line class="axis" x1="${RAD.cx}" y1="${RAD.cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; }).join("");
  const labels=cur.map((c,i)=>{ const d=axisDir(i); const [x,y]=rpt(i,1,RAD.r+14); const anchor=d.x>0.3?"start":d.x<-0.3?"end":"middle"; const chg=changed&&changed.has(c.id);
    const top=d.y<-0.3, bottom=d.y>0.3; const ly=top?-16:bottom?18:4, dy=top?-3:bottom?31:17;
    const dots=c.states.map((st,k)=>`<circle class="pd ${st}" cx="${(anchor==="end"?-(c.n-1-k):k)*12}" cy="0" r="4.5"/>`).join("");
    const dotsG=`<g class="pdots" transform="translate(${anchor==="middle"?-(c.n-1)*6:0},${dy})">${dots}</g>`;
    return `<g class="lab ${chg?"chg":""}" data-p="${c.id}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})" text-anchor="${anchor}"><text class="nm" y="${ly}">${esc(c.short)}<tspan class="k"> ${c.on}</tspan><tspan class="of"> з ${c.n}</tspan></text>${dotsG}</g>`; }).join("");
  const verts=cur.map((c,i)=>{ const [x,y]=rpt(i, from?from[i]:c.v); const chg=changed&&changed.has(c.id); return `<g class="vt ${chg?"chg":""}" data-i="${i}"><circle class="halo" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7"/><circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5"/></g>`; }).join("");
  return `<svg class="dradar" viewBox="0 0 ${RAD.W} ${RAD.H}" aria-label="Радар: частка виконаних умов кожного принципу, старт і зараз">
    <defs><radialGradient id="rgf" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#f5c451" stop-opacity=".62"/><stop offset=".55" stop-color="#f5c451" stop-opacity=".30"/><stop offset="1" stop-color="#f5c451" stop-opacity=".12"/></radialGradient>
      <filter id="rglow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <g class="grid">${rings}${axes}</g>
    <polygon class="base" points="${rpoly(base.map(b=>b.v))}"/>

function radarAnimate(from, to, ms){

  const t0=performance.now(); const step=now=>{ const k=Math.min(1,(now-t0)/ms); const e=1-Math.pow(1-k,3); const vals=to.map((v,i)=>from[i]+(v-from[i])*e);
    poly.setAttribute("points", rpoly(vals)); dots.forEach((g,i)=>{ const [x,y]=rpt(i,vals[i]); $$("circle",g).forEach(c=>{ c.setAttribute("cx",x.toFixed(1)); c.setAttribute("cy",y.toFixed(1)); }); });

function renderPrin(prevP){

  if(changed.size){ const now=$("#dprin polygon.now"); if(now) now.classList.add("flash"); V.timers.push(setTimeout(()=>{ $$("#dprin .chg").forEach(el=>el.classList.remove("chg")); if(now) now.classList.remove("flash"); }, HOLD_MS)); }

/* ---------- підпис ходу: людською мовою, з різниці двох станів ---------- */
function captionItems(rp, rn, sp, sn, diff){

  rn.trust.barriers.forEach((b,i)=>{ const a=rp.trust.barriers[i]; if(a.v>0&&b.v===0) items.push({cls:"good", t:`бар'єр «${lc(b.name)}» зник`}); else if(a.v===0&&b.v>0) items.push({cls:"bad", t:`з'явився бар'єр «${lc(b.name)}»`}); else if(a.v!==b.v) items.push({cls:b.v<a.v?"good":"bad", t:`бар'єр «${lc(b.name)}» ${b.v<a.v?"слабшає":"сильнішає"}`}); });

  rn.coverage.items.forEach((c,i)=>{ const a=rp.coverage.items[i]; const okN=["ok","weak"].includes(c.status), okP=["ok","weak"].includes(a.status); if(okN&&!okP) items.push({cls:"good", t:`«${c.short}» отримала власника`}); else if(okP&&!okN) items.push({cls:"bad", t:`«${c.short}»: ${lc(c.text)}`}); });
  const pp=passCount(sp), pn=passCount(sn); if(pp!==pn) items.push({cls:pn>pp?"good":"bad", t:`рішень проходять: ${pp} → ${pn} з ${S.DECISIONS.length}`});

  if(!items.length && diff){ diff.toggles.forEach(t=>{ const tg=TOGGLES.find(x=>x.id===t.id); if(tg) items.push({cls:"", t:`правило «${tg.name}» ${t.to?"увімкнено":"вимкнено"}`}); }); }
  if(!items.length){ const fp=new Set(rp.fired.map(f=>f.id)), fn=new Set(rn.fired.map(f=>f.id)); rn.fired.filter(f=>!fp.has(f.id)).slice(0,2).forEach(f=>items.push({cls:"", t:`спрацювало правило: ${f.title}`})); rp.fired.filter(f=>!fn.has(f.id)).slice(0,2).forEach(f=>items.push({cls:"", t:`правило вимкнулось: ${f.title}`})); }

  diff.toggles.forEach(t=>{ const tg=TOGGLES.find(x=>x.id===t.id); if(tg) out.push(`${lc(tg.name)}: ${t.to?"увімкнено":"вимкнено"}`); });

function renderCap(kind, label, items, extra){

/* ---------- хід: анімація від попереднього стану ---------- */
function clearTimers(){ V.timers.forEach(clearTimeout); V.timers=[]; }
function captureRects(){ const b=$("#dboard"); const r0=b.getBoundingClientRect(); const s=r0.width/b.offsetWidth; const m={}; $$(".dch",b).forEach(c=>{ const r=c.getBoundingClientRect(); const cell=c.parentElement; m[c.dataset.k]={x:(r.left-r0.left)/s,y:(r.top-r0.top)/s,w:r.width/s,h:r.height/s,html:c.outerHTML,cell:cell.dataset.lane+"/"+cell.dataset.level}; }); return m; }
function flip(prev, hot){
  const b=$("#dboard"); const r0=b.getBoundingClientRect(); const s=r0.width/b.offsetWidth; const seen=new Set();
  $$(".dch",b).forEach(c=>{ const k=c.dataset.k; seen.add(k); const r=c.getBoundingClientRect(); const cur={x:(r.left-r0.left)/s,y:(r.top-r0.top)/s}; const p=prev[k];
    if(!p){ c.classList.add("arrive"); hot.add(k); return; }
    const dx=p.x-cur.x, dy=p.y-cur.y; if(Math.abs(dx)<1&&Math.abs(dy)<1) return;
    const cell=c.parentElement; const sameCell=p.cell===(cell.dataset.lane+"/"+cell.dataset.level);
    if(sameCell){ c.style.transition="none"; c.style.transform=`translate(${dx}px,${dy}px)`; void c.offsetWidth; c.style.transition=`transform ${Math.round(MOVE_MS*.6)}ms ease`; c.style.transform=""; return; }
    hot.add(k);
    c.style.transition="none"; c.style.transform=`translate(${dx}px,${dy}px)`; c.classList.add("moving"); void c.offsetWidth; c.style.transition=`transform ${MOVE_MS}ms cubic-bezier(.25,.8,.25,1)`; c.style.transform="";
    const g=document.createElement("div"); g.className="dghost"; g.style.cssText=`left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px`; b.appendChild(g); V.timers.push(setTimeout(()=>g.remove(), HOLD_MS)); });

function onMove(msg){
  clearTimers(); const prevSt=msg.prev?E.deserialize(msg.prev):null; const rp=prevSt?E.compute(prevSt):null; const sp=prevSt?S.DECISIONS.map(d=>S.run(d.id,prevSt)):null; const Pp=rp?E.indexPrinciples(rp):null;
  V.n=msg.n||0; V.label=plain(msg.label||""); V.presetName=msg.presetName||V.presetName; V.focus=null;
  const rects=(prevSt&&!reduced)?captureRects():null;
  setState(msg.st, msg.base); renderHead();
  const hot=new Set(); const diff=prevSt?E.diff(prevSt,V.st):null;
  if(diff){ diff.funcs.forEach(f=>hot.add("fn:"+f.id)); diff.structs.forEach(s=>hot.add("st:"+s.id)); }

  const cap=$("#dcap"); cap.classList.remove("in");
  V.timers.push(setTimeout(()=>{ renderNums(rp, sp); }, rp?350:0));

/* ---------- прохід по ходах сценарію: оператор гортає кроки, показ підсвічує блок або клітинку і пише крок ---------- */
function onWalk(msg){

function onFocus(msg){

}

/* ---------- зв'язок з оператором ---------- */
addEventListener("message", e=>{ const m=e.data; if(!m||m.poligon!==1) return;
  if(m.type==="state"){ V.connected=true; if(V.hello){ clearInterval(V.hello); V.hello=null; }

(function start(){

<script>

(function(D,E,S){

function load(st, presetId){ App.st = st; if(!App.st.scen) App.st.scen=[]; App.base = E.fromPreset(presetId||st.preset); App.st.preset = App.base.preset; App.baseRes = E.compute(App.base); recompute(); }
function recompute(){ App.res = E.compute(App.st); App.simAll = S.DECISIONS.map(d=>S.run(d.id, App.st)); if(App.sim.res && !App.sim.running){ App.sim.res = App.simAll.find(r=>r.decision.id===App.sim.dec) || null; App.sim.shown = 7; } }
function snapshot(r, simAll){ const bde=r.staff.units.find(u=>u.unit==="бригада")||{n:0}; return { "Час за призначенням, середнє":[r.time.avg,"%"], "Час на роті":[r.time.levels[0].na?null:r.time.levels[0].core,"%"], "Функцій без власника":[r.coverage.missing,""], "Дублювань":[r.coverage.dup,""], "Бар'єрів довіри":[r.trust.active,"/8"], "Вага бар'єрів":[r.trust.score,""], "Форм звітності":[r.signal.forms,""], "Годин на донесення":[r.signal.hours,""], "Документів до зміни":[r.norm.count,""], "Посад на бригаду":[bde.n,""], "Ризиків":[r.risks.length,""], "Відкритих питань":[r.questions.length,""], "Рішень проходять":[(simAll||[]).filter(x=>!x.blocked).length,"/"+S.DECISIONS.length] }; }
function apply(label, mut, opts){
  opts=opts||{};
  const before=snapshot(App.res, App.simAll), firedBefore=new Map(App.res.fired.map(f=>[f.id,f])); const prevSt=E.clone(App.st);
  App.history.push(E.clone(App.st)); if(App.history.length>80) App.history.shift(); App.future=[]; App.labels.push(label);
  mut(App.st); recompute();
  const after=snapshot(App.res, App.simAll), firedAfter=new Map(App.res.fired.map(f=>[f.id,f]));
  const changes=Object.keys(after).filter(k=>String(before[k][0])!==String(after[k][0])).map(k=>({name:k, from:before[k][0], to:after[k][0], unit:after[k][1]}));
  const on=[...firedAfter.values()].filter(f=>!firedBefore.has(f.id)), off=[...firedBefore.values()].filter(f=>!firedAfter.has(f.id));
  App.lastMove={ label, changes, on, off, n:App.labels.length, scen:opts.scen||null };
  if(opts.anim && !reduced){ if(App.view==="board") animatedRender(prevSt); else { App.pendingAnim=App.pendingAnim||prevSt; render(); } }
  else render();
  if(!opts.quiet) toast(`${label}<br><span class="dim">${changes.length?`змінилось індикаторів: <b>${changes.length}</b>`:"індикатори без змін"}${on.length||off.length?` · правил +${on.length} −${off.length}`:""}</span>`); syncHash();
  dispSend("move", prevSt, label, opts.scen?{ scen:{ short:opts.scen.short||opts.scen.name, n:opts.scen.moves.length, status:opts.scen.status } }:null);
}

function dispSend(kind, prevSt, label, extra){

  const msg=Object.assign({ poligon:1, type:"state", kind, label:label||"", st:E.serialize(App.st), prev:prevSt?E.serialize(prevSt):null, base:E.serialize(App.base), n:App.labels.length, preset:App.st.preset, presetName:curPreset().name }, extra||{});
  try{ w.postMessage(msg, "*"); }catch(e){}
}

function dispWalk(step){ if(!App.disp || App.disp.closed) return; try{ App.disp.postMessage({ poligon:1, type:"state", kind:step?"walk":"walkEnd", step:step||null }, "*"); }catch(e){} }

/* анімація ходів сценарію: дошка спершу малюється у попередньому стані, потім блоки їдуть на нові місця (FLIP), числа перераховуються після анімації */
function boardTransition(prevSt){
  const cur=App.st, curRes=App.res; App.st=prevSt; App.res=E.compute(prevSt); renderStage(); const rects=captureRects(); App.st=cur; App.res=curRes; renderStage(); flipBoard(rects, ANIM_MS);
  const d=E.diff(prevSt, cur); d.toggles.forEach(t=>{ const el=$(`.tg[data-tg="${t.id}"]`); if(el){ el.classList.remove("clack"); void el.offsetWidth; el.classList.add("clack"); } });
}
function animatedRender(prevSt){
  renderHeader(); const m=$("#main"); m.className="main"+(App.fly?" fly":""); renderRail(); renderFlyout(); closePop();
  boardTransition(prevSt);
  setTimeout(()=>{ renderHero(); renderPanel(); drawThreads(); drawEdges(); applyLens(); placeToken(false); }, ANIM_MS+40);
}
function captureRects(){ const board=$("#board"); if(!board) return null; const b=board.getBoundingClientRect(); const m={}; $$(".chip",board).forEach(c=>{ const r=c.getBoundingClientRect(); m[c.dataset.kind+":"+c.dataset.id]={x:r.left-b.left+board.scrollLeft,y:r.top-b.top+board.scrollTop,w:r.width,h:r.height,html:c.outerHTML}; }); return m; }
function flipBoard(prev, dur){
  const board=$("#board"); if(!board||!prev) return; const b=board.getBoundingClientRect(); const seen=new Set(); const th=$("svg.threads",board); if(th){ th.style.opacity="0"; setTimeout(()=>{ th.style.transition=`opacity ${Math.round(dur/2)}ms`; th.style.opacity=""; }, dur); }
  $$(".chip",board).forEach(c=>{ const k=c.dataset.kind+":"+c.dataset.id; seen.add(k); const r=c.getBoundingClientRect(); const cur={x:r.left-b.left+board.scrollLeft,y:r.top-b.top+board.scrollTop}; const p=prev[k];
    if(!p){ c.classList.add("arrive"); c.style.animationDuration=dur+"ms"; setTimeout(()=>c.classList.remove("arrive"), dur+50); return; }
    const dx=p.x-cur.x, dy=p.y-cur.y; if(Math.abs(dx)<1&&Math.abs(dy)<1) return;
    c.style.transition="none"; c.style.transform=`translate(${dx}px,${dy}px)`; c.classList.add("moving"); void c.offsetWidth; c.style.transition=`transform ${dur}ms cubic-bezier(.3,.8,.3,1)`; c.style.transform=""; setTimeout(()=>{ c.classList.remove("moving"); c.style.transition=""; }, dur+50); });
  Object.entries(prev).forEach(([k,p])=>{ if(seen.has(k)) return; const g=document.createElement("div"); g.className="leave"; g.style.cssText=`left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px;animation-duration:${dur}ms`; g.innerHTML=p.html; board.appendChild(g); setTimeout(()=>g.remove(), dur+50); });
}
/* сценарії: пакет ходів як один хід; накладаються як diff у порядку застосування */
function moveText(m){ if(m.kind==="tg"){ const t=TOGGLES.find(x=>x.id===m.id); return `${m.on?"увімкнути":"вимкнути"}: ${t?t.name:m.id}`; } if(m.kind==="fn"){ return m.off?`забрати «${FM[m.id].short}» з дошки`:`«${FM[m.id].short}» → ${LANE[m.lane].short}, до «${LVL[m.depth].short}»`; } return m.off?`зняти ${SM[m.id].short}`:`${SM[m.id].short} → ${LANE[m.lane].short}, ${LVL[m.level].short}`; }
function toggleScenario(id){
  const sc=E.SCMAP[id]; if(!sc) return; const active=(App.st.scen||[]).includes(id);
  if(!active){ let err=null; apply(`Сценарій: ${esc(sc.name)}`, st=>{ try{ const base=st.scenBase||E.baseOf(st); const n=E.applyScenario(st,id); Object.assign(st,n); st.scenBase=base; }catch(e){ err=e; } }, {anim:true, scen:sc, quiet:true}); if(err){ undo(); toast(`<b>Сценарій не застосовано.</b> ${esc(err.message)}`, true); return; } toast(`<b>${esc(sc.short||sc.name)}</b>: ${sc.moves.length} ход${sc.moves.length===1?"":sc.moves.length<5?"и":"ів"} на дошці · застосовано ${App.st.scen.length}`); }
  else {
    /* зняття: відбудова від знімка перед першим сценарієм плюс решта сценаріїв, а поверх них ручні ходи, зроблені після сценаріїв
       (різниця між «чистим» станом сценаріїв і поточним, накладена через canPlace). Знімок живе у стані, тож працює і з посилання. */
    const ids=App.st.scen||[], rest=ids.filter(x=>x!==id); const base=E.fromBase(App.st.scenBase||E.baseOf(App.st), App.st.preset);
    let pure=E.clone(base); ids.forEach(r=>{ try{ pure=E.applyScenario(pure,r); }catch(e){} }); const manual=E.diff(pure, App.st); let skipped=[];
    apply(`Знято сценарій: ${esc(sc.name)}`, st=>{ let n=E.clone(base); rest.forEach(r=>{ n=E.applyScenario(n,r); }); skipped=E.replayDiff(n, manual); n.scenBase = rest.length ? App.st.scenBase : null; Object.assign(st,n); }, {anim:true});
    if(skipped.length) toast(`Сценарій знято; ручні ходи повернуто, крім: ${esc(skipped.join(", "))}`, true); }
}
function undo(){ if(!App.history.length) return; const prev=E.clone(App.st); App.future.push(E.clone(App.st)); App.st=App.history.pop(); App.labels.pop(); App.lastMove=null; recompute(); render(); toast("Відкат ходу"); syncHash(); dispSend("undo", prev, "Відкат ходу"); }
function redo(){ if(!App.future.length) return; const prev=E.clone(App.st); App.history.push(E.clone(App.st)); App.st=App.future.pop(); App.labels.push("повтор"); recompute(); render(); toast("Повтор ходу"); syncHash(); dispSend("move", prev, "Повтор ходу"); }

  const titles={funcs:"Функції",structs:"Посади і органи",rules:"Правила і підсилення"};
  let h=`<div class="fh"><span class="t">${titles[App.fly]}</span><button class="x" data-fly-close>закрити</button></div>`;
  if(App.fly==="funcs"){ h+=`<section><p class="pal-note" style="margin:0 0 6px">18 функцій. Кожна має дозволені вертикалі: перетягни на дошку і побачиш, куди можна. Бліді вже на дошці.</p>`; Object.entries(FGROUP).forEach(([g,gn])=>{ const fs=FUNCS.filter(f=>f.group===g); if(!fs.length) return; h+=`<div class="cap pal-group">${esc(gn)}</div><div class="pal-list">`; fs.forEach(f=>{ const p=App.st.funcs[f.id]; const on=!!p; h+=`<div class="chip fn ${on?"onboard":""}" draggable="${!on}" data-kind="fn" data-id="${f.id}" style="--c:${GCOL[f.group]}" title="${esc(f.desc)} Дозволено: ${f.lanes.map(l=>LANE[l].short).join(", ")}"><span class="sw"></span><span class="n">${esc(f.short)}</span>${on?`<span class="d">${esc(LANE[p.lane].short)} · ${esc(LVL[p.depth].short)}</span>`:`<span class="badge red">поза дошкою</span>`}</div>`; }); h+=`</div>`; }); h+=`</section>`; }
  else if(App.fly==="structs"){ h+=`<section><p class="pal-note" style="margin:0 0 6px">Кожна посада має свій рівень і дозволені вертикалі. Числа: посад на одиницю рівня, ~ означає оцінку.</p>`; const groups=[["Вертикаль напряму","ppp"],["Командир, ВСП, юристи",["cmd","vsp"]],["Суміжні",["cvs","med","pers","vmu","ext"]]]; groups.forEach(([gn,lanes])=>{ const ls=Array.isArray(lanes)?lanes:[lanes]; const ss=STRUCTS.filter(s=>ls.includes(s.lane)); h+=`<div class="cap pal-group">${esc(gn)}</div><div class="pal-list">`; ss.forEach(s=>{ const p=App.st.structs[s.id]; const on=!!p; h+=`<div class="chip st ${on?"onboard":""}" draggable="${!on}" data-kind="st" data-id="${s.id}" style="--c:${LANE[s.lane].color}" title="${esc(s.desc)}"><span class="n">${esc(s.short)}</span><span class="d">${on?esc(LANE[p.lane].short+" · "+LVL[p.level].short):esc(LVL[s.level].short)}${s.posts.n!=null?" · "+s.posts.n+(s.posts.est?"~":""):""}</span></div>`; }); h+=`</div>`; }); h+=`</section>`; }
  else { h+=`<section><div class="cap pal-group">Правила системи</div>`; TOGGLES.filter(t=>t.group==="rule").forEach(t=>{ h+=tgHtml(t); }); h+=`<div class="cap pal-group" style="margin-top:12px">Підсилення ланок</div>`; TOGGLES.filter(t=>t.group==="reinf").forEach(t=>{ h+=tgHtml(t); }); h+=`</section>`; }
  f.innerHTML=h;
  f.querySelector("[data-fly-close]").addEventListener("click",()=>{ App.fly=null; $("#main").classList.remove("fly"); renderRail(); renderFlyout(); setTimeout(()=>{ drawThreads(); drawEdges(); placeToken(false); },220); });
  f.querySelectorAll(".chip:not(.onboard)").forEach(ch=>{ bindDragSource(ch); ch.addEventListener("click",()=>{ const kind=ch.dataset.kind, id=ch.dataset.id; if(kind==="fn"){ const fn=FM[id]; const home=fn.norm&&fn.lanes.includes(fn.norm.lane)?fn.norm:{lane:fn.lanes[0],depth:fn.need}; apply(`«${esc(fn.short)}» повернуто на дошку`, st=>{ st.funcs[id]={lane:home.lane,depth:home.depth}; }); } else { const s=SM[id]; apply(`${esc(s.short)} додано`, st=>{ st.structs[id]={lane:s.lane,level:s.level}; }); } }); });
  f.querySelectorAll(".tg").forEach(t=>{ const fire=()=>{ const id=t.dataset.tg; const on=!App.st.toggles[id]; apply(`${on?"Увімкнено":"Вимкнено"}: ${esc(TOGGLES.find(x=>x.id===id).name)}`, st=>{ st.toggles[id]=on; }); }; t.addEventListener("click",fire); t.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fire(); } }); });

function tgHtml(t){ return `<div class="tg" role="switch" tabindex="0" aria-checked="${!!App.st.toggles[t.id]}" data-tg="${t.id}"><span class="sw"></span><div><div class="n">${esc(t.name)}</div><div class="d">${esc(t.desc)}</div></div></div>`; }

/* ===== board ===== */
function renderBoard(host){
  const st=App.st, res=App.res, laneName=st.laneName;
  const gapMap={}; res.gaps.forEach(g=>{ (gapMap[g.lane+"/"+g.level]=gapMap[g.lane+"/"+g.level]||[]).push(g); });
  let h=App.introOff?"":`<div class="intro" id="intro"><span class="k">Як грати</span><ol><li><b>Обери пресет</b> угорі або скинь дошку і збирай з нуля.</li><li><b>Перетягни блок</b> у дозволену клітинку (зелені підсвітяться), клікни на блок, щоб замінити чи забрати.</li><li><b>Прогони рішення</b> у вкладці «Рішення»: побачиш, де воно проходить, а де впирається.</li></ol><button class="x go" data-tour-start>тур · 2 хв</button><button class="x" id="introX">сховати</button></div>`;
  h+=`<div class="board-wrap"><div class="board" id="board">`;
  h+=`<div class="lh corner"><span class="cap">рівень</span></div>`;
  LANES.forEach(l=>{ const big=l.id==="ppp"?laneName:l.short, sub=l.id==="ppp"?"вертикаль реформи":l.name; h+=`<div class="lh ${l.id}" data-lane="${l.id}" style="--c:${l.color}" title="${esc(l.name)}"><span class="ln">${esc(big)}</span><small>${esc(sub)}</small></div>`; });
  LEVELS.forEach(lv=>{
    h+=`<div class="rh ${lv.id}" data-level="${lv.id}"><div class="t">${esc(lv.short)}</div><div class="s"><b>${esc(lv.name)}</b>${esc(lv.note)}</div></div>`;
    LANES.forEach(l=>{
      const key=l.id+"/"+lv.id; const gaps=gapMap[key]||[];
      const fns=FUNCS.filter(f=>{ const p=st.funcs[f.id]; return p&&p.lane===l.id&&p.depth===lv.id; });
      const sts=Object.entries(st.structs).filter(([id,p])=>p.lane===l.id&&p.level===lv.id).map(([id])=>id);
      h+=`<div class="cell ${l.id} ${lv.id}" data-lane="${l.id}" data-level="${lv.id}">`;
      sts.forEach(id=>{ const s=SM[id]; h+=`<div class="chip st" draggable="true" data-kind="st" data-id="${id}" style="--c:${LANE[l.id].color}" title="${esc(s.name)}"><span class="n">${esc(s.short)}</span>${s.posts.n!=null?`<span class="d">${s.posts.n}${s.posts.est?"~":""}</span>`:""}</div>`; });
      fns.forEach(f=>{ const cov=res.coverage.items.find(i=>i.id===f.id); const bad=cov&&["dup","noexec","drain"].includes(cov.status); h+=`<div class="chip fn ${bad?"gapchip "+cov.status:""}" draggable="true" data-kind="fn" data-id="${f.id}" style="--c:${GCOL[f.group]}" title="${esc(f.name)}${cov&&cov.status!=="ok"?" · "+esc(cov.text):""}"><span class="sw"></span><span class="n">${esc(f.short)}</span>${bad?`<span class="badge red">${cov.status==="dup"?"дубль":cov.status==="drain"?"стікає":"без виконавця"}</span>`:""}</div>`; });
      gaps.forEach(g=>{ const f=FM[g.fid]; const here=fns.some(x=>x.id===g.fid); if(here) return; if(g.level!==f.need) return; const missing=!st.funcs[g.fid]; h+=`<button class="ghost ${missing?"missing":""}" data-ghost="${g.fid}" data-lane="${l.id}" data-level="${lv.id}" style="--c:${GCOL[f.group]}" title="${esc(missing?f.short+": функції немає на дошці; клік повертає її сюди":f.short+": потрібна до «"+LVL[f.need].short+"», доходить лише до «"+LVL[st.funcs[g.fid].depth].short+"»; клік опускає сюди")}"><i></i>${esc(f.short)}</button>`; });
      if(!sts.length&&!fns.length&&!gaps.length) h+=`<span class="empty">сюди</span>`;
      h+=`</div>`;
    });
  });
  h+=`<div class="pltstrip" id="plt"><b>Взвод · боєць · сержант</b><span>перший адресат у скруті: <span class="num">побратим 27</span> · <span class="num">командир 22</span> · <span class="num">сержант 17</span> · фахівець 4, за словами рядових і сержантів</span><span class="dim">${st.toggles.training?"навчання сержантів увімкнено":"навчання сержантів не увімкнено"}</span></div>`;
  h+=`<div class="simtoken" id="simtoken"></div>`;
  h+=`</div></div>`;
  h+=`<div class="lensbar" id="lensbar" hidden></div>`;
  h+=`<div class="board-note" id="bnote"></div>`;
  host.innerHTML=h;
  const ix=$("#introX"); if(ix) ix.addEventListener("click",()=>{ App.introOff=true; store.set("poligon_intro","1"); render(); });
  const ts=$("[data-tour-start]",host); if(ts) ts.addEventListener("click",startTour);
  renderBoardNote(); renderLensBar(); bindBoard(host);
}
function renderLensBar(){ const b=$("#lensbar"); if(!b) return; const P=PERSONAS.find(p=>p.id===App.lens); if(!P){ b.hidden=true; b.innerHTML=""; return; } b.hidden=false; b.innerHTML=`<span class="i">${P.icon}</span><span><b>Оптика:</b> очима ${esc(P.name.toLowerCase()==="боєць і сержант"?"бійця і сержанта":P.name)}</span><span class="dim">видно те, що доходить до цієї позиції; решта пригашена</span><button data-lens-off>вимкнути · Esc</button>`; b.querySelector("[data-lens-off]").addEventListener("click",()=>{ App.lens=null; render(); }); }
function renderBoardNote(){

/* нитки: вертикаль функції від заголовка колонки до пігулки */
function drawThreads(){
  const board=$("#board"); if(!board) return; const old=$("svg.threads",board); if(old) old.remove();
  const st=App.st; const b=board.getBoundingClientRect(); const W=board.scrollWidth, H=board.scrollHeight; let body="";
  LANES.forEach(l=>{
    const lh=$(`.lh[data-lane="${l.id}"]`,board); if(!lh) return; const hr=lh.getBoundingClientRect();
    FUNCS.filter(f=>st.funcs[f.id]&&st.funcs[f.id].lane===l.id).forEach(f=>{ const chip=$(`.chip.fn[data-id="${f.id}"]`,board); if(!chip) return; const cr=chip.getBoundingClientRect(); const dot=chip.querySelector(".sw"); const dr=dot?dot.getBoundingClientRect():cr;
      const x=dr.left-b.left+dr.width/2, y0=hr.bottom-b.top+1, y1=cr.top-b.top-1; const col=GCOL[f.group];
      let gap=""; const gh=$(`.ghost[data-ghost="${f.id}"]`,board); if(gh){ const gr=gh.getBoundingClientRect(); const gi=gh.querySelector("i"); const gir=gi?gi.getBoundingClientRect():gr; const gx=gir.left-b.left+gir.width/2, gy=gr.top-b.top-1, y2=cr.bottom-b.top+1; gap=`<path class="gap" d="M${x.toFixed(1)} ${y2.toFixed(1)}V${((y2+gy)/2).toFixed(1)}H${gx.toFixed(1)}V${gy.toFixed(1)}"/>`; }
      body+=`<g class="th" data-th="${f.id}" style="--c:${col}"><path d="M${x.toFixed(1)} ${y0.toFixed(1)}V${y1.toFixed(1)}" stroke="${col}"/><circle cx="${x.toFixed(1)}" cy="${(y0+2).toFixed(1)}" r="2.4" fill="${col}"/>${gap}</g>`; });
  });
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg"); svg.setAttribute("class","threads"); svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.setAttribute("width",W); svg.setAttribute("height",H); svg.innerHTML=body; board.insertBefore(svg, board.firstChild);
}
function bindDragSource(ch){
  ch.addEventListener("dragstart",e=>{ const kind=ch.dataset.kind, id=ch.dataset.id; e.dataTransfer.setData("text/plain",kind+":"+id); e.dataTransfer.effectAllowed="move"; ch.classList.add("dragging"); closePop(); App.drag={kind,id}; markCells(kind,id); });
  ch.addEventListener("dragend",()=>{ ch.classList.remove("dragging"); App.drag=null; unmarkCells(); });
}
function markCells(kind,id){ const b=$("#board"); if(!b) return; b.classList.add("dragging"); $$(".cell",b).forEach(c=>{ const ok=E.canPlace(kind,id,c.dataset.lane,c.dataset.level).ok; c.classList.toggle("can",ok); c.classList.toggle("cant",!ok); }); }
function unmarkCells(){ const b=$("#board"); if(!b) return; b.classList.remove("dragging"); $$(".cell",b).forEach(c=>c.classList.remove("can","cant","over")); }
function bindBoard(host){
  host.querySelectorAll(".board .chip").forEach(ch=>{
    bindDragSource(ch);
    ch.addEventListener("click",e=>{ e.stopPropagation(); chipMenu(ch); });
    ch.addEventListener("mouseenter",()=>{ if(ch.dataset.kind==="fn") hiRail(ch.dataset.id,true); });
    ch.addEventListener("mouseleave",()=>{ if(ch.dataset.kind==="fn") hiRail(ch.dataset.id,false); });
  });
  host.querySelectorAll(".cell").forEach(c=>{
    c.addEventListener("dragover",e=>{ e.preventDefault(); const ok=!App.drag||E.canPlace(App.drag.kind,App.drag.id,c.dataset.lane,c.dataset.level).ok; e.dataTransfer.dropEffect=ok?"move":"none"; c.classList.add("over"); });
    c.addEventListener("dragleave",()=>c.classList.remove("over"));
    c.addEventListener("drop",e=>{ e.preventDefault(); c.classList.remove("over"); const d=(e.dataTransfer.getData("text/plain")||"").split(":"); if(d.length<2) return; dropBlock(d[0],d[1],c.dataset.lane,c.dataset.level,c); });
  });
  host.querySelectorAll("[data-ghost]").forEach(g=>g.addEventListener("click",e=>{ e.stopPropagation(); const fid=g.dataset.ghost, lane=g.dataset.lane, level=g.dataset.level; const f=FM[fid]; const tl=f.lanes.includes(lane)?lane:(App.st.funcs[fid]?App.st.funcs[fid].lane:f.lanes[0]); dropBlock("fn",fid,tl,level,g.closest(".cell")); }));
}
function hiRail(fid,on){ $$(`[data-th="${fid}"]`).forEach(i=>i.classList.toggle("hi",on)); const p=App.st.funcs[fid]; if(!p) return; $$(".cell").forEach(c=>{ if(c.dataset.lane===p.lane && li(c.dataset.level)<=li(p.depth)) c.classList.toggle("rail-hi",on); }); }
function refuse(cell, why){ if(cell){ cell.classList.remove("shake"); void cell.offsetWidth; cell.classList.add("shake"); } toast(`<b>Так не можна.</b> ${esc(why)}`, true); }
function dropBlock(kind,id,lane,level,cell){
  const chk=E.canPlace(kind,id,lane,level); if(!chk.ok){ refuse(cell, chk.why); unmarkCells(); return false; }
  if(kind==="fn"){ const cur=App.st.funcs[id]; if(cur&&cur.lane===lane&&cur.depth===level) return false; apply(`«${esc(FM[id].short)}» → ${esc(LANE[lane].short)}, до «${esc(LVL[level].short)}»`, st=>{ st.funcs[id]={lane,depth:level}; }); }
  else { const cur=App.st.structs[id]; if(cur&&cur.lane===lane&&cur.level===level) return false; apply(`${esc(SM[id].short)} → ${esc(LANE[lane].short)}, ${esc(LVL[level].short)}`, st=>{ st.structs[id]={lane,level}; }); }
  return true;
}
function chipMenu(ch){
  const kind=ch.dataset.kind, id=ch.dataset.id; $$(".chip.sel").forEach(c=>c.classList.remove("sel")); ch.classList.add("sel"); App.sel={kind,id};
  let h="";
  if(kind==="fn"){ const f=FM[id], p=App.st.funcs[id]; const cov=App.res.coverage.items.find(i=>i.id===id);
    h+=`<div class="t">${esc(f.name)}</div><div class="d">${esc(f.desc)}${f.norm?`<br><span class="cap">за нормою:</span> ${esc(LANE[f.norm.lane].short)}, до «${esc(LVL[f.norm.depth].short)}»`:`<br><span class="cap">у наказах виконавця немає</span>`}${p?`<br><span class="cap">зараз:</span> ${esc(LANE[p.lane].short)}, до «${esc(LVL[p.depth].short)}»`:""}${cov&&cov.status!=="ok"?`<br><span class="red">${esc(COVL[cov.status][0])}: ${esc(cov.text)}</span>`:""}</div>`;
    h+=`<div class="sub">Глибина в цій вертикалі</div><div class="row">${LEVELS.map(lv=>`<button data-act="depth" data-level="${lv.id}" class="${p&&lv.id===p.depth?"cur":""}" ${p&&lv.id===p.depth?"disabled":""}>${esc(lv.short)}</button>`).join("")}</div>`;
    h+=`<div class="sub">Вертикаль (дозволені)</div><div class="row">${LANES.map(l=>{ const ok=f.lanes.includes(l.id); return `<button data-act="lane" data-lane="${l.id}" class="${p&&l.id===p.lane?"cur":""}" ${!ok||(p&&l.id===p.lane)?"disabled":""} title="${ok?"":"недозволена вертикаль для цієї функції"}">${esc(l.short)}</button>`; }).join("")}</div>`;
    h+=`<div class="sub">Дії</div><button class="mi" data-act="remove"><b>×</b>Забрати з дошки (функція без власника)</button><button class="mi" data-act="info"><b>i</b>Свідчення по блоку</button>`;
  } else { const s=SM[id], p=App.st.structs[id]; h+=`<div class="t">${esc(s.name)}</div><div class="d">${esc(s.desc)}${s.posts.n!=null?`<br><span class="cap">посад на ${esc(s.posts.unit)}:</span> ${s.posts.n}${s.posts.est?" (оцінка)":""}`:""}<br><span class="cap">рівень:</span> ${esc(LVL[s.level].short)}, фіксований · <span class="cap">вертикалі:</span> ${s.lanes.map(l=>LANE[l].short).join(", ")}</div>`;
    if(s.lanes.length>1) h+=`<div class="sub">Підпорядкувати вертикалі</div><div class="row">${s.lanes.map(l=>`<button data-act="slane" data-lane="${l}" class="${p&&p.lane===l?"cur":""}" ${p&&p.lane===l?"disabled":""}>${esc(LANE[l].short)}</button>`).join("")}</div>`;
    const alts=(ALT[id]||[]).filter(a=>!App.st.structs[a]); if(alts.length){ h+=`<div class="sub">Замінити на</div>`; alts.forEach(a=>{ h+=`<button class="mi" data-act="replace" data-to="${a}"><b>⇄</b>${esc(SM[a].name)}</button>`; }); }
    const reinf=[["mobile","Бригадна мобільна група"],["clerk","Діловод напряму"]].filter(([rid])=>!App.st.structs[rid]&&["dep","gkbs","zkbn","zkr","khor_b","khor_bn","hk_b"].includes(id)); if(reinf.length){ h+=`<div class="sub">Підсилити ланку</div>`; reinf.forEach(([rid,n])=>{ h+=`<button class="mi" data-act="add" data-to="${rid}"><b>+</b>${esc(n)}</button>`; }); }
    h+=`<div class="sub">Дії</div><button class="mi" data-act="remove"><b>×</b>Забрати посаду з дошки</button><button class="mi" data-act="info"><b>i</b>Свідчення по блоку</button>`;
  }
  openPop(ch,h);
  $("#pop").querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); if(b.disabled) return; popAct(kind,id,b.dataset); }));
}
function popAct(kind,id,d){
  const act=d.act;
  if(act==="remove"){ if(kind==="fn") apply(`Забрано «${esc(FM[id].short)}»`, st=>{ st.funcs[id]=null; }); else apply(`Забрано ${esc(SM[id].short)}`, st=>{ delete st.structs[id]; }); }
  else if(act==="depth"){ const p=App.st.funcs[id]; const lane=p?p.lane:FM[id].lanes[0]; dropBlock("fn",id,lane,d.level,null); }
  else if(act==="lane"){ const p=App.st.funcs[id]; dropBlock("fn",id,d.lane,p?p.depth:FM[id].need,null); }
  else if(act==="slane"){ const p=App.st.structs[id]; dropBlock("st",id,d.lane,p?p.level:SM[id].level,null); }
  else if(act==="replace"){ const p=App.st.structs[id]; const to=SM[d.to]; const lane=to.lanes.includes(p.lane)?p.lane:to.lane; apply(`${esc(SM[id].short)} ⇄ ${esc(to.short)}`, st=>{ delete st.structs[id]; st.structs[d.to]={lane,level:to.level}; }); }
  else if(act==="add"){ const s=SM[d.to]; apply(`Підсилення: ${esc(s.short)}`, st=>{ st.structs[d.to]={lane:s.lane,level:s.level}; }); }
  else if(act==="info"){ closePop(); blockInfo(kind,id); }
}

}
