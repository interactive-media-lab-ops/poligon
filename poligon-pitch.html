/* ===== result (екран 8): один погляд для людини, що ухвалює рішення. Нічого не рахує: compute() і indexPrinciples(). Деталі в шухляді. ===== */
function nowRef(){ if(!App._now){ App._now=E.fromPreset("now"); App._nowRes=E.compute(App._now); App._nowP=E.indexPrinciples(App._nowRes); App._nowSim=S.DECISIONS.filter(d=>!S.run(d.id,App._now).blocked).length; } return App._now; }
const fmt1 = v => v==null ? "немає" : (Number.isInteger(v) ? String(v) : (+v).toFixed(1));
const fmt0 = v => v==null ? "немає" : String(Math.round(v));
function arrowDelta(d, unit, cls){ if(d==null||Math.abs(d)<0.05) return `<span class="rd none">без змін</span>`; return `<span class="rd ${d>0?"up":"down"} ${cls||""}">${d>0?"▲":"▼"} ${Math.abs(d)%1?Math.abs(d).toFixed(1):Math.abs(d)}${unit||""}</span>`; }
const PQ = { truth:"Чи доходить правда знизу нагору?", care:"Чи є кому дбати про людей на роті?", discipline:"Чи розведені допомога і покарання?", bureaucracy:"Скільки часу з'їдають папери?", delegate:"Чи вирішують там, де болить?", leaders:"Чи ростуть наступні лідери?", norm:"Чи узгоджені накази і практика?" };
function renderResult(host){
  nowRef(); const rA=App._nowRes, PA=App._nowP, rB=App.res, PB=E.indexPrinciples(rB), dP=E.diffPrinciples(PA,PB);
  const sel = D.PRINCIPLES.some(p=>p.id===App.resP) ? App.resP : D.PRINCIPLES[0].id; App.resP=sel;
  const scen=App.st.scen||[]; const prev=App.resPrev||{}; const P=PB[sel], d=dP[sel], pdef=D.PRINCIPLES.find(p=>p.id===sel);
  /* 1. сім принципів: велика цифра, смуга було → стало */
  const tiles=`<div class="ptiles">${D.PRINCIPLES.map(p=>{ const x=PB[p.id], y=PA[p.id]; const from=prev[p.id]!=null?prev[p.id]:x.value; return `<button class="ptile ${p.id===sel?"sel":""}" data-p="${p.id}" style="--v:${x.value};--from:${from};--base:${y.value}"><div class="pn">${esc(p.name)}</div><div class="pq">${esc(PQ[p.id]||p.measures)}</div><div class="pbar"><i class="base" title="чинна система: ${fmt0(y.value)}"></i><i class="fill"></i></div><div class="pv"><span class="now" data-from="${from}" data-to="${x.value}">${fmt0(from)}</span><small>зі 100</small></div><div class="pd">${Math.abs(x.value-y.value)<0.05?`<span class="rd none">як у чинній</span>`:arrowDelta(+(x.value-y.value).toFixed(1))+` <span class="dim">від чинної ${fmt0(y.value)}</span>`}</div></button>`; }).join("")}</div>`;
  /* 2. що, якщо: сценарії */
  const preview = s => { try{ const n=E.applyScenario(App.st, s.id); const PN=E.indexPrinciples(E.compute(n)); const ch=D.PRINCIPLES.map(p=>[p.short, +(PN[p.id].value-PB[p.id].value).toFixed(0)]).filter(x=>Math.abs(x[1])>=1).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])); return ch; }catch(e){ return null; } };
  const scl=`<div class="rsc"><div class="rt">Що, якщо…<span>клік застосовує кейс до системи, ще один клік знімає; під назвою: що зміниться саме зараз</span></div><div class="scgrid">${D.SCENARIOS.map(s=>{ const k=scen.indexOf(s.id); const on=k>=0; const ch=on?null:preview(s); const none=!on&&ch&&!ch.length; return `<button class="sc ${on?"on":""} ${none?"none":""}" data-sc="${s.id}" aria-pressed="${on}" title="${esc(s.pain.text)}"><span class="ord">${on?k+1:"+"}</span><span class="n">${esc(s.short||s.name)}</span><span class="pv">${on?`застосовано як крок ${k+1}`:none?"уже так у цій моделі: нічого не зміниться":ch?ch.slice(0,3).map(([n,d])=>`<b class="${d>0?"up":"down"}">${esc(n)} ${d>0?"+":""}${d}</b>`).join(" · "):"хід недозволений тут"}<i class="st ${s.status==="гіпотеза"?"hyp":""}">${s.status==="гіпотеза"?"пропозиція":"було в полі"}</i></span></button>`; }).join("")}</div></div>`;
  /* 3. чому так: фактори простими словами */
  const meas=d.factors.filter(f=>f.measurable);
  let why=`<div class="rwhy"><div class="rt">${esc(pdef.name)}: чому ${fmt0(PA[sel].value)}${Math.abs(d.delta)>=0.05?` → ${fmt0(P.value)}`:""}<span>${esc(PQ[sel]||"")}</span></div>`;
  why+=`<div class="wbars">${meas.map(f=>`<div class="wb"><div class="wl">${esc(f.text)}</div><div class="wt"><i class="base" style="--x:${f.xFrom}"></i><i class="fill" style="--x:${f.x}"></i></div><div class="wv">${fmt0(f.x*100)}<small>%</small>${Math.abs(f.x-f.xFrom)>=0.005?arrowDelta(+((f.x-f.xFrom)*100).toFixed(0)):""}</div></div>`).join("")}</div>`;
  const nm=d.factors.filter(f=>!f.measurable); if(nm.length) why+=`<p class="wnm">Поза лічбою: ${esc(nm.map(f=>f.text).join("; "))}. ${P.aggregation==="geometric"?"Згортка сувора: провал одного пункту тягне вниз усе.":"Пункти рівні, компенсують один одного."}</p>`;
  why+=`<div class="ractions"><button class="btn" id="toBoard">на дошку</button><button class="btn ghost" id="pDetail">детальніше: ваги, пороги, джерела</button></div></div>`;
  /* 4. п'ять чисел рушія одним рядком */
  const ownedA=FUNCS.length-rA.coverage.missing, ownedB=FUNCS.length-rB.coverage.missing; const passB=App.simAll.filter(x=>!x.blocked).length;
  const five=[["час на людей",rA.time.avg,rB.time.avg,"%"],["функцій з власником",ownedA,ownedB,"/18"],["бар'єрів довіри",rA.trust.active,rB.trust.active,"/8"],["ризиків",rA.risks.length,rB.risks.length,""],["рішень проходять",App._nowSim,passB,"/7"]];
  const pf=App.resPrevFive||{};
  const strip=`<div class="rfive">${five.map(([l,a,b,u])=>{ const from=pf[l]!=null?pf[l]:b; return `<div class="fv ${Math.abs(b-a)<0.05?"":"changed"}"><span class="l">${l}</span><span class="v"><b class="cnt" data-from="${from}" data-to="${b}" data-dec="${Number.isInteger(b)?0:1}">${fmt1(from)}</b><small>${u}</small></span><span class="fd">${Math.abs(b-a)<0.05?`<span class="rd none">як у чинній</span>`:`${arrowDelta(+(b-a).toFixed(1))} <span class="dim">від чинної ${fmt1(a)}</span>`}</span></div>`; }).join("")}<div class="fv note"><span class="l">база</span><span class="v small">${curPreset().id==="now"?"чинна система":esc(curPreset().name)}${scen.length?` + ${scen.length} крок${scen.length===1?"":scen.length<5?"и":"ів"}`:isDirty()?" зі змінами":""}</span></div></div>`;
  const base=`<div class="rbase"><span class="cap">база</span>${PRESETS.map(x=>`<button class="preset ${x.id===App.st.preset&&isDirty()?"dirty":""}" data-rpreset="${x.id}" aria-pressed="${x.id===App.st.preset}" style="--c:${x.color}" title="${esc(x.desc)}"><span class="dot"></span>${esc(x.name)}</button>`).join("")}<span class="dim rbase-note">${App.labels.length?`ходів від пресету: ${App.labels.length}`:""}</span></div>`;
  host.innerHTML=`<div class="res">${base}${tiles}<div class="rmid">${scl}${why}</div>${strip}</div>`;
  host.querySelectorAll("[data-rpreset]").forEach(b=>b.addEventListener("click",()=>{ if(b.dataset.rpreset===App.st.preset&&!isDirty()) return; if(isDirty()&&App.labels.length&&!confirm("Скинути поточні зміни і завантажити пресет?")) return; setPreset(b.dataset.rpreset); }));
  /* анімація: смуги і цифри їдуть від попереднього значення */
  requestAnimationFrame(()=>{ host.querySelectorAll(".ptile").forEach(t=>t.classList.add("go")); if(!reduced) host.querySelectorAll(".ptile .now").forEach(el=>{ const from=+el.dataset.from, to=+el.dataset.to; if(from===to) return; const t0=performance.now(); const step=now=>{ const k=Math.min(1,(now-t0)/ANIM_MS); el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(step); }; requestAnimationFrame(step); }); });
  App.resPrev=Object.fromEntries(Object.values(PB).map(p=>[p.id,p.value])); App.resPrevFive=Object.fromEntries(five.map(([l,a,b])=>[l,b]));
  if(!reduced) host.querySelectorAll(".rfive .cnt").forEach(el=>{ const from=+el.dataset.from, to=+el.dataset.to, dec=+el.dataset.dec; if(from===to) return; el.closest(".fv").classList.add("flash"); const t0=performance.now(); const step=now=>{ const k=Math.min(1,(now-t0)/ANIM_MS); el.textContent=(from+(to-from)*(1-Math.pow(1-k,3))).toFixed(dec); if(k<1) requestAnimationFrame(step); }; requestAnimationFrame(step); });
  host.querySelectorAll("[data-p]").forEach(b=>b.addEventListener("click",()=>{ App.resP=b.dataset.p; renderResult(host); }));
  host.querySelectorAll("[data-sc]").forEach(b=>b.addEventListener("click",()=>toggleScenario(b.dataset.sc)));
  $("#toBoard",host).addEventListener("click",()=>{ const hasScen=(App.st.scen||[]).length>0; const anim=!!App.pendingAnim&&!reduced; App.view="board"; render(); if(hasScen) setTimeout(startWalk, anim?ANIM_MS+150:150); });
  $("#pDetail",host).addEventListener("click",()=>openDrawer(pdef.name, principleDetailHtml(sel, PA, PB, dP)));
}
/* шухляда: повне дерево з вагами, порогами, цілями і паспортами; ходи сценаріїв; відкриті питання; чого рушій не міряє */
function principleDetailHtml(sel, PA, PB, dP){
  const P=PB[sel], d=dP[sel], pdef=D.PRINCIPLES.find(p=>p.id===sel), meta=D.PRINCIPLES_META, unst=E.sensitivity(App.res)[sel]||[];
  const evBtns = ids => (ids||[]).map(e=>`<button class="evb" data-ev="${e}" title="${esc(EV[e]?EV[e].text:"")}">${e}</button>`).join("");
  let h=`<p class="pq">${esc(pdef.quote)} ${evBtns(pdef.ev)}</p><p class="pmeta"><span>індекс: чинна ${fmt1(PA[sel].value)} → зараз <b>${fmt1(P.value)}</b></span><span>згортка: <b>${P.aggregation==="geometric"?`геометрична, нижня межа ${meta.floor}`:"адитивна"}</b> · ${esc(pdef.why_agg)}</span><span>ваги: ${(()=>{ const w=E.weightsInfo(); return w.signed ? `<b>підписані</b> · ${esc(w.source)}${w.signedBy?" · "+esc(w.signedBy):""} · ${esc(w.date)}` : `${esc(meta.weightsRule)}; вимір 2 · норма 2 · самозвіт 1 · оцінка 0,5 · від ${esc(meta.weightsDate)} · ${esc(meta.review)} · експертної таблиці ще немає (роль 03)`; })()}</span></p><div class="ftree">`;
  d.factors.forEach((f,i)=>{ const F=P.factors[i]; const u=unst.includes(f.id);
    if(!f.measurable){ h+=`<div class="fct nm"><div class="fh"><span class="fw">поза сумою</span><span class="ft">${esc(f.text)}</span><span class="fx dim">не вимірюється</span></div><div class="fnote">${esc(F.note)}</div></div>`; return; }
    h+=`<div class="fct"><div class="fh"><span class="fw">w ${F.w.toFixed(2)}</span><span class="ft">${esc(f.text)}${u?` <span class="unst" title="зміна ваги на ±20 % міняє порядок факторів за потенціалом">нестійкий</span>`:""}</span><span class="fx"><span class="lab">внесок</span> ${fmt1(f.from)} → <b>${fmt1(f.to)}</b><span class="lab">потенціал</span> <b>${fmt1(f.potential)}</b></span></div>`;
    h+=`<table class="itab">${f.indicators.map(ind=>`<tr><td class="il">${esc(ind.label)}<div class="iw">${esc(ind.why)}</div></td><td class="in">${ind.naFrom?"посади немає":fmt1(ind.from)} → <b>${ind.na?"посади немає":fmt1(ind.to)}</b></td><td class="ip" title="поріг (x = 0) → ціль (x = 1)">${fmt1(ind.threshold)} → ${fmt1(ind.target)}</td><td class="ix">x ${ind.xFrom.toFixed(2)} → <b>${ind.x.toFixed(2)}</b></td><td class="it">${esc(ind.type)} · ${ind.w.toFixed(2)}</td><td class="ie">${evBtns(ind.ev)}</td></tr>`).join("")}</table></div>`; });
  h+=`</div>`;
  const act=(App.st.scen||[]).map(id=>E.SCMAP[id]).filter(Boolean);
  if(act.length) h+=`<div class="h3">Ходи сценаріїв</div><ol class="mvl">${act.map(s=>`<li><b>${esc(s.name)}</b> <span class="dim">· ${esc(s.status)}</span><ul>${s.moves.map(m=>`<li>${esc(moveText(m))}</li>`).join("")}</ul>${s.note?`<div class="fnote">${esc(s.note)}</div>`:""}<div class="evs" style="margin-top:4px">${evBtns(s.pain.ev)}</div></li>`).join("")}</ol>`;
  h+=`<div class="h3">Відкриті питання конфігурації (${App.res.questions.length})</div>${App.res.questions.length?`<ul class="rq">${App.res.questions.map(q=>`<li>${esc(q.text)} <span class="dim mono">${q.rule}</span></li>`).join("")}</ul>`:`<p class="dim">немає</p>`}`;
  h+=`<div class="h3">Рушій не вимірює</div><ul class="rq">${D.UNMEASURED.map(u=>`<li>${esc(u.text)} ${evBtns([u.ev])}</li>`).join("")}</ul>`;
  setTimeout(()=>{ $$("#drawer [data-ev]").forEach(b=>b.addEventListener("click",()=>showEv([b.dataset.ev],"Свідчення "+b.dataset.ev))); },0);
  return h;
}

/* ===== правила (екран 9): правила, умови кроків рішень, матриця бар'єрів, статус валідації ===== */

    <table class="mt rul"><tr><th>Правило</th><th>Умова</th><th>Ефекти</th><th>Свідчення</th><th>Валідація</th></tr>${rows.map(r=>{ const fx=E.ruleEffects(r); return `<tr class="${firedNow.has(r.id)?"on":""}"><td class="mono"><b>${r.id}</b>${firedNow.has(r.id)?`<span class="fired">спрацювало</span>`:""}<div class="dim" style="font-size:11px;font-family:var(--sans)">${esc(r.title)}</div></td><td>${esc(r.when)}${fx.conditional?`<div class="dim" style="font-size:11px">ефект залежить від деталей умови</div>`:""}</td><td>${fx.effects.map(e=>`<span class="fx" style="--c:${KC[e.kind]||"var(--ink-3)"}"><i>${esc(e.kind)}</i>${esc(e.text)}${e.coef?`<code>${esc(e.coef)}${e.est?" · оцінка":""}</code>`:""}</span>`).join("")}</td><td>${evb(fx.ev)}</td><td>${valBadge(r.id)}</td></tr>`; }).join("")}</table>${rows.length?"":`<p class="dim">Нічого не підходить під фільтр.</p>`}`;

    body=`<p class="lead">Сім рішень зверху, кожне йде сімома рівнями. На кожному рівні перевіряються умови в порядку списку: перша істинна визначає результат. Поточна гілка для конфігурації на дошці підсвічена. Для ролі 01: підтвердити або оскаржити кожну умову.</p>`+S.DECISIONS.map(d=>{ const run=App.simAll.find(x=>x.decision.id===d.id); return `<div class="h3">${esc(d.short)} <span class="dim">· ${esc(d.name)}</span></div><p class="dim" style="margin:0 0 6px">${esc(d.intro)}</p><table class="mt rul"><tr><th>Рівень</th><th>Умова</th><th>Результат</th><th>Що бачать</th><th>Свідчення</th><th>Що розблокує</th><th>Валідація</th></tr>${S.ORDER.map(l=>{ const bs=br.filter(b=>b.dec===d.id&&b.level===l).filter(b=>!f.unval||!D.VALIDATION[`${b.dec}/${b.level}/${b.i}`]); const cur=run?run.steps.find(x=>x.level===l):null; return bs.map((b,k)=>{ const active=cur&&cur.when===b.when&&cur.s===b.s; return `<tr class="${active?"on":""}">${k===0?`<td class="mono" rowspan="${bs.length}"><b>${esc(S.NAMES[l])}</b></td>`:""}<td>${esc(b.when)}${active?`<span class="fired">зараз</span>`:""}</td><td><span class="st ${b.s}">${({ok:"проходить",warn:"тертя",block:"блок"})[b.s]}</span></td><td>${esc(b.t)}</td><td>${evb(b.ev)}</td><td class="dim">${esc(b.fix||"")}</td><td>${valBadge(`${b.dec}/${b.level}/${b.i}`)}</td></tr>`; }).join(""); }).join("")}</table>`; }).join("");
  } else {

    <div class="bgrid">${bm.map(b=>{ const cur=App.res.trust.barriers.find(x=>x.id===b.id); return `<div class="bcard"><div class="bh"><b>${esc(b.name)}</b><span class="mono">вага ${b.w} · база ${String(b.base).replace(".",",")} · зараз <em>${String(cur.v).replace(".",",")}</em></span></div><table class="mt rul"><tr><th>Правило</th><th>Умова</th><th>Значення</th><th>Спосіб</th></tr>${b.movers.map(m=>`<tr class="${firedNow.has(m.rule)?"on":""}"><td class="mono"><b>${m.rule}</b></td><td>${esc(m.when)}</td><td class="mono">${String(m.value).replace(".",",")}${m.coef?`<div class="dim" style="font-size:10px">${esc(m.coef)}${m.est?" · оцінка":""}</div>`:""}</td><td class="dim">${m.up?"не нижче":"перезапис"}</td></tr>`).join("")}</table><div class="dim" style="font-size:11px;margin-top:6px">свідчення ваги: ${evb([b.ev])}</div></div>`; }).join("")}</div>`;
  }
  host.innerHTML=`<div class="scheme-top"><h2>Правила <span>· умови словами, ефекти словами, свідчення, перевірка</span></h2></div>
  <div class="filters"><div class="tabs">${tabs.map(([id,l])=>`<button class="tool ${f.tab===id?"primary":""}" data-rt="${id}">${l}</button>`).join("")}</div>
    ${f.tab!=="barriers"?`<label class="tool" style="cursor:pointer"><input type="checkbox" id="rfUnval" ${f.unval?"checked":""} style="margin:0 6px 0 0">лише не перевірені</label>`:""}

    <span class="cap">повна специфікація таблицями: docs/СПЕЦИФІКАЦІЯ.md · записи валідації: ${Object.keys(D.VALIDATION).length}</span></div>${body}`;
  host.querySelectorAll("[data-rt]").forEach(b=>b.addEventListener("click",()=>{ App.rf.tab=b.dataset.rt; renderRules(host); }));
  const u=$("#rfUnval"); if(u) u.addEventListener("change",e=>{ App.rf.unval=e.target.checked; renderRules(host); });
  const fr=$("#rfFired"); if(fr) fr.addEventListener("change",e=>{ App.rf.fired=e.target.checked; renderRules(host); });

/* ===== help ===== */
function renderHelp(host){
  const chip=(cls,c,t,badge)=>`<span class="chip ${cls}" style="--c:${c}"><span class="sw"></span><span class="n">${t}</span>${badge?`<span class="badge red">${badge}</span>`:""}</span>`;
  host.innerHTML=`<div class="help-doc fade">
  <div class="hero-h"><div><h1>Довідка <span>· як читати Полігон</span></h1><p class="lead">Полігон є пісочницею: ти збираєш систему підтримки персоналу з блоків і одразу бачиш наслідки. Він не радить і не оцінює моделі, він показує, що з чого випливає, і веде кожне число до джерела. Висновок робить людина.</p></div><div class="mini"><button class="btn" data-tour-start>▶ Інтерактивний тур · 2 хв</button></div></div>
  <div class="grid2">
    <div class="card gold"><h2>1 · Дошка</h2><ol><li><b>Рядки</b> це рівні управління: від Главкома і ГШ до роти. Під дошкою смуга взводу: боєць і сержант, до яких має дійти будь-яке рішення.</li><li><b>Колонки</b> це вертикалі: командир, напрям підтримки персоналу (його можна перейменувати пресетом), ВСП і юристи, ЦВС, медики і капелани, персонал, музика, зовнішні сили.</li><li>У клітинці стоять <b>посади</b> (прямокутники з кольоровою рискою) і <b>функції</b> (круглі позначки). Функція стоїть на <b>найнижчому рівні, куди доходить</b>; кольорова нитка від заголовка колонки до пігулки показує, що вертикаль тягнеться зверху.</li><li>Наведи на функцію: її нитка підсвітиться разом із рівнями, які вона проходить.</li><li>Червона пунктирна пігулка «не доходить»: функція потрібна на цьому рівні, а стоїть вище. Клік по ній опускає функцію сюди. «Немає» означає, що функції взагалі немає на дошці.</li></ol></div>
    <div class="card gold"><h2>2 · Обмеження</h2><ol><li><b>Функцію</b> можна перетягнути лише в дозволену вертикаль: розслідування до командира, ВСП чи напряму; соцсупровід до ЦВС чи напряму; музику до ВМУ чи напряму. Під час перетягування дозволені клітинки підсвічуються зеленим, решта гасне.</li><li><b>Посада</b> має фіксований рівень: ЗКР живе на роті, хорунжий бригади на бригаді. Змінити можна лише підпорядкування, і лише в межах дозволених вертикалей.</li><li>Функція без структури-виконавця на своєму рівні позначається <b>«без виконавця»</b> і рахується як функція без власника: намалювати «супровід до роти» без посади на роті не вийде. Командир і штаб виконують самі все, крім розслідувань і аналізу правопорушень: для них на рівні потрібна група з'ясування або ВСП, інакше пояснення далі збирає заступник.</li><li>Якщо на рівні немає посади напряму, час за призначенням там показує <b>«посади немає»</b>, і середнє рахується лише по рівнях, де посада є.</li></ol></div>
    <div class="card"><h2>3 · Ходи</h2><ul><li><b>Перетягни</b> блок між клітинками. <b>Клік на блок</b> відкриває меню: глибина, вертикаль, заміна на альтернативу (ЗКР на хорунжого роти), підсилення (мобільна група, діловод), зняти з дошки, свідчення.</li><li><b>Рейка зліва</b>: функції і посади, які ще не на дошці, і правила системи (пороги, анонімність, межа конфіденційності, зворотний зв'язок, школа, випробувальний термін).</li><li><b>Скинути</b> повертає до пресету, до чинної системи або дає порожню дошку. <kbd>Ctrl</kbd>+<kbd>Z</kbd> відкочує хід.</li><li><b>Посилання</b> кодує всю конфігурацію в адресу: її можна надіслати, і людина побачить ту саму дошку. <b>Зберегти</b> і <b>Відкрити</b> працюють через файл JSON.</li></ul></div>

    steps.push({ sel, k:head, t:title, p:text, fly:m.kind==="tg"?"rules":null, walk:{ i:n, total, si:si+1, sc:sc.short||sc.name, kind:m.kind, id:m.id, off:!!m.off, cell:wasCell, title, text:plainText(text) } }); }); });
  const PA=E.indexPrinciples(E.compute(E.fromBase(App.st.scenBase||E.baseOf(E.fromPreset(App.st.preset)), App.st.preset))), PB=E.indexPrinciples(App.res); const ch=D.PRINCIPLES.map(p=>[p.name,+(PB[p.id].value-PA[p.id].value).toFixed(0)]).filter(x=>Math.abs(x[1])>=1);
  const sumT=`${ids.length} сценар${ids.length===1?"ій":ids.length<5?"ії":"іїв"}, ${total} ход${total===1?"":total<5?"и":"ів"}`;
  steps.push({ sel:"#kpis", k:"підсумок", t:sumT, p:`${ch.length?"Індекси принципів: "+ch.map(([n,d])=>`<b>${esc(n)} ${d>0?"+":""}${d}</b>`).join(", ")+".":"Індекси принципів без змін: у цій моделі ці ходи вже були зроблені."} Клавіша 8 повертає на екран результату.`, fly:null, walk:{ summary:true, i:total, total, title:sumT, text:"Усі ходи сценаріїв на дошці; наслідки перераховано тими самими правилами." } });
  return steps;
}
function startWalk(){ const steps=walkSteps(); if(!steps.length) return; hideIntro(); if(App.view!=="board"){ App.view="board"; render(); } App.tour.steps=steps; App.tour.kind="walk"; App.tour.i=0; $("#tour").hidden=false; tourStep(); renderRail(); }
function tourStep(){
  const i=App.tour.i; const steps=App.tour.steps||TOUR; const s=steps[i]; if(!s){ endTour(); return; }
  if(App.view!=="board"){ App.view="board"; render(); }
  if(s.fly!==undefined){ const want=s.fly; if((App.fly||null)!==want){ App.fly=want; $("#main").classList.toggle("fly",!!App.fly); renderRail(); renderFlyout(); drawThreads(); drawEdges(); placeToken(false); } }
  if(App.tour.kind==="walk" && s.walk) dispWalk(s.walk);
  const el=$(s.sel); if(el&&el.scrollIntoView) el.scrollIntoView({block:"nearest"}); const spot=$("#tourSpot"), tip=$("#tourTip"); const pad=6;
  const r=el?el.getBoundingClientRect():{left:innerWidth/2-150,top:innerHeight/2-60,width:300,height:120};
  spot.style.left=(r.left-pad)+"px"; spot.style.top=(r.top-pad)+"px"; spot.style.width=(r.width+pad*2)+"px"; spot.style.height=(r.height+pad*2)+"px";
  tip.innerHTML=`<div class="k">${esc(s.k)}${steps===TOUR?` з ${TOUR.length}`:""}</div><h3>${esc(s.t)}</h3><p>${s.p}</p><div class="nav"><button class="btn ghost" data-t="x">закрити</button><span class="dots">${steps.map((x,j)=>`<i class="${j===i?"on":""}"></i>`).join("")}</span><span><button class="btn ghost" data-t="prev" ${i===0?"disabled":""}>назад</button> <button class="btn" data-t="next">${i===steps.length-1?"готово":"далі"}</button></span></div>`;
  const tw=tip.offsetWidth||340, th=tip.offsetHeight||180; let x=r.right+14, y=r.top; if(x+tw>innerWidth-10){ x=r.left-tw-14; } if(x<10){ x=Math.max(10,Math.min(innerWidth-tw-10,r.left)); y=r.bottom+14; } if(y+th>innerHeight-10) y=Math.max(10,innerHeight-th-10); tip.style.left=x+"px"; tip.style.top=y+"px";
  tip.querySelectorAll("[data-t]").forEach(b=>b.addEventListener("click",()=>{ const a=b.dataset.t; if(a==="x") endTour(); else if(a==="prev"){ App.tour.i--; tourStep(); } else { App.tour.i++; tourStep(); } }));
}

/* ---------- global bindings ---------- */
function bindGlobal(){
  document.addEventListener("click",e=>{
    const v=e.target.closest("[data-view]"); if(v){ App.view=v.dataset.view; render(); return; }
    const p=e.target.closest("[data-preset]"); if(p){ if(p.dataset.preset===App.st.preset&&!isDirty()) return; if(isDirty()&&App.labels.length&&!confirm("Скинути поточні зміни і завантажити пресет?")) return; setPreset(p.dataset.preset); return; }
    const rb=e.target.closest("[data-rb]"); if(rb){ railAct(rb.dataset.rb); return; }
    const k=e.target.closest("[data-kpi]"); if(k){ const id=k.dataset.kpi; if(id==="sim"){ App.ptab="sim"; } else { App.ptab="cons"; App.open.add(id); } renderPanel(); renderRail(); const card=$(`.ind[data-ind="${id}"]`); if(card) card.scrollIntoView({block:"start",behavior:reduced?"auto":"smooth"}); return; }
    const rs=e.target.closest("[data-reset]"); if(rs){ $("#resetDD").classList.remove("on"); doReset(rs.dataset.reset); return; }
    if(e.target.closest("#reset")){ $("#resetDD").classList.toggle("on"); return; }
    if(!e.target.closest("#resetDD")) $("#resetDD").classList.remove("on");
    if(!e.target.closest("#pop")&&!e.target.closest(".chip")) closePop();
  });
  $("#undo").addEventListener("click",undo); $("#redo").addEventListener("click",redo);
  $("#save").addEventListener("click",()=>{ const blob=new Blob([E.serialize(App.st)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`poligon_${App.st.preset}_${new Date().toISOString().slice(0,10)}.json`; a.click(); toast("Варіант збережено у файл"); });
  $("#loadFile").addEventListener("change",e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const st=E.deserialize(rd.result); App.history=[]; App.future=[]; App.labels=["завантажено з файлу"]; stopSim(true); load(st, PRESETS.some(p=>p.id===st.preset)?st.preset:"now"); render(); toast("Варіант відкрито з файлу"); syncHash(); }catch(err){ toast("Файл не читається", true); } }; rd.readAsText(f); e.target.value=""; });
  $("#load").addEventListener("click",()=>$("#loadFile").click());
  $("#link").addEventListener("click",()=>{ const url=location.origin+location.pathname+E.toHash(App.st); (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast("Посилання на варіант скопійовано"),()=>{ prompt("Скопіюй посилання:",url); }); });
  $("#drawer .x").addEventListener("click",closeDrawer); $("#scrim").addEventListener("click",closeDrawer);
  document.addEventListener("keydown",e=>{
    if(e.target.matches("input,select,textarea")){ if(e.key==="Escape"){ e.target.blur(); closePop(); closeDrawer(); } return; }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); return; }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){ e.preventDefault(); redo(); return; }
    if(e.key==="Escape"){ if(App.tour.i>=0){ endTour(); return; } closePop(); closeDrawer(); $("#resetDD").classList.remove("on"); if($("#pop").classList.contains("on")||$("#drawer").classList.contains("on")) return; if(App.fly){ App.fly=null; $("#main").classList.remove("fly"); renderRail(); renderFlyout(); setTimeout(()=>{ drawThreads(); drawEdges(); },220); return; } if(App.lens){ App.lens=null; render(); } return; }
    if(App.tour.i>=0&&(e.key==="ArrowRight"||e.key==="Enter")){ App.tour.i++; tourStep(); return; }
    if(App.tour.i>=0&&e.key==="ArrowLeft"){ App.tour.i=Math.max(0,App.tour.i-1); tourStep(); return; }
    if(/^[1-9]$/.test(e.key)&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ const v=VIEWS[+e.key-1]; if(!v) return; App.view=v[0]; render(); }
    if((e.key==="n"||e.key==="N"||e.key==="т"||e.key==="Т")&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ if($("#drawer").classList.contains("on")) closeDrawer(); else openJournal(); }
  });
  let rT=null; window.addEventListener("resize",()=>{ closePop(); clearTimeout(rT); rT=setTimeout(()=>{ drawThreads(); drawEdges(); placeToken(false); if(App.tour.i>=0) tourStep(); },120); });
}
function hideIntro(){ if(App.introOff) return; App.introOff=true; store.set("poligon_intro","1"); }
function railAct(id){
  if(id==="funcs"||id==="structs"||id==="rules"){ App.fly=App.fly===id?null:id; $("#main").classList.toggle("fly",!!App.fly); renderRail(); renderFlyout(); setTimeout(()=>{ drawThreads(); drawEdges(); placeToken(false); },220); return; }
  if(id==="edges"){ App.edges=!App.edges; if(App.edges) App.ptab="cons"; hideIntro(); render(); toast(App.edges?"Зв'язки увімкнено: типи вмикаються в легенді під дошкою, пояснення у панелі":"Зв'язки вимкнено"); return; }
  if(id==="lens"){ if(App.lens){ App.lens=null; render(); return; } App.ptab="lens"; App.lens="gs"; hideIntro(); render(); return; }
  if(id==="sim"){ App.ptab="sim"; hideIntro(); render(); return; }
  if(id==="tour"){ if(App.tour.i>=0) endTour(); else startTour(); }
  if(id==="show"){ dispOpen(); }
  if(id==="log"){ openJournal(); }
}
/* ===== журнал краштесту: «тут неправда» з прив'язкою до стану дошки, без прізвищ (лише роль) ===== */
function journalSave(){ store.set("poligon_journal", JSON.stringify(App.journal)); }
function journalContext(){ const v=VIEWS.find(x=>x[0]===App.view); return { view:v?v[2]:App.view, preset:curPreset().name, moves:App.labels.length, url:location.origin+location.pathname+(isDirty()?E.toHash(App.st):"#p="+App.st.preset), version:META.version, build:META.build }; }
function journalMd(){ const head=`# Полігон · журнал краштесту\n\nv${META.version} · збірка ${META.build} · експорт ${new Date().toLocaleString("uk-UA")} · записів: ${App.journal.length}\nРолі за ванпейджером «Хто має зламати модель»; без прізвищ.\n\n`;
  return head+App.journal.map((j,i)=>{ const r=D.ROLES.find(x=>x.id===j.role); return `## ${i+1}. Роль ${j.role}${r?" · "+r.name:""} · ${j.ctx.view} · ${j.ctx.preset}${j.ctx.moves?` (+${j.ctx.moves} ходів)`:""}\n${new Date(j.ts).toLocaleString("uk-UA")}\n\n${j.text}\n\nСтан: ${j.ctx.url}\n`; }).join("\n"); }
function openJournal(){
  const ctx=journalContext();
  const list=App.journal.length?[...App.journal].reverse().map((j,k)=>{ const i=App.journal.length-1-k; const r=D.ROLES.find(x=>x.id===j.role); return `<div class="jrec"><div class="jh"><b>${i+1}</b> · роль ${esc(j.role)}${r?" · "+esc(r.name):""} · ${esc(j.ctx.view)} · ${esc(j.ctx.preset)}${j.ctx.moves?` (+${j.ctx.moves})`:""} · <span class="dim mono">${esc(new Date(j.ts).toLocaleString("uk-UA"))}</span><button class="jx" data-jdel="${i}" title="видалити">×</button></div><div class="jt">${esc(j.text)}</div><div class="jl"><a href="${esc(j.ctx.url)}" target="_blank" rel="noopener">відкрити стан</a></div></div>`; }).join(""):`<p class="dim">Записів ще немає.</p>`;
  openDrawer("Краштест: тут неправда", `<p class="lead" style="font-size:12.5px;margin-bottom:10px">Кожне зауваження прив'язується до поточного екрана і стану дошки (посилання). Правка входить у модель лише з паспортом: хто сказав (роль), коли, на підставі чого. Прізвища не пишемо.</p>
  <div class="jform"><label>Роль<select id="jrole">${D.ROLES.map(r=>`<option value="${r.id}" ${App.jrole===r.id?"selected":""}>${r.id} · ${esc(r.name)}</option>`).join("")}</select></label>
  <div class="jctx dim mono">зараз: ${esc(ctx.view)} · ${esc(ctx.preset)}${ctx.moves?` · +${ctx.moves} ходів`:""}</div>
  <textarea id="jtext" rows="4" placeholder="Що саме неправда або спрощено, і на підставі чого (документ, практика, число)"></textarea>
  <div class="jbtns"><button class="tool primary" id="jadd">Записати</button><button class="tool" id="jexp" ${App.journal.length?"":"disabled"}>Експорт .md</button><button class="tool" id="jcopy" ${App.journal.length?"":"disabled"}>Скопіювати JSON</button><button class="tool" id="jclear" ${App.journal.length?"":"disabled"}>Очистити</button></div></div>
  <div class="h3">Записи (${App.journal.length})</div>${list}`);
  const ta=$("#jtext"); setTimeout(()=>ta&&ta.focus(),50);
  $("#jrole").addEventListener("change",e=>{ App.jrole=e.target.value; store.set("poligon_jrole",App.jrole); });
  $("#jadd").addEventListener("click",()=>{ const text=(ta.value||"").trim(); if(!text){ toast("Порожній запис", true); return; } App.journal.push({ ts:Date.now(), role:App.jrole, text, ctx:journalContext() }); journalSave(); renderRail(); openJournal(); toast(`Записано (${App.journal.length})`); });
  ta.addEventListener("keydown",e=>{ if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){ e.preventDefault(); $("#jadd").click(); } });
  $("#jexp").addEventListener("click",()=>{ const blob=new Blob([journalMd()],{type:"text/markdown"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`poligon_krashtest_${new Date().toISOString().slice(0,10)}.md`; a.click(); toast("Журнал збережено у файл"); });
  $("#jcopy").addEventListener("click",()=>{ const txt=JSON.stringify({version:META.version,build:META.build,entries:App.journal},null,1); (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("JSON скопійовано"),()=>toast("Буфер недоступний, скористайся експортом", true)); });
  $("#jclear").addEventListener("click",()=>{ if(!confirm(`Стерти всі ${App.journal.length} записів журналу?`)) return; App.journal=[]; journalSave(); renderRail(); openJournal(); });
  $$("#drawer [data-jdel]").forEach(b=>b.addEventListener("click",()=>{ App.journal.splice(+b.dataset.jdel,1); journalSave(); renderRail(); openJournal(); }));
}
function doReset(mode){
  if(mode==="preset"){ if(!isDirty()){ toast("Дошка вже збігається з пресетом"); return; } stopSim(false); apply("Скинуто до пресету", st=>{ const b=E.fromPreset(App.st.preset); Object.assign(st,b); }); }
  else if(mode==="empty"){ stopSim(false); apply("Порожня дошка: усі блоки і правила знято", st=>{ Object.keys(st.funcs).forEach(k=>st.funcs[k]=null); st.structs={}; Object.keys(st.toggles).forEach(k=>st.toggles[k]=false); st.scen=[]; st.scenBase=null; }); App.fly="structs"; renderRail(); renderFlyout(); }

}

/* ---------- init ---------- */
(function init(){
  if(window.__DISPLAY) return;
  addEventListener("message", e=>{ const m=e.data; if(!m||m.poligon!==1||m.type!=="hello") return; if(e.source){ App.disp=e.source; } dispSend("init", null, App.labels.length?App.labels[App.labels.length-1]:""); renderRail(); });

  else load(E.fromPreset(pm&&PRESETS.some(p=>p.id===pm[1])?pm[1]:"now"));
  bindGlobal(); render();
  window.__POLIGON={ App, apply, dropBlock, render, setPreset, undo, redo, toast, runSim, railAct, doReset, startTour, endTour, tourStep, drawEdges, applyLens, stopSim, toggleScenario, startWalk, dispOpen, dispSend, dispFocus, dispWalk, openJournal, journalMd };
})();
})(window.POLIGON, window.ENGINE, window.SIM);
