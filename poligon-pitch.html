<style>
:root{
  color-scheme:dark; box-sizing:border-box;
  --bg:#0b0e11; --s1:#11151a; --s2:#171c22; --s3:#1e242b; --s4:#262d35;
  --line:rgba(255,255,255,.055); --line-2:rgba(255,255,255,.10); --line-3:rgba(255,255,255,.18);
  --ink:#f1efe8; --ink-2:#b9bfc5; --ink-3:#7f8992; --ink-4:#565e66;
  --gold:#f5c451; --gold-2:#ffd978; --blue:#7fb0e6; --purple:#b48ee0; --red:#ef6248; --green:#4fd18b; --teal:#7fd6d0; --sand:#d8b48a;
  --disp:"Oswald","Arial Narrow",Arial,sans-serif; --mono:"IBM Plex Mono","Courier New",monospace; --sans:"IBM Plex Sans",Arial,sans-serif;
  --r:6px; --shadow:0 16px 40px rgba(0,0,0,.6);
}
*,*::before,*::after{ box-sizing:inherit; }
html,body{ margin:0; height:100%; }
body{ background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:13px; line-height:1.42; -webkit-font-smoothing:antialiased; overflow:hidden;
  background-image:radial-gradient(1400px 700px at 60% -20%, rgba(127,176,230,.09), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(245,196,81,.07), transparent 60%); }
button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
button:focus-visible,[tabindex]:focus-visible,select:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
h1,h2,h3{ margin:0; text-wrap:balance; }
::-webkit-scrollbar{ width:8px; height:8px; } ::-webkit-scrollbar-thumb{ background:var(--line-2); border-radius:6px; } ::-webkit-scrollbar-track{ background:transparent; }
.cap{ font-family:var(--mono); text-transform:uppercase; letter-spacing:.12em; font-size:9.5px; color:var(--ink-3); }
.mono{ font-family:var(--mono); }
.num{ font-family:var(--disp); font-weight:600; font-variant-numeric:tabular-nums; }
.gold{ color:var(--gold); } .red{ color:var(--red); } .green{ color:var(--green); } .blue{ color:var(--blue); } .dim{ color:var(--ink-3); }
kbd{ font-family:var(--mono); font-size:10px; border:1px solid var(--line-3); border-bottom-width:2px; border-radius:3px; padding:0 5px; background:var(--s3); color:var(--ink-2); }

/* ================= shell ================= */
.app{ height:100%; display:grid; grid-template-rows:auto auto minmax(0,1fr) auto; gap:8px; padding:8px 14px 4px; }
.head{ display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center; padding-bottom:6px; border-bottom:1px solid var(--line-2); }
.brand{ display:flex; gap:10px; align-items:center; }
.brand .logo{ width:26px; height:26px; flex:none; filter:drop-shadow(0 0 8px rgba(245,196,81,.35)); }
.brand h1{ font-family:var(--disp); font-weight:700; font-size:22px; line-height:1; letter-spacing:.14em; text-transform:uppercase; }
.brand .sub{ margin-top:2px; font-family:var(--mono); text-transform:uppercase; letter-spacing:.1em; font-size:9px; color:var(--ink-2); white-space:nowrap; }
.brand .sub b{ color:var(--gold); font-weight:500; }
.views{ display:flex; justify-content:center; gap:2px; flex-wrap:wrap; }
.view{ position:relative; display:flex; align-items:center; gap:7px; padding:7px 11px 7px 9px; border-radius:var(--r); color:var(--ink-3); transition:color .15s,background .15s; white-space:nowrap; }
.view:hover{ color:var(--ink); background:var(--s2); }
.view[aria-pressed="true"]{ color:var(--ink); background:var(--s3); }
.view .k{ font-family:var(--mono); font-size:9.5px; color:var(--ink-4); }
.view[aria-pressed="true"] .k{ color:var(--gold); }
.view .t{ font-family:var(--disp); font-size:13.5px; letter-spacing:.06em; text-transform:uppercase; line-height:1; }
.view::after{ content:""; position:absolute; left:10px; right:10px; bottom:0; height:2px; background:var(--gold); border-radius:2px; transform:scaleX(0); transition:transform .18s; }
.view[aria-pressed="true"]::after{ transform:scaleX(1); }
.meta{ text-align:right; font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); line-height:1.5; white-space:nowrap; }
.meta b{ color:var(--ink-2); font-weight:500; }

/* ================= hero ================= */
.hero{ display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:16px; align-items:center; padding:8px 12px; border-radius:var(--r); background:var(--s1); border:1px solid var(--line); }
.hero-l{ min-width:0; display:flex; flex-direction:column; gap:5px; }
.presets{ display:flex; gap:4px; flex-wrap:wrap; }
.preset{ padding:4px 9px 4px 8px; }
.preset{ display:flex; align-items:center; gap:7px; padding:5px 10px 5px 9px; border-radius:999px; background:var(--s2); color:var(--ink-2); font-size:11.5px; transition:all .15s; white-space:nowrap; border:1px solid transparent; }
.preset .dot{ width:8px; height:8px; border-radius:50%; background:var(--c,var(--ink-3)); }
.preset:hover{ color:var(--ink); background:var(--s3); }
.preset[aria-pressed="true"]{ color:var(--ink); background:var(--s3); border-color:var(--c,var(--gold)); box-shadow:0 0 14px color-mix(in srgb, var(--c,var(--gold)) 25%, transparent); }
.preset[aria-pressed="true"].dirty .dot{ box-shadow:0 0 0 2px var(--bg), 0 0 0 3.5px var(--gold); }
.preset[aria-pressed="true"].dirty::after{ content:"·"; color:var(--gold); font-weight:700; margin-left:-2px; }
.thesis{ font-size:11.5px; color:var(--ink-2); line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.thesis b{ color:var(--ink); font-weight:600; }
.kpis{ display:flex; gap:6px; }
.kpi{ min-width:112px; padding:6px 12px 7px 11px; border-radius:var(--r); background:var(--s2); border:1px solid var(--line); display:flex; flex-direction:column; gap:2px; cursor:pointer; transition:border-color .15s, transform .12s, background .15s; position:relative; overflow:hidden; }
.kpi::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--c,var(--gold)); }
.kpi:hover{ transform:translateY(-1px); background:var(--s3); border-color:var(--line-2); }
.kpi .l{ font-family:var(--mono); font-size:8.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap; }
.kpi .v{ font-family:var(--disp); font-size:24px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums; }
.kpi .v small{ font-size:11px; color:var(--ink-3); font-weight:500; margin-left:1px; }
.kpi .d{ font-family:var(--mono); font-size:9px; color:var(--ink-4); white-space:nowrap; }
.kpi .d.up{ color:var(--green); } .kpi .d.down{ color:var(--red); }
.kpi.changed{ animation:flash .9s ease-out; }
.tools{ display:flex; gap:4px; align-items:center; }
.tool{ display:inline-flex; align-items:center; gap:6px; padding:7px 10px; border:1px solid var(--line-2); border-radius:var(--r); background:var(--s2); color:var(--ink-2); font-size:11.5px; transition:all .15s; white-space:nowrap; }
.tool:hover:not(:disabled){ border-color:var(--gold); color:var(--ink); }
.tool:disabled{ opacity:.35; cursor:default; }
.tool .ico{ font-family:var(--mono); font-size:12px; color:var(--gold); }
.tool.primary{ border-color:var(--gold); color:var(--gold); }
.tool.warn{ border-color:rgba(239,98,72,.55); } .tool.warn .ico{ color:var(--red); }
.tool .car{ font-size:9px; color:var(--ink-3); margin-left:-2px; }
.dd{ position:relative; }
.dd-menu{ position:absolute; top:calc(100% + 6px); right:0; min-width:250px; background:var(--s2); border:1px solid var(--line-2); border-top:2px solid var(--red); border-radius:var(--r); box-shadow:var(--shadow); padding:6px; display:none; z-index:35; }
.dd.on .dd-menu{ display:block; animation:in .15s ease-out; }
.dd-menu button{ display:block; width:100%; text-align:left; padding:7px 9px; border-radius:4px; }
.dd-menu button:hover{ background:var(--s3); }
.dd-menu button b{ display:block; font-size:12.5px; color:var(--ink); }
.dd-menu button small{ display:block; font-size:10.5px; color:var(--ink-3); line-height:1.35; margin-top:1px; }

/* ================= main ================= */
.main{ display:grid; grid-template-columns:46px auto minmax(0,1fr) 372px; gap:8px; min-height:0; }
.main.wide{ grid-template-columns:minmax(0,1fr) 372px; }
.main.full{ grid-template-columns:minmax(0,1fr); }
.main.fly{ grid-template-columns:46px auto minmax(0,1fr) 336px; }
.main.wide .rail,.main.wide .flyout,.main.full .rail,.main.full .flyout,.main.full .panel{ display:none; }
.rail{ display:flex; flex-direction:column; gap:4px; padding:2px 0; }
.rail .rb{ width:46px; height:48px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; border-radius:var(--r); background:var(--s1); border:1px solid var(--line); color:var(--ink-3); transition:all .15s; position:relative; }
.rail .rb .i{ font-family:var(--mono); font-size:15px; line-height:1; color:var(--ink-2); }
.rail .rb .l{ font-family:var(--mono); font-size:7.5px; letter-spacing:.04em; text-transform:uppercase; line-height:1; }
.rail .rb:hover{ color:var(--ink); background:var(--s3); }
.rail .rb[aria-pressed="true"]{ color:var(--gold); background:var(--s3); border-color:rgba(245,196,81,.4); box-shadow:inset 3px 0 0 var(--gold); }
.rail .rb[aria-pressed="true"] .i{ color:var(--gold); }
.rail .rb .n{ position:absolute; top:3px; right:5px; font-family:var(--mono); font-size:8.5px; color:var(--red); }
.rail .sep{ height:1px; background:var(--line-2); margin:3px 8px; }
.flyout{ width:0; overflow:hidden; border:0; }
.flyout.on{ width:236px; border:1px solid var(--line); border-radius:var(--r); background:var(--s1); overflow:auto; min-height:0; animation:in .18s ease-out; }
.flyout .fh{ display:flex; justify-content:space-between; align-items:center; padding:9px 12px; border-bottom:1px solid var(--line-2); position:sticky; top:0; background:var(--s1); z-index:2; }
.flyout .fh .t{ font-family:var(--disp); font-size:14px; letter-spacing:.06em; text-transform:uppercase; }
.flyout .fh .x{ font-family:var(--mono); font-size:10px; color:var(--ink-3); border:1px solid var(--line-2); padding:2px 7px; border-radius:4px; }
.flyout .fh .x:hover{ color:var(--ink); border-color:var(--gold); }
.flyout section{ padding:8px 12px 12px; }
.pal-group{ margin:10px 0 5px; }
.pal-list{ display:flex; flex-direction:column; gap:4px; }
.pal-note{ font-size:11px; color:var(--ink-3); line-height:1.4; margin:8px 0 0; }
.panel{ border:1px solid var(--line); border-radius:var(--r); background:var(--s1); min-height:0; min-width:0; overflow:auto; display:flex; flex-direction:column; }
.panel > section{ padding:10px 14px; border-bottom:1px solid var(--line); }
.panel > section:last-child{ border-bottom:0; }
.ptabs{ display:flex; border-bottom:1px solid var(--line-2); position:sticky; top:0; background:var(--s1); z-index:2; }
.ptabs button{ flex:1; padding:9px 4px 8px; font-family:var(--disp); font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); border-bottom:2px solid transparent; transition:all .15s; display:flex; align-items:center; justify-content:center; gap:6px; }
.ptabs button:hover{ color:var(--ink); }
.ptabs button[aria-pressed="true"]{ color:var(--gold); border-bottom-color:var(--gold); }
.ptabs button .b{ font-family:var(--mono); font-size:9px; color:var(--red); border:1px solid var(--red); border-radius:8px; padding:0 5px; }
.pbody{ flex:1; min-height:0; }
.ph{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:6px; }
.ph .t{ font-family:var(--disp); font-size:14px; letter-spacing:.06em; text-transform:uppercase; font-weight:600; }
.stage{ position:relative; border:1px solid var(--line); border-radius:var(--r); background:var(--s1); min-width:0; min-height:0; overflow:hidden; display:flex; flex-direction:column; }
.stage.pad{ padding:16px 18px; overflow:auto; }
.fade{ animation:in .28s ease-out; }
@keyframes in{ from{ opacity:0; transform:translateY(6px) } to{ opacity:1; transform:none } }

/* ================= chips ================= */
.chip{ position:relative; display:inline-flex; align-items:center; gap:6px; padding:3px 9px 3px 8px; border-radius:4px; background:var(--s3); border:1px solid var(--line-2); font-size:11px; line-height:1.3; cursor:grab; user-select:none; transition:border-color .15s, transform .12s, box-shadow .15s, opacity .2s, background .15s; max-width:100%; }
.chip:hover{ border-color:var(--line-3); transform:translateY(-1px); box-shadow:0 8px 18px rgba(0,0,0,.45); z-index:2; }
.chip:active{ cursor:grabbing; }
.chip.dragging{ opacity:.35; }
.chip .sw{ width:8px; height:8px; border-radius:50%; flex:none; background:var(--c,var(--ink-3)); box-shadow:0 0 8px color-mix(in srgb, var(--c,var(--ink-3)) 70%, transparent); }
.chip.fn{ border-radius:999px; background:color-mix(in srgb, var(--c,var(--ink-3)) 11%, var(--s2)); border-color:color-mix(in srgb, var(--c,var(--ink-3)) 32%, transparent); }
.chip.fn:hover{ border-color:var(--c); }
.chip.st{ border-left:3px solid var(--c,var(--ink-3)); background:var(--s4); border-radius:4px; }
.chip.st .sw{ display:none; }
.chip.st .n{ font-weight:600; }
.chip .n{ font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.chip .d{ font-family:var(--mono); font-size:8.5px; color:var(--ink-3); letter-spacing:.03em; white-space:nowrap; }
.chip.onboard{ opacity:.35; cursor:default; }
.chip.onboard:hover{ transform:none; box-shadow:none; }
.chip.sel{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset, 0 0 18px rgba(245,196,81,.25); }
.chip.gapchip{ border-color:rgba(239,98,72,.75); }
.chip.gapchip.noexec{ border-style:dashed; }
.chip .badge{ font-family:var(--mono); font-size:8px; padding:0 4px; border-radius:2px; border:1px solid; letter-spacing:.05em; text-transform:uppercase; line-height:1.5; }
.badge.red{ color:var(--red); border-color:var(--red); } .badge.gold{ color:var(--gold); border-color:var(--gold); } .badge.dim{ color:var(--ink-3); border-color:var(--line-2); } .badge.green{ color:var(--green); border-color:var(--green); } .badge.blue{ color:var(--blue); border-color:var(--blue); }
.flyout .chip{ display:flex; padding:5px 9px 5px 8px; font-size:11.5px; }
.flyout .chip .n{ flex:1; white-space:normal; }
.ghost{ display:inline-flex; align-items:center; gap:5px; padding:2px 8px 2px 7px; border-radius:999px; border:1px dashed rgba(239,98,72,.7); color:var(--red); background:rgba(239,98,72,.05); font-size:10.5px; line-height:1.3; cursor:pointer; transition:all .15s; white-space:nowrap; max-width:100%; overflow:hidden; }
.ghost i{ width:7px; height:7px; border-radius:50%; border:1.5px solid var(--c,var(--red)); }
.ghost small{ font-family:var(--mono); font-size:8px; letter-spacing:.05em; text-transform:uppercase; opacity:.8; }
.ghost.missing{ border-style:dotted; }
.ghost:hover{ background:rgba(239,98,72,.14); border-style:solid; }

/* toggles */
.tg{ display:grid; grid-template-columns:30px 1fr; gap:8px; align-items:start; padding:7px 0; border-bottom:1px solid var(--line); cursor:pointer; }
.tg:last-child{ border-bottom:0; }
.tg .sw{ width:30px; height:16px; border-radius:9px; background:var(--s4); border:1px solid var(--line-2); position:relative; transition:background .15s; margin-top:2px; }
.tg .sw::after{ content:""; position:absolute; left:2px; top:2px; width:10px; height:10px; border-radius:50%; background:var(--ink-3); transition:transform .15s, background .15s; }
.tg[aria-checked="true"] .sw{ background:rgba(245,196,81,.18); border-color:var(--gold); }
.tg[aria-checked="true"] .sw::after{ transform:translateX(14px); background:var(--gold); }
.tg .n{ font-size:11.5px; line-height:1.3; }
.tg .d{ font-size:10px; color:var(--ink-3); line-height:1.35; margin-top:2px; }

/* ================= board ================= */
.board-wrap{ flex:1; min-height:0; overflow:auto; padding:6px 12px 4px 8px; display:flex; flex-direction:column; }
.board{ display:grid; grid-template-columns:78px minmax(0,1fr) minmax(0,2.1fr) repeat(6, minmax(0,.78fr)); grid-template-rows:auto repeat(6, minmax(auto,1fr)) auto; gap:0; min-width:840px; position:relative; flex:1; min-height:0; }
.board .lh{ z-index:3; position:relative; padding:8px 10px 7px; border-bottom:2px solid var(--c,var(--line-2)); font-family:var(--disp); font-size:14px; letter-spacing:.06em; text-transform:uppercase; line-height:1.05; min-height:44px; display:flex; flex-direction:column; justify-content:flex-end; transition:opacity .25s; color:var(--ink); }
.board .lh.corner{ border-bottom-color:var(--line-2); }
.board .lh .ln{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; white-space:normal; }
.board .lh small{ display:block; font-family:var(--mono); font-size:8.5px; text-transform:none; letter-spacing:.03em; color:var(--ink-3); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.board .lh.ppp{ background:linear-gradient(180deg, transparent, rgba(127,176,230,.10)); }
.board .lh.cmd{ background:linear-gradient(180deg, transparent, rgba(245,196,81,.08)); }
.board .rh{ z-index:2; position:relative; min-height:58px; padding:8px 8px 8px 6px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; justify-content:flex-start; transition:opacity .25s; overflow:hidden; }
.board .rh::before{ content:""; position:absolute; left:0; top:10px; bottom:10px; width:2px; border-radius:2px; background:var(--line-2); }
.board .rh .t{ font-family:var(--disp); font-size:18px; letter-spacing:.06em; text-transform:uppercase; line-height:1; color:var(--ink); }
.board .rh .s{ font-family:var(--mono); font-size:8px; color:var(--ink-3); margin-top:5px; letter-spacing:.02em; line-height:1.3; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
.board .rh .s b{ display:block; color:var(--ink-2); font-weight:500; margin-bottom:2px; }
.board .rh.corps .t{ color:var(--ink-3); }
.cell{ position:relative; z-index:1; border-bottom:1px solid var(--line); border-right:1px solid var(--line); padding:8px 8px 8px 9px; display:flex; flex-wrap:wrap; align-content:flex-start; gap:3px 4px; transition:background .15s, box-shadow .15s, opacity .25s; overflow:visible; }
.cell.ext{ border-right:0; }
.cell.ppp{ background:rgba(127,176,230,.05); }
.cell.cmd{ background:rgba(245,196,81,.03); }
.cell.coy{ background:rgba(255,255,255,.015); }
.cell.coy.ppp{ background:rgba(127,176,230,.075); }
.cell.corps{ background-image:repeating-linear-gradient(135deg, rgba(255,255,255,.012) 0 6px, transparent 6px 14px); }
.cell .empty{ font-family:var(--mono); font-size:8.5px; color:var(--ink-4); letter-spacing:.06em; text-transform:uppercase; margin:auto; opacity:0; transition:opacity .15s; }
.cell:hover .empty{ opacity:1; }
.cell.rail-hi{ background:rgba(245,196,81,.05); }
/* threads */
svg.threads{ position:absolute; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; overflow:visible; }
svg.threads .th path{ fill:none; stroke-width:1.5; stroke-linecap:round; opacity:.42; transition:opacity .15s, stroke-width .15s; }
svg.threads .th circle{ opacity:.7; }
svg.threads .th path.gap{ stroke:var(--red); stroke-dasharray:3 4; opacity:.6; stroke-width:1.4; }
svg.threads .th.hi path.gap{ opacity:1; }
svg.threads .th.hi path{ opacity:1; stroke-width:2.6; filter:drop-shadow(0 0 4px var(--c)); }
/* drag validation */
.board.dragging .cell.can{ outline:1.5px dashed rgba(79,209,139,.85); outline-offset:-4px; background:rgba(79,209,139,.06); }
.board.dragging .cell.can .empty{ opacity:1; color:var(--green); }
.board.dragging .cell.cant{ opacity:.25; }
.board.dragging .cell.over.can{ background:rgba(79,209,139,.16); outline-style:solid; }
.board.dragging .cell.over.cant{ opacity:.7; outline:1.5px solid var(--red); outline-offset:-4px; cursor:not-allowed; }
.cell.shake{ animation:shake .4s ease-out; }
@keyframes shake{ 0%,100%{ transform:none } 20%{ transform:translateX(-4px) } 40%{ transform:translateX(4px) } 60%{ transform:translateX(-3px) } 80%{ transform:translateX(3px) } }
/* lens */
.board.lensed .cell.dimmed,.board.lensed .rh.dimmed,.board.lensed .lh.dimmed,.board.lensed .pltstrip.dimmed{ opacity:.3; filter:saturate(.25); }
.lensbar{ position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:9; display:flex; align-items:center; gap:12px; padding:7px 8px 7px 14px; border-radius:999px; background:var(--s2); border:1px solid var(--gold); box-shadow:var(--shadow), 0 0 24px rgba(245,196,81,.18); font-size:12px; white-space:nowrap; animation:in .2s ease-out; }
.lensbar[hidden]{ display:none; }
.lensbar .i{ font-family:var(--mono); color:var(--gold); font-size:14px; }
.lensbar b{ color:var(--gold); }
.lensbar button{ font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink); background:var(--s4); border-radius:999px; padding:5px 11px; }
.lensbar button:hover{ background:var(--gold); color:#111; }
/* sim highlight */
.cell.simhi{ background:color-mix(in srgb, var(--sc,var(--gold)) 12%, transparent); }
.rh.simhi::before{ background:var(--sc,var(--gold)); box-shadow:0 0 10px var(--sc,var(--gold)); }
.rh.simhi .t{ color:var(--sc,var(--gold)); }
.pltstrip.simhi{ box-shadow:inset 0 0 0 1px var(--sc,var(--gold)); background:color-mix(in srgb, var(--sc,var(--gold)) 10%, transparent); }
.simtoken{ position:absolute; z-index:7; width:22px; height:22px; border-radius:50%; background:var(--sc,var(--gold)); box-shadow:0 0 0 4px color-mix(in srgb, var(--sc,var(--gold)) 30%, transparent), 0 0 24px var(--sc,var(--gold)); transition:top .55s cubic-bezier(.3,.8,.3,1), left .55s, background .3s, box-shadow .3s, opacity .3s; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:11px; font-weight:600; color:#0a0d0c; pointer-events:none; opacity:0; }
.simtoken.on{ opacity:1; }
.simtoken.block{ animation:pulse 1s ease-out infinite; }
@keyframes pulse{ 0%{ box-shadow:0 0 0 4px rgba(239,98,72,.35), 0 0 24px var(--red) } 100%{ box-shadow:0 0 0 14px rgba(239,98,72,0), 0 0 24px var(--red) } }
/* edges */
svg.edges{ position:absolute; inset:0; width:100%; height:100%; z-index:4; pointer-events:none; overflow:visible; }
svg.edges .e{ fill:none; stroke-width:1.6; stroke-linecap:round; }
svg.edges .e.anim{ stroke-dasharray:6 5; animation:dash 1.2s linear infinite; }
svg.edges .e.dash{ stroke-dasharray:4 4; }
svg.edges .e.thick{ stroke-width:3; }

.board .chip{ cursor:grab; min-width:0; flex-wrap:wrap; padding:2px 8px 2px 7px; }

.board-note{ padding:3px 12px 5px; font-size:10.5px; color:var(--ink-3); display:flex; gap:12px; flex-wrap:wrap; align-items:center; border-top:1px solid var(--line); }

.board-note .lgk{ color:var(--ink-2); display:inline-flex; align-items:center; gap:6px; }

.legend-sw{ display:inline-block; width:9px; height:9px; border-radius:50%; vertical-align:-1px; margin-right:4px; }
.legend-st{ display:inline-block; width:16px; height:10px; border-radius:2px; background:var(--s4); border-left:3px solid var(--blue); }
.legend-fn{ display:inline-block; width:16px; height:10px; border-radius:999px; background:rgba(127,176,230,.15); border:1px solid rgba(127,176,230,.5); }
.legend-gh{ display:inline-block; width:16px; height:10px; border-radius:999px; border:1px dashed var(--red); }
.legend-ln{ display:inline-block; width:18px; height:0; border-top:2px solid var(--c); vertical-align:middle; }
.legend-ln.dash{ border-top-style:dashed; }
.enotes{ display:flex; flex-direction:column; gap:4px; width:100%; font-size:11.5px; color:var(--ink-2); line-height:1.4; }
.enotes-sec{ background:rgba(127,176,230,.05); }
.enotes span{ white-space:normal; display:inline-flex; gap:6px; align-items:baseline; }

.intro{ margin:8px 12px 0; border:1px solid rgba(245,196,81,.5); border-radius:var(--r); background:rgba(245,196,81,.05); padding:8px 14px; display:grid; grid-template-columns:auto 1fr auto auto; gap:14px; align-items:center; animation:in .3s ease-out; }

.intro ol{ margin:0; padding:0 0 0 16px; font-size:11.5px; line-height:1.4; color:var(--ink-2); display:grid; grid-template-columns:repeat(3,1fr); gap:2px 16px; }
.intro ol b{ color:var(--ink); font-weight:600; }
.intro .x{ font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); border:1px solid var(--line-2); padding:5px 9px; border-radius:4px; }
.intro .x:hover{ color:var(--ink); border-color:var(--gold); }
.intro .go{ border-color:var(--gold); color:var(--gold); }

/* ================= consequences ================= */
.move-sec{ background:rgba(245,196,81,.05); border-left:3px solid var(--gold); }
.move-sec .mv-l{ font-size:12.5px; font-weight:600; margin-bottom:4px; }
.items.mv li .v{ font-family:var(--mono); font-size:11px; font-weight:500; color:var(--ink-2); }
.items.mv li .v.good{ color:var(--green); } .items.mv li .v.bad{ color:var(--red); }
.ind{ padding:10px 14px; border-bottom:1px solid var(--line); animation:in .28s ease-out; }
.ind:last-child{ border-bottom:0; }
.ind .top{ display:grid; grid-template-columns:auto 1fr auto; gap:9px; align-items:center; cursor:pointer; }
.ind .k{ font-family:var(--mono); font-size:9.5px; color:var(--ink-4); width:14px; }
.ind .t{ font-family:var(--disp); font-size:13.5px; letter-spacing:.05em; text-transform:uppercase; font-weight:600; line-height:1.05; }
.ind .t small{ display:block; font-family:var(--sans); font-size:10px; color:var(--ink-3); letter-spacing:0; text-transform:none; font-weight:400; margin-top:2px; }
.ind .big{ text-align:right; font-family:var(--disp); font-size:24px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums; }
.ind .big small{ font-family:var(--mono); font-size:9px; font-weight:400; color:var(--ink-3); display:block; letter-spacing:.04em; margin-top:2px; }
.ind .delta{ font-family:var(--mono); font-size:9.5px; color:var(--gold); }
.ind .delta.none{ color:var(--ink-4); }
.ind .body{ margin-top:8px; display:none; }
.ind.open .body{ display:block; animation:in .2s ease-out; }
.ind .foot{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:8px; }
.ind .rules-link{ font-family:var(--mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--gold); border-bottom:1px dotted var(--gold); }
.ind .est, .coef .est{ font-family:var(--mono); font-size:8.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--sand); border:1px solid var(--sand); padding:1px 5px; border-radius:2px; }
.ind.changed .t{ color:var(--gold); }
.ind.changed{ animation:flash .9s ease-out; }
@keyframes flash{ 0%{ box-shadow:inset 0 0 0 1px var(--gold), inset 0 0 30px rgba(245,196,81,.18) } 100%{ box-shadow:none } }
.bars{ display:flex; flex-direction:column; gap:4px; }
.bar{ display:grid; grid-template-columns:1fr 56px; gap:8px; align-items:center; font-size:11.5px; padding:2px 6px; margin:0 -6px; border-radius:4px; transition:background .12s; }
.bar:hover{ background:var(--s3); }
.bar .lab{ color:var(--ink-2); display:flex; flex-direction:column; gap:3px; min-width:0; }
.bar .lab span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bar .tr{ height:6px; background:var(--s4); border-radius:3px; overflow:hidden; }
.bar .fl{ height:100%; background:var(--gold); border-radius:3px; transition:width .5s cubic-bezier(.2,.8,.2,1); }
.bar .fl.blue{ background:var(--blue); } .bar .fl.red{ background:var(--red); } .bar .fl.dim{ background:var(--ink-3); }
.bar .n{ font-family:var(--disp); font-size:14px; font-weight:600; text-align:right; font-variant-numeric:tabular-nums; }
.bar .n small{ font-family:var(--mono); font-size:8.5px; color:var(--ink-3); display:block; font-weight:400; }
.bar.na .lab{ color:var(--ink-4); } .bar.na .n{ color:var(--red); font-size:10px; font-family:var(--mono); font-weight:500; }
.items{ list-style:none; margin:6px 0 0; padding:0; display:flex; flex-direction:column; gap:2px; }
.items li{ font-size:11.5px; line-height:1.35; display:grid; grid-template-columns:1fr auto; gap:8px; padding:3px 6px; margin:0 -6px; border-radius:4px; }
.items li:hover{ background:var(--s3); }
.items li .v{ font-family:var(--disp); font-size:13.5px; font-weight:600; color:var(--ink); white-space:nowrap; }
.items li .s{ color:var(--ink-3); font-size:10.5px; }
.items li.clickable{ cursor:pointer; }
.tagline{ display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; }
.tag{ font-family:var(--mono); font-size:9px; letter-spacing:.05em; padding:2px 6px; border-radius:3px; border:1px solid var(--line-2); color:var(--ink-2); text-transform:uppercase; white-space:nowrap; }
.tag.red{ color:var(--red); border-color:var(--red); } .tag.gold{ color:var(--gold); border-color:var(--gold); } .tag.green{ color:var(--green); border-color:var(--green); } .tag.blue{ color:var(--blue); border-color:var(--blue); } .tag.sand{ color:var(--sand); border-color:var(--sand); }
.kv{ display:grid; grid-template-columns:auto 1fr; gap:4px 10px; font-size:11.5px; margin:6px 0 0; }
.kv dt{ color:var(--ink-3); font-family:var(--mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase; padding-top:3px; white-space:nowrap; }
.kv dd{ margin:0; line-height:1.4; }
.yesno{ display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10.5px; letter-spacing:.04em; }
.yesno i{ width:8px; height:8px; border-radius:50%; background:var(--ink-4); }
.yesno.on i{ background:var(--gold); box-shadow:0 0 8px var(--gold); }
.note{ font-size:11px; color:var(--ink-2); line-height:1.4; margin:6px 0 0; padding-left:9px; border-left:2px solid var(--line-2); }
.note.q{ border-left-color:var(--gold); }
.note.red{ border-left-color:var(--red); }

/* ================= simulation ================= */
.sim-intro{ font-size:11.5px; color:var(--ink-2); line-height:1.45; margin:0 0 8px; }
.decs{ display:flex; flex-direction:column; gap:4px; }
.dec{ display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; text-align:left; padding:7px 10px; border:1px solid var(--line); border-radius:var(--r); background:var(--s2); transition:all .15s; }
.dec:hover{ border-color:var(--line-3); background:var(--s3); }
.dec[aria-pressed="true"]{ border-color:var(--gold); box-shadow:inset 3px 0 0 var(--gold); }
.dec .n{ font-size:12px; font-weight:600; line-height:1.25; }
.dec .g{ font-family:var(--mono); font-size:8.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); margin-top:2px; }
.dec .vd{ display:flex; gap:3px; }
.dec .vd i{ width:7px; height:7px; border-radius:50%; background:var(--ink-4); }
.dec .vd i.ok{ background:var(--green); } .dec .vd i.warn{ background:var(--gold); } .dec .vd i.block{ background:var(--red); }
.simbar{ display:flex; gap:6px; align-items:center; margin:10px 0; flex-wrap:wrap; }
.btn{ display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:var(--r); border:1px solid var(--gold); background:linear-gradient(180deg, rgba(245,196,81,.22), rgba(245,196,81,.08)); color:var(--gold); font-family:var(--disp); font-size:14px; letter-spacing:.08em; text-transform:uppercase; transition:all .15s; }
.btn:hover:not(:disabled){ background:rgba(245,196,81,.3); color:var(--gold-2); transform:translateY(-1px); }
.btn:disabled{ opacity:.4; cursor:default; }
.btn.ghost{ background:none; border-color:var(--line-2); color:var(--ink-2); font-size:12px; padding:7px 10px; }
.btn.ghost:hover:not(:disabled){ border-color:var(--ink-3); background:var(--s3); }
.steps{ display:flex; flex-direction:column; gap:5px; margin-top:6px; }
.step{ display:grid; grid-template-columns:4px 1fr; gap:0 10px; border:1px solid var(--line); border-radius:var(--r); background:var(--s2); overflow:hidden; animation:stepin .35s ease-out; }
.step .bar-l{ background:var(--sc,var(--ink-3)); }
.step .in{ padding:7px 10px 8px 0; }
.step .lv{ display:flex; justify-content:space-between; gap:8px; font-family:var(--mono); font-size:8.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); }
.step .lv b{ color:var(--sc,var(--ink-2)); font-weight:500; }
.step .t{ font-size:12.5px; font-weight:600; margin:3px 0 2px; line-height:1.3; }
.step .d{ font-size:11.5px; color:var(--ink-2); line-height:1.4; }
.step .fx{ margin-top:5px; font-size:11px; color:var(--gold); padding-left:8px; border-left:2px solid var(--gold); line-height:1.35; }
.step .evs{ margin-top:5px; display:flex; gap:4px; flex-wrap:wrap; }
.step .evs button{ font-family:var(--mono); font-size:8.5px; letter-spacing:.05em; color:var(--blue); border:1px solid rgba(127,176,230,.4); border-radius:3px; padding:1px 5px; }
.step .evs button:hover{ background:rgba(127,176,230,.12); }
@keyframes stepin{ from{ opacity:0; transform:translateX(12px) } to{ opacity:1; transform:none } }
.verdict{ margin-top:8px; padding:9px 12px; border-radius:var(--r); border:1px solid var(--sc,var(--line-2)); background:color-mix(in srgb, var(--sc,var(--gold)) 10%, transparent); animation:in .3s ease-out; }
.verdict .cap{ color:var(--sc,var(--ink-3)); }
.verdict .t{ font-family:var(--disp); font-size:15px; letter-spacing:.03em; margin-top:3px; line-height:1.25; }
.verdict .m{ margin-top:6px; display:flex; gap:8px; }
.verdict .m span{ font-family:var(--mono); font-size:9.5px; letter-spacing:.04em; }
.fixes{ margin:8px 0 0; padding:0 0 0 16px; font-size:11.5px; line-height:1.45; color:var(--ink-2); }
.fixes li::marker{ color:var(--gold); }

/* ================= lens (optics) ================= */
.personas{ display:grid; grid-template-columns:1fr 1fr; gap:5px; }
.persona{ text-align:left; padding:8px 10px; border:1px solid var(--line); border-radius:var(--r); background:var(--s2); display:flex; gap:9px; align-items:center; transition:all .15s; }
.persona:hover{ border-color:var(--line-3); background:var(--s3); }
.persona[aria-pressed="true"]{ border-color:var(--gold); box-shadow:inset 0 0 0 1px var(--gold); }
.persona .i{ font-family:var(--mono); font-size:16px; color:var(--gold); width:20px; text-align:center; }
.persona .n{ font-size:12px; font-weight:600; line-height:1.2; }
.persona .s{ font-family:var(--mono); font-size:8.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.06em; margin-top:1px; }
.lens-body{ margin-top:8px; animation:in .25s ease-out; }
.lens-body .q{ font-size:13px; line-height:1.45; color:var(--ink); border-left:2px solid var(--gold); padding-left:9px; margin:0 0 8px; }
.lens-body .h3{ margin:10px 0 4px; }
.lens-body .big3{ display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin:8px 0; }
.lens-body .big3 div{ border:1px solid var(--line); border-radius:var(--r); padding:6px 8px; background:var(--s2); }
.lens-body .big3 .v{ font-family:var(--disp); font-size:20px; font-weight:600; line-height:1; }
.lens-body .big3 .l{ font-family:var(--mono); font-size:8.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); margin-top:3px; line-height:1.3; }
.lens-body ul{ margin:4px 0 0 16px; padding:0; font-size:11.5px; line-height:1.45; color:var(--ink-2); }
.lens-body ul li b{ color:var(--ink); }

/* ================= drawer / popover / toast ================= */
.drawer{ position:fixed; top:0; right:0; bottom:0; width:520px; max-width:92vw; background:var(--s1); border-left:1px solid var(--line-2); box-shadow:var(--shadow); z-index:50; transform:translateX(102%); transition:transform .22s ease-out; display:flex; flex-direction:column; }
.drawer.on{ transform:none; }
.drawer .dh{ display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line-2); gap:12px; }
.drawer .dh .t{ font-family:var(--disp); font-size:18px; letter-spacing:.04em; text-transform:uppercase; line-height:1.1; }
.drawer .dh .x{ font-family:var(--mono); color:var(--ink-3); padding:4px 8px; border:1px solid var(--line-2); border-radius:4px; }
.drawer .dh .x:hover{ color:var(--ink); border-color:var(--gold); }
.drawer .db{ padding:12px 16px; overflow:auto; flex:1; }
.scrim{ position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40; opacity:0; pointer-events:none; transition:opacity .2s; }
.scrim.on{ opacity:1; pointer-events:auto; }
.rule{ border:1px solid var(--line); border-left:3px solid var(--gold); border-radius:var(--r); padding:9px 12px; margin-bottom:8px; background:var(--s2); }
.rule .id{ font-family:var(--mono); font-size:10px; letter-spacing:.08em; color:var(--gold); }
.rule .t{ font-weight:600; font-size:13px; margin:2px 0 3px; }
.rule .w{ font-size:12px; color:var(--ink-2); line-height:1.4; }
.evc{ border:1px solid var(--line); border-radius:var(--r); padding:9px 12px; margin-bottom:6px; background:var(--s2); display:grid; grid-template-columns:66px 1fr; gap:10px; }
.evc .n{ font-family:var(--disp); font-size:17px; font-weight:600; line-height:1.1; color:var(--ink); }
.evc .n small{ display:block; font-family:var(--mono); font-size:9px; color:var(--gold); font-weight:400; letter-spacing:.06em; margin-top:3px; }
.evc .txt{ font-size:12.5px; line-height:1.4; }
.evc .pass{ font-family:var(--mono); font-size:9.5px; color:var(--ink-3); letter-spacing:.03em; line-height:1.5; margin-top:4px; }
.evc.used{ border-left:3px solid var(--blue); }
.pop{ position:absolute; z-index:30; min-width:240px; max-width:320px; background:var(--s2); border:1px solid var(--line-2); border-top:2px solid var(--gold); border-radius:var(--r); box-shadow:var(--shadow); padding:8px; display:none; }
.pop.on{ display:block; animation:in .15s ease-out; }
.pop .t{ font-family:var(--disp); font-size:14px; text-transform:uppercase; letter-spacing:.03em; padding:2px 6px 6px; line-height:1.15; }
.pop .d{ font-size:11.5px; color:var(--ink-2); padding:0 6px 8px; line-height:1.4; border-bottom:1px solid var(--line); margin-bottom:6px; }
.pop button.mi{ display:block; width:100%; text-align:left; padding:5px 8px; border-radius:4px; font-size:12px; color:var(--ink-2); }
.pop button.mi:hover{ background:var(--s3); color:var(--ink); }
.pop button.mi b{ color:var(--gold); font-family:var(--mono); font-size:10px; margin-right:6px; }
.pop button.mi:disabled{ opacity:.35; cursor:not-allowed; }
.pop .sub{ font-family:var(--mono); font-size:8.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-4); padding:6px 8px 2px; }
.pop .row{ display:flex; flex-wrap:wrap; gap:3px; padding:2px 6px 4px; }
.pop .row button{ font-size:11px; padding:3px 8px; border:1px solid var(--line-2); border-radius:4px; color:var(--ink-2); }
.pop .row button:hover:not(:disabled){ border-color:var(--gold); color:var(--ink); }
.pop .row button:disabled{ opacity:.3; cursor:not-allowed; }
.pop .row button.cur{ border-color:var(--blue); color:var(--blue); }
.toast{ position:fixed; left:50%; bottom:22px; transform:translate(-50%,20px); background:var(--s3); border:1px solid var(--gold); border-radius:var(--r); padding:9px 14px; font-size:12.5px; line-height:1.4; box-shadow:var(--shadow); opacity:0; transition:all .2s; z-index:60; pointer-events:none; max-width:70vw; text-align:center; }
.toast.on{ opacity:1; transform:translate(-50%,0); }

.toast b{ color:var(--gold); font-weight:600; }
.toast.bad b{ color:var(--red); }

/* ================= tour ================= */
.tour{ position:fixed; inset:0; z-index:80; }
.tour[hidden]{ display:none; }
.tour .spot{ position:fixed; border:2px solid var(--gold); border-radius:8px; box-shadow:0 0 0 9999px rgba(3,5,6,.68), 0 0 30px rgba(245,196,81,.35); transition:all .35s cubic-bezier(.3,.8,.3,1); pointer-events:none; }
.tour .tip{ position:fixed; width:340px; max-width:92vw; background:var(--s2); border:1px solid var(--line-2); border-top:3px solid var(--gold); border-radius:var(--r); box-shadow:var(--shadow); padding:12px 14px; transition:all .35s cubic-bezier(.3,.8,.3,1); }
.tour .tip .k{ font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); }
.tour .tip h3{ font-family:var(--disp); font-size:17px; letter-spacing:.03em; text-transform:uppercase; margin:4px 0 6px; }
.tour .tip p{ margin:0; font-size:12.5px; line-height:1.45; color:var(--ink-2); }
.tour .tip p b{ color:var(--ink); }
.tour .tip .nav{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; gap:8px; }
.tour .tip .nav .dots{ display:flex; gap:4px; flex-wrap:wrap; max-width:120px; }
.tour .tip .nav .dots i{ width:6px; height:6px; border-radius:50%; background:var(--line-3); }
.tour .tip .nav .dots i.on{ background:var(--gold); }

/* ================= scheme ================= */
.scheme-top{ display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:8px; }
.scheme-top h2{ font-family:var(--disp); font-size:20px; text-transform:uppercase; letter-spacing:.03em; font-weight:600; }
.scheme-top h2 span{ color:var(--ink-3); font-weight:500; }
.legend{ display:flex; gap:12px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-2); align-items:center; }
.svgwrap{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
svg.scheme{ display:block; width:100%; height:auto; max-height:calc(100vh - 230px); font-family:var(--sans); }

/* ================= generic content ================= */

.mt.coef .n{ font-family:var(--mono); font-weight:600; white-space:nowrap; }
.mt.coef .evb{ margin:0 2px 2px 0; }

/* ---------- екран «Правила» (v0.9) ---------- */
.tabs{ display:flex; gap:6px; flex-wrap:wrap; }
.mt.rul td{ vertical-align:top; font-size:12px; }
.mt.rul tr.on td{ background:rgba(245,196,81,.05); }
.fired{ display:inline-block; margin-left:6px; font-family:var(--mono); font-size:8.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); border:1px solid var(--gold); border-radius:2px; padding:0 4px; vertical-align:middle; }
.fx{ display:inline-flex; align-items:baseline; gap:5px; margin:0 6px 4px 0; padding:2px 7px 2px 0; border-left:2px solid var(--c); padding-left:6px; font-size:11.5px; color:var(--ink-2); }
.fx i{ font-style:normal; font-family:var(--mono); font-size:8.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--c); }

.st.ok{ color:var(--green); border:1px solid rgba(79,209,139,.5); } .st.warn{ color:var(--gold); border:1px solid rgba(245,196,81,.5); } .st.block{ color:var(--red); border:1px solid rgba(239,98,72,.5); }
.bgrid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.bcard{ background:var(--s1); border:1px solid var(--line); border-radius:10px; padding:10px 12px 10px; }

.bcard .bh b{ font-family:var(--disp); font-size:14px; letter-spacing:.04em; text-transform:uppercase; }
.bcard .bh span{ font-size:10.5px; color:var(--ink-3); } .bcard .bh em{ font-style:normal; color:var(--gold); font-weight:600; }

/* ===== режим «Показ»: сцена 1920×1080 для другого екрана ===== */
body.display-mode{ overflow:hidden; background:#07090c; }
body.display-mode #app{ display:none; }
#dwrap{ position:fixed; inset:0; background:radial-gradient(1200px 700px at 30% 0%, rgba(245,196,81,.06), transparent 60%), #07090c; }
.dstage{ position:absolute; left:50%; top:50%; width:1920px; height:1080px; transform:translate(-50%,-50%); transform-origin:center; display:grid; grid-template-rows:88px minmax(0,1fr) 124px; gap:20px; padding:40px 48px 36px; box-sizing:border-box; color:var(--ink); font-family:var(--sans); }
.dstage::before{ content:""; position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px); background-size:96px 96px; pointer-events:none; mask-image:linear-gradient(180deg, rgba(0,0,0,.5), transparent 70%); }

/* шапка */
.dhead{ display:grid; grid-template-columns:auto 1fr auto; gap:32px; align-items:center; border-bottom:1px solid var(--line-2); padding-bottom:16px; }
.dbrand{ display:flex; align-items:center; gap:14px; }
.dbrand svg{ width:44px; height:44px; }

.dtitle{ display:flex; align-items:baseline; gap:22px; justify-content:center; }
.dtitle .pn{ font-family:var(--disp); font-weight:600; font-size:34px; letter-spacing:.04em; text-transform:uppercase; color:var(--gold); }
.dtitle .mv{ font-family:var(--mono); font-size:15px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2); }
.dtitle .mv b{ color:var(--ink); font-weight:600; }
.dtitle .mv.dim{ color:var(--ink-4); }
.dmeta{ text-align:right; font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); line-height:1.7; }
.dmeta span{ display:block; }
.dmeta span:first-child{ color:var(--green); }

/* основна сітка */
.dmain{ display:grid; grid-template-columns:1080px minmax(0,1fr); gap:28px; min-height:0; }
.dleft{ display:grid; grid-template-rows:minmax(0,1fr); min-height:0; }
.dright{ display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto auto minmax(0,1fr); gap:16px; min-height:0; min-width:0; }
.dh{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:10px; }
.dh b{ font-family:var(--disp); font-weight:600; font-size:19px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); white-space:nowrap; }
.dh span{ font-family:var(--mono); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); display:flex; align-items:center; gap:8px; }
.dh em{ font-style:normal; color:var(--gold); font-size:15px; font-weight:600; }

/* силует дошки */
.dboard{ position:relative; display:grid; grid-template-columns:98px 96px 260px repeat(6,96px); grid-template-rows:56px repeat(6,minmax(92px,auto)); align-content:stretch; gap:3px; height:100%; background:var(--s1); border:1px solid var(--line); border-radius:12px; padding:10px; box-sizing:border-box; overflow:hidden; }
.dlh{ display:flex; flex-direction:column; justify-content:flex-end; padding:0 6px 8px; border-bottom:2px solid var(--c,var(--line-3)); overflow:hidden; }
.dlh.corner{ border-bottom-color:transparent; justify-content:flex-end; }
.dlh.corner span{ font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-4); }
.dlh b{ font-family:var(--disp); font-weight:600; font-size:13.5px; letter-spacing:.02em; text-transform:uppercase; color:var(--c,var(--ink)); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.1; }
.dlh small{ font-size:10.5px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:3px; }
.drh{ display:flex; flex-direction:column; justify-content:center; padding:0 8px; border-right:1px solid var(--line-2); }
.drh b{ font-family:var(--disp); font-weight:700; font-size:22px; letter-spacing:.06em; text-transform:uppercase; line-height:1; }
.drh small{ font-size:10.5px; color:var(--ink-3); margin-top:5px; line-height:1.2; }
.dc{ display:flex; flex-wrap:wrap; align-content:flex-start; gap:4px; padding:5px; border-radius:6px; background:rgba(255,255,255,.018); overflow:hidden; position:relative; }
.dc.cmd{ background:rgba(245,196,81,.035); }
.dc:not(.ppp) .dch{ font-size:11.5px; } .dc:not(.ppp) .dch.st{ padding:6px 7px 6px 7px; }
.dc.ppp{ background:rgba(127,176,230,.05); }
.dch{ display:inline-flex; align-items:center; gap:6px; border-radius:6px; font-size:12.5px; line-height:1.15; white-space:normal; max-width:100%; box-sizing:border-box; transition:opacity .4s, box-shadow .4s, filter .4s; }
.dch.st{ padding:7px 9px 7px 8px; background:var(--s3); border:1px solid var(--line-2); border-left:3px solid var(--c); font-weight:600; color:var(--ink); }
.dch.st i{ font-style:normal; font-family:var(--mono); font-size:10.5px; color:var(--ink-3); }
.dch.fn{ padding:5px 9px 5px 8px; border-radius:999px; background:color-mix(in srgb, var(--c) 16%, var(--s2)); border:1px solid color-mix(in srgb, var(--c) 40%, transparent); color:var(--ink); font-size:12px; }
.dch.fn::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--c); }
.dch.fn.bad{ border-style:dashed; color:var(--ink-2); }
.dc.d6 .dch{ font-size:11px; } .dc.d6 .dch.st{ padding:5px 7px 5px 6px; } .dc.d6 .dch.fn{ padding:4px 7px 4px 6px; font-size:10.5px; }
.dc.d9 .dch{ font-size:10px; gap:4px; } .dc.d9 .dch.st{ padding:4px 6px 4px 5px; } .dc.d9 .dch.fn{ padding:3px 6px 3px 5px; font-size:9.5px; } .dc.d9 .dch.st i{ display:none; }
.dc.d12 .dch.fn::before{ display:none; } .dc.d12 .dch{ font-size:9.5px; } .dc.d12{ gap:3px; padding:4px; }
.dboard.spot .dch{ opacity:.28; filter:saturate(.6); }
.dboard.spot .dc.hot{ opacity:1; box-shadow:inset 0 0 0 2px var(--gold), 0 0 24px rgba(245,196,81,.35); }
.dboard.spot .dc.hot .dch{ opacity:.6; }
.dcap.walk{ border-left-color:var(--teal); } .dcap.walk .ct .k{ color:var(--teal); }
.dboard.spot .dch.hot{ opacity:1; filter:none; box-shadow:0 0 0 2px var(--gold), 0 0 28px rgba(245,196,81,.45); z-index:3; animation:dpulse 1.6s ease-in-out 2; }
@keyframes dpulse{ 0%,100%{ box-shadow:0 0 0 2px var(--gold), 0 0 22px rgba(245,196,81,.35); } 50%{ box-shadow:0 0 0 3px var(--gold-2), 0 0 40px rgba(245,196,81,.7); } }
.dch.moving{ z-index:5; }
.dch.arrive{ animation:darrive .7s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes darrive{ from{ transform:scale(.4); opacity:0; } to{ transform:none; opacity:1; } }
.dghost{ position:absolute; border:1.5px dashed rgba(245,196,81,.55); border-radius:6px; pointer-events:none; animation:dghost 4.2s ease-out both; }
@keyframes dghost{ 0%{ opacity:.9; } 100%{ opacity:0; } }
.dleave{ position:absolute; pointer-events:none; animation:dleave .9s ease-in both; }
.dleave .dch{ opacity:1; }
@keyframes dleave{ to{ transform:scale(.6); opacity:0; filter:blur(2px); } }
.dboard.reveal .dch{ animation:darrive .6s ease-out both; }

/* принципи: радар часток виконаних умов */
.dprin{ background:var(--s1); border:1px solid var(--line); border-radius:12px; padding:12px 18px 10px; min-height:0; display:flex; flex-direction:column; }
.dprin .dh{ margin-bottom:4px; }
.prad{ position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
.dradar{ width:auto; height:100%; max-width:100%; display:block; overflow:visible; }
.dradar .ring{ fill:none; stroke:rgba(255,255,255,.07); stroke-width:1; }
.dradar .ring:last-of-type{ stroke:rgba(255,255,255,.14); }
.dradar .axis{ stroke:rgba(255,255,255,.09); stroke-width:1; }
.dradar .base{ fill:rgba(255,255,255,.035); stroke:rgba(255,255,255,.42); stroke-width:1.5; stroke-dasharray:5 5; }
.dradar .now{ fill:url(#rgf); stroke:var(--gold); stroke-width:2.2; stroke-linejoin:round; }
.dradar .now.flash{ animation:rflash 1.5s ease-in-out 2; }
@keyframes rflash{ 0%,100%{ stroke-width:2.2; } 50%{ stroke-width:4; stroke:var(--gold-2); } }
.dradar .vt .dot{ fill:var(--gold); stroke:#1a1405; stroke-width:2; }
.dradar .vt .halo{ fill:none; stroke:var(--gold); stroke-width:1.5; opacity:0; }
.dradar .vt.chg .halo{ animation:rhalo 1.5s ease-out 3; }
@keyframes rhalo{ 0%{ opacity:.9; r:6; } 100%{ opacity:0; r:26; } }
.dradar .vt.chg .dot{ fill:var(--gold-2); filter:drop-shadow(0 0 8px rgba(245,196,81,.9)); }
.dradar .lab .nm{ font-family:var(--disp); font-weight:600; font-size:15px; letter-spacing:.06em; text-transform:uppercase; fill:var(--ink-2); transition:fill .5s; }
.dradar .lab .nm .k{ font-size:19px; fill:var(--ink); }
.dradar .lab .nm .of{ font-family:var(--mono); font-size:11px; letter-spacing:.04em; text-transform:none; fill:var(--ink-3); }
.dradar .lab .pd{ fill:var(--s4); stroke:var(--line-3); stroke-width:1; transition:fill .6s, stroke .6s; }
.dradar .lab .pd.on{ fill:var(--gold); stroke:var(--gold); }
.dradar .lab .pd.half{ fill:url(#rgf); stroke:var(--gold); }
.dradar .lab.chg .nm{ fill:var(--gold); }
.dradar .lab.chg .nm .k{ fill:var(--gold-2); }
.dradar .lab.chg{ animation:rlab 1.5s ease-in-out 2; }
@keyframes rlab{ 0%,100%{ opacity:1; } 50%{ opacity:.55; } }
.rleg{ display:inline-flex !important; gap:0 8px; align-items:center; font-family:var(--mono); font-size:10.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-3); }
.rleg i{ width:11px; height:11px; border-radius:50%; background:var(--s4); border:1px solid var(--line-3); box-sizing:border-box; flex:none; margin-left:4px; }
.rleg i.on{ background:var(--gold); border-color:var(--gold); } .rleg i.half{ background:linear-gradient(90deg, var(--gold) 50%, var(--s4) 50%); border-color:var(--gold); }
.rleg .ln{ width:22px; height:0; border-radius:0; border:0; border-top:2px solid var(--gold); background:none; }
.rleg .ln.base{ border-top:2px dashed rgba(255,255,255,.5); }

/* п'ять чисел */
.dnums{ display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; }
.dn{ position:relative; background:var(--s1); border:1px solid var(--line); border-top:3px solid var(--c); border-radius:10px; padding:10px 12px 10px; display:flex; flex-direction:column; gap:6px; overflow:hidden; }
.dn .l{ font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); line-height:1.25; min-height:22px; }
.dn .v{ display:flex; align-items:baseline; gap:4px; }
.dn .v b{ font-family:var(--disp); font-weight:600; font-size:38px; line-height:.95; letter-spacing:.01em; font-variant-numeric:tabular-nums; }
.dn .v small{ font-family:var(--mono); font-size:14px; color:var(--ink-3); }
.dn .d{ font-family:var(--mono); font-size:11.5px; color:var(--ink-4); letter-spacing:.02em; white-space:nowrap; }
.dn .d.up{ color:var(--green); } .dn .d.down{ color:var(--red); }
.dn.changed::after{ content:""; position:absolute; inset:0; background:linear-gradient(120deg, transparent 30%, rgba(245,196,81,.18) 50%, transparent 70%); animation:dsweep 1.1s ease-out both; pointer-events:none; }
@keyframes dsweep{ from{ transform:translateX(-100%); } to{ transform:translateX(100%); } }

/* рішення зверху */
.ddec{ background:var(--s1); border:1px solid var(--line); border-radius:12px; padding:10px 18px 6px; display:flex; flex-direction:column; min-height:0; }
.dtl{ display:grid; grid-template-columns:252px 1fr; align-items:center; margin-bottom:2px; }
.dtl > span{ }
.dtl i{ display:none; }
.dtl{ position:relative; }
.dtl::after{ content:"GS · OC · AC · BDE · BN · COY · Soldier"; grid-column:2; font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-4); padding-left:2px; }
.drow{ display:grid; grid-template-columns:252px 1fr 160px; align-items:center; gap:12px; padding:1px 0; border-top:1px solid var(--line); transition:background .3s, box-shadow .3s; border-radius:8px; }
.drow.focus{ background:rgba(245,196,81,.08); box-shadow:inset 0 0 0 1px rgba(245,196,81,.5); padding-left:8px; padding-right:8px; }
.ddec .drow.changed{ background:rgba(255,255,255,.035); }
.drow .nm{ font-size:14px; font-weight:500; line-height:1.2; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.drow .vd{ font-family:var(--mono); font-size:12px; letter-spacing:.03em; color:var(--ink-3); text-align:right; }
.drow .vd b{ color:var(--red); font-weight:600; } .drow .vd b.g{ color:var(--green); }
.trk{ position:relative; height:25px; display:flex; align-items:center; justify-content:space-between; padding:0 10px; --step:calc((100% - 20px) / 6); }
.trk::before{ content:""; position:absolute; left:10px; right:10px; top:50%; height:2px; background:var(--line-2); transform:translateY(-50%); }
.trk .nd{ position:relative; width:12px; height:12px; border-radius:50%; background:var(--s4); border:2px solid var(--line-3); box-sizing:border-box; transition:background .5s, border-color .5s; }
.trk .nd.seen.ok{ background:var(--green); border-color:var(--green); }
.trk .nd.seen.warn{ background:var(--gold); border-color:var(--gold); }
.trk .nd.seen.block{ background:var(--red); border-color:var(--red); box-shadow:0 0 14px rgba(239,98,72,.6); }
.trk .tok{ position:absolute; top:50%; left:calc(10px + var(--from) * var(--step)); width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; background:var(--ink); box-shadow:0 0 0 4px rgba(255,255,255,.08), 0 0 18px rgba(255,255,255,.35); transition:left 1s cubic-bezier(.3,.7,.2,1), background .6s, box-shadow .6s; }
.drow.go .trk .tok{ left:calc(10px + var(--pos) * var(--step)); }
.drow.still .trk .tok{ transition:none; }
.drow.go .trk .tok.blk{ background:var(--red); box-shadow:0 0 0 4px rgba(239,98,72,.25), 0 0 22px rgba(239,98,72,.7); }
.drow.go .trk .tok.ok{ background:var(--green); box-shadow:0 0 0 4px rgba(79,209,139,.25), 0 0 22px rgba(79,209,139,.7); }

/* підпис ходу */
.dcap{ display:grid; grid-template-columns:auto 1fr; gap:36px; align-items:center; background:var(--s1); border:1px solid var(--line); border-left:4px solid var(--gold); border-radius:12px; padding:16px 26px; opacity:.001; transform:translateY(8px); transition:opacity .5s, transform .5s; }
.dcap.in, .dcap.idle, .dcap.focus{ opacity:1; transform:none; }
.dcap.idle{ border-left-color:var(--line-3); }
.dcap.focus{ border-left-color:var(--blue); }
.dcap .ct{ display:flex; flex-direction:column; gap:4px; min-width:340px; max-width:620px; }
.dcap .ct .k{ font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); }
.dcap.idle .ct .k{ color:var(--ink-4); } .dcap.focus .ct .k{ color:var(--blue); }
.dcap .ct b{ font-family:var(--disp); font-weight:600; font-size:26px; letter-spacing:.02em; line-height:1.1; text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.dcap .ct small{ font-size:12.5px; color:var(--ink-3); line-height:1.3; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.dcap .ci{ display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; }
.dcap .ci span{ font-size:18px; line-height:1.25; padding:8px 14px; border-radius:8px; background:var(--s2); border:1px solid var(--line-2); color:var(--ink-2); }
.dcap .ci span.good{ color:var(--green); border-color:rgba(79,209,139,.35); }
.dcap .ci span.bad{ color:var(--red); border-color:rgba(239,98,72,.35); }
.dcap .ci span.warn{ color:var(--gold); border-color:rgba(245,196,81,.35); }
.dcap .ci.dsteps span{ font-size:15px; padding:6px 11px; }
.dcap .ci.dsteps span b{ font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; margin-right:6px; opacity:.8; }
.dcap .ci span.dim{ color:var(--ink-3); font-size:15px; background:transparent; border-color:transparent; padding-left:0; }
.dhint{ position:absolute; right:48px; bottom:10px; font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-4); transition:opacity 1s; }
.dhint.gone{ opacity:0; }

</style>
</head>
<body>
<div class="app" id="app">
  <header class="head">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="#f2c14e" stroke-width="3"><rect x="4" y="4" width="14" height="14"/><rect x="22" y="4" width="14" height="14"/><rect x="4" y="22" width="14" height="14"/></g><rect x="22" y="22" width="14" height="14" fill="#f2c14e"/></svg>
      <div><h1>Poligon</h1><div class="sub">decision trainer · <b>personnel support</b> reform</div></div>
    </div>

  <div class="hero" id="hero">

/* ---------- шар принципів ----------
   Джерело одне: «Принципи лідерства Головнокомандувача ЗСУ» (PL). Три правила ваг:
   1) принципи рівні між собою (PL-16): 1/n, зведений бал не показується;
   2) фактор = одне дієслівне твердження з цитати, вага 1/m серед вимірюваних; невимірювані лишаються в дереві поза сумою;
   3) індикатор у факторі важить за силою свідчення: EV_WEIGHT за типом джерела.
   Нормалізація: x = clamp((факт − поріг) / (ціль − поріг), 0, 1). Поріг = нижня межа рушія або стан, який документ називає неприпустимим;
   ціль = формулювання принципу, переведене в число. Кожен поріг і ціль мають ev.

/* ПОЛІГОН · рушій: стан дошки, правила, обчислювач індикаторів, трасування. */
window.ENGINE = (function(D){
const { LEVELS, LIDX, LANES, FUNCS, STRUCTS, TOGGLES, PRESETS } = D;
const FMAP = Object.fromEntries(FUNCS.map(f=>[f.id,f]));
const SMAP = Object.fromEntries(STRUCTS.map(s=>[s.id,s]));
const li = id => LIDX[id];

/* ---------- стан ---------- */
function fromPreset(pid){
  const p = PRESETS.find(x=>x.id===pid) || PRESETS[0];
  const st = { preset:p.id, laneName:p.laneName, funcs:{}, structs:{}, toggles:{}, scen:[], scenBase:null };
  FUNCS.forEach(f=>{ const v=p.funcs[f.id]; st.funcs[f.id]= v ? {lane:v[0], depth:v[1]} : null; });
  p.structs.forEach(s=>{ if(typeof s==="string"){ const d=SMAP[s]; st.structs[s]={lane:d.lane, level:d.level}; } else st.structs[s.id]={lane:s.lane, level:s.level}; });
  TOGGLES.forEach(t=>{ st.toggles[t.id]= !!p.toggles[t.id]; });
  return st;
}
const clone = s => JSON.parse(JSON.stringify(s));

/* ---------- помічники доступу ---------- */
const FAM = { cmd:"staff", vsp:"staff" };
const fam = lane => FAM[lane]||lane;
function helpers(st){
  const fn = id => st.funcs[id] || null;
  const stc = id => st.structs[id] || null;
  const t = id => !!st.toggles[id];
  const reaches = (fid, lvl) => { const f=fn(fid); return !!f && li(f.depth) >= li(lvl); };
  const inLane = (fid, ...lanes) => { const f=fn(fid); return !!f && lanes.includes(f.lane); };
  const structsAt = (lane, lvl) => Object.entries(st.structs).filter(([id,p])=>p.lane===lane && p.level===lvl).map(([id])=>id);
  const lowestIn = lane => { let best=-1; Object.values(st.structs).forEach(p=>{ if(p.lane===lane) best=Math.max(best, li(p.level)); }); return best; };
  /* виконавець: у вертикалі на цьому рівні є структура тієї ж сім'ї («штаб» = командир + ВСП).
     Командир виконує сам усе, крім функцій групи «Дисципліна»: розслідування і аналіз правопорушень без групи з'ясування
     на цьому рівні повертаються на ЗК (TR-07, TR-08); решту командир веде особисто за Статутом (NM-06). Правка v0.6. */
  const hasExec = (lane, lvl) => Object.values(st.structs).some(p=>fam(p.lane)===fam(lane) && p.level===lvl);
  const execAt = (lane, lvl, fid) => lane==="cmd" && !(fid && FMAP[fid].group==="disc") ? true : hasExec(lane, lvl);
  const owned = fid => { const f=fn(fid); return !!f && execAt(f.lane, f.depth, fid); };
  return { fn, stc, t, reaches, inLane, structsAt, lowestIn, execAt, owned };
}
/* ---------- обмеження: що куди можна ставити ---------- */
const LANE_NAMES = Object.fromEntries(LANES.map(l=>[l.id,l.short]));
function canPlace(kind, id, lane, level){
  if(kind==="fn"){ const f=FMAP[id]; if(!f) return {ok:false, why:"невідомий блок"}; if(!f.lanes.includes(lane)) return {ok:false, why:`«${f.short}» не може вести вертикаль «${LANE_NAMES[lane]}»: дозволено ${f.lanes.map(l=>LANE_NAMES[l]).join(", ")}`}; return {ok:true}; }
  const d=SMAP[id]; if(!d) return {ok:false, why:"невідомий блок"};
  if(!d.lanes.includes(lane)) return {ok:false, why:`${d.short}: посада не може підпорядковуватись вертикалі «${LANE_NAMES[lane]}»; дозволено ${d.lanes.map(l=>LANE_NAMES[l]).join(", ")}`};
  if(d.level!==level) return {ok:false, why:`${d.short}: посада рівня «${LEVELS[li(d.level)].short}», на інший рівень її не перенести; для іншого рівня є окремі блоки`};
  return {ok:true};
}

const COST = {

/* ---------- правила ----------
   Кожне правило: людська умова (when), машинна (test), ефекти (apply). */
const RULES = [
  { id:"R01", title:"Розслідування у вертикалі напряму до роти", when:"Блок «Розслідування» у вертикалі напряму доходить до роти",

  { id:"R02", title:"Розслідування у вертикалі напряму, групи у бригаді й батальйоні", when:"«Розслідування» у вертикалі напряму, найнижче батальйон (групи з'ясування під заступником)",
    test:h=> h.owned("invest") && h.inLane("invest","ppp") && !h.reaches("invest","coy"),
    apply:(r,h)=>{ r.cost("invest",r.k("r02_invest"),"пояснення від роти"); r.cost("szch",r.k("r02_szch")); r.cost("alco",r.k("r02_alco")); r.cost("ret",r.k("r02_ret")); r.risk("help_control"); r.barrier("punish",r.k("r02_punish")); r.q("Хто координує групи з'ясування, якщо вони під заступником з ППП: він же готує документи на покарання"); r.ev("GU-17","TR-05","KC-18"); } },
  { id:"R03", title:"Розслідування під штабом, ВСП або юристом до батальйону", when:"«Розслідування» у вертикалі командира, ВСП або юристів і доходить до батальйону",
    test:h=> h.owned("invest") && h.inLane("invest","vsp","cmd") && h.reaches("invest","bn"),
    apply:(r,h)=>{ r.cost("invest",r.k("r03_invest"),"передача 2-3 пояснень"); r.cost("szch",r.k("r03_szch")); r.cost("alco",r.k("r03_alco")); r.cost("ret",r.k("r03_ret")); r.barrier("punish",r.k("r03_punish")); r.norm("vsp","підпорядкування і координатор груп з'ясування"); r.ev("TR-08","KC-17"); } },
  { id:"R04", title:"Розслідування під штабом лише на бригаді", when:"«Розслідування» поза напрямом, але найнижче бригада: батальйонної ланки немає",
    test:h=> h.owned("invest") && h.inLane("invest","vsp","cmd") && !h.reaches("invest","bn"),
    apply:(r,h)=>{ r.cost("invest",r.k("r04_invest"),"колізія: у батальйоні груп немає"); r.cost("szch",r.k("r04_szch")); r.cost("alco",r.k("r04_alco")); r.cost("ret",r.k("r04_ret")); r.risk("no_coord"); r.barrier("punish",r.k("r04_punish")); r.ev("TR-07","TR-09"); } },
  { id:"R05", title:"Розслідування без виконавця", when:"Блок «Розслідування» знято з дошки або призначений вертикалі, де на цьому рівні немає структури",
    test:h=> !h.owned("invest"),
    apply:(r,h)=>{ r.cost("invest",r.k("r05_invest"),"без власника стікає на ЗКР"); r.cost("szch",r.k("r05_szch")); r.cost("alco",r.k("r05_alco")); r.cost("ret",r.k("r05_ret")); r.risk("drain_down"); r.risk("help_control"); r.barrier("punish",r.k("r05_punish")); r.owner("invest","drain"); r.ev("KC-27","NM-01"); } },

    apply:(r,h)=>{ r.risk("no_coord"); r.q("Хто веде облік, аналіз причин і профілактику СЗЧ, якщо ВСП відповідає лише за факт"); r.ev("TR-05","TR-10"); } },
  { id:"R07", title:"Аналіз правопорушень у напрямі без збільшення чисельності", when:"«Аналіз СЗЧ» у вертикалі напряму",
    test:h=> h.inLane("analysis","ppp"),

    test:h=> h.owned("social") && !h.inLane("social","ppp") && !h.reaches("social","coy"),
